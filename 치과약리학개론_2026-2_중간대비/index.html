<title>치과약리학개론 중간 대비</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@400;700&display=swap">
<style>
/* layout: header + tab bar over a two-column workspace (OMR rail | cards); exam mode collapses to a single black-on-white serif column */
:root{
  --bg:#f4f6f8; --panel:#ffffff; --ink:#15202b; --mut:#566471; --line:#d6dce2; --line2:#e8ecf0;
  --acc:#1d5c8a; --acc-ink:#ffffff; --acc-soft:#e2edf5; --ok:#17733f; --ok-soft:#e1f3e8; --bad:#b3261e; --bad-soft:#fbe7e5;
  --chip:#eef1f4; --shadow:0 1px 0 rgba(20,32,43,.04);
  --sans:'Noto Sans KR',system-ui,-apple-system,'Segoe UI',sans-serif; --serif:'Noto Serif KR','Batang','Times New Roman',serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1317; --panel:#151c22; --ink:#e6ebef; --mut:#93a1ad; --line:#2a353e; --line2:#202a31;
  --acc:#79b8e4; --acc-ink:#0b1a24; --acc-soft:#19293a; --ok:#63c98f; --ok-soft:#14291f; --bad:#ff8f86; --bad-soft:#35201f; --chip:#1c252c; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1317; --panel:#151c22; --ink:#e6ebef; --mut:#93a1ad; --line:#2a353e; --line2:#202a31;
  --acc:#79b8e4; --acc-ink:#0b1a24; --acc-soft:#19293a; --ok:#63c98f; --ok-soft:#14291f; --bad:#ff8f86; --bad-soft:#35201f; --chip:#1c252c; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:14px/1.6 var(--sans);margin:0;padding-inline:16px;padding-block:0 48px;-webkit-text-size-adjust:100%}
.wrap{max-width:1240px;margin-inline:auto}
header.top{padding-block:18px 10px}
h1{font-size:22px;line-height:1.3;margin:0 0 4px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--mut);margin:0 0 10px;max-width:70ch}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--chip);border:1px solid var(--line2);border-radius:999px;padding:1px 10px;font-size:12px;color:var(--ink);white-space:nowrap}
.chip b{font-weight:700}
.chip.acc{background:var(--acc-soft);border-color:transparent;color:var(--acc)}
.diag{font:12px var(--mono);color:var(--mut)}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:2px;overflow-x:auto;padding-top:4px}
nav.tabs button{appearance:none;border:0;background:none;color:var(--mut);font:500 14px var(--sans);padding:9px 14px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--acc);font-weight:700}
nav.tabs button:focus-visible,.btn:focus-visible,.omr-c:focus-visible,summary:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.bar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:12px 0 8px}
.bar .grp{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.bar .lbl{font-size:12px;color:var(--mut);margin-right:2px}
.pill{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;font:12px var(--sans);padding:3px 11px;cursor:pointer}
.pill[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:700}
.btn{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;font:500 13px var(--sans);padding:5px 12px;cursor:pointer}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:700}
.btn.sm{padding:2px 9px;font-size:12px}
.work{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
@media (min-width:920px){.work.has-omr{grid-template-columns:232px minmax(0,1fr)}}
@media (min-width:920px){.work.has-omr.wide{grid-template-columns:372px minmax(0,1fr)}}
aside.omr{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:12px;position:sticky;top:calc(44px + env(safe-area-inset-top,0px));max-height:calc(100vh - 60px);overflow:auto}
aside.omr summary{font-weight:700;cursor:pointer;margin-bottom:6px}
@media (min-width:920px){aside.omr summary{pointer-events:none;list-style:none}aside.omr summary::-webkit-details-marker{display:none}}
.omr-row{display:flex;align-items:center;gap:4px;padding:2px 0}
.omr-n{font:11px var(--mono);width:34px;color:var(--mut);cursor:pointer;text-decoration:underline dotted}
.omr-c{width:18px;height:18px;border-radius:50%;border:1px solid var(--mut);background:transparent;color:var(--mut);font:600 10px/16px var(--sans);text-align:center;padding:0;cursor:pointer;position:relative}
.omr-c::after{content:"";position:absolute;inset:-4px}
.omr-c.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.omr-row.ok .omr-c.on{background:var(--ok);border-color:var(--ok);color:#fff}
.omr-row.no .omr-c.on{background:var(--bad);border-color:var(--bad);color:#fff}
.omr-row.ok .omr-n{color:var(--ok)} .omr-row.no .omr-n{color:var(--bad)}
.omr.two .omr-list{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.score{margin-top:8px;padding-top:8px;border-top:1px solid var(--line2)}
.score b{font-size:15px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin:0 0 12px;box-shadow:var(--shadow);scroll-margin-top:60px}
.card.focus{outline:2px solid var(--acc)}
.card .hd{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.cid{font:12px var(--mono);color:var(--mut)}
.badge{font-size:11px;border-radius:4px;padding:0 6px;border:1px solid var(--line);color:var(--mut);background:var(--panel);line-height:18px;white-space:nowrap}
.st-확정{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.st-사용자{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:700}
.st-교차확인{border-color:var(--acc);color:var(--acc);font-weight:700}
.st-추정{border-style:dashed;color:var(--ink)}
.st-충돌{border:2px solid var(--ink);color:var(--ink);font-weight:700;background:repeating-linear-gradient(135deg,transparent 0 4px,var(--line) 4px 5px)}
.st-추론{border-style:dotted;border-width:2px;font-style:italic;color:var(--ink)}
.st-미확정{opacity:.7}
.tier{font:600 10px var(--mono);border:1px solid var(--line);border-radius:3px;padding:0 4px;color:var(--mut)}
.stem{white-space:pre-wrap;margin:0 0 8px;font-size:15px}
.opts{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:3px}
.opts li{display:flex;gap:8px;align-items:flex-start;padding:4px 8px;border-radius:6px;cursor:pointer;border:1px solid transparent}
.opts li:hover{background:var(--chip)}
.opts li .no{font-weight:700;min-width:1.4em;color:var(--mut)}
.opts li.sel{background:var(--acc-soft);border-color:var(--acc)}
.opts li.ans .no::after{content:" ✓";color:var(--ok)}
.opts li.ans{background:var(--ok-soft)}
.opts li.wrong{background:var(--bad-soft)}
.fig{margin:8px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start}
.fig figure{margin:0;max-width:100%}
.fig img{max-width:min(100%,520px);height:auto;border:1px solid var(--line2);border-radius:4px;background:#fff;display:block}
.fig figcaption{font-size:11px;color:var(--mut);margin-top:2px}
.ansbox{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px;font-size:13px}
.ansbox h4{margin:8px 0 4px;font-size:12px;color:var(--mut);letter-spacing:.04em;text-transform:uppercase}
.ev{margin:0;padding:0;list-style:none;display:grid;gap:3px}
.ev li{font-size:12.5px}
.ev q{color:var(--ink)}
.note{background:var(--chip);border-radius:6px;padding:6px 10px;font-size:12.5px;margin:6px 0}
.note .tag{font-weight:700;color:var(--acc)}
.conf{border-left:3px solid var(--ink);padding-left:10px;margin:6px 0;font-size:12.5px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sec{margin:20px 0 6px;font-size:15px;font-weight:700}
.muted{color:var(--mut)}
table.t{border-collapse:collapse;width:100%;font-size:12.5px}
table.t th,table.t td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
table.t th{background:var(--chip);font-weight:700}
.tw{overflow-x:auto;margin:6px 0 10px}
details.cd{background:var(--panel);border:1px solid var(--line);border-radius:8px;margin:0 0 10px}
details.cd>summary{padding:10px 14px;cursor:pointer;font-weight:700;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
details.cd>div.in{padding:2px 16px 14px}
details.cd ul{margin:4px 0 8px;padding-left:18px}
.lnk{font:12px var(--mono);color:var(--acc);cursor:pointer;text-decoration:underline;background:none;border:0;padding:0}
abbr.ab{border-bottom:1px dotted var(--acc);text-decoration:none;cursor:help}
.codebox{font:12px/1.5 var(--mono);background:var(--chip);border:1px solid var(--line);border-radius:6px;padding:10px;white-space:pre-wrap;overflow:auto;max-height:420px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
input[type=text],textarea,select{font:13px var(--sans);border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);padding:4px 8px;max-width:100%}
.hidden-ans{display:none}
/* exam paper mode */
body.exam{background:#fff;color:#000;font-family:var(--serif)}
body.exam .card{background:#fff;border:0;border-bottom:1px solid #000;border-radius:0;box-shadow:none;padding:12px 0}
body.exam .stem{font-family:var(--serif);color:#000}
body.exam .opts li{cursor:pointer;color:#000} body.exam .opts li.sel{background:#e9e9e9;border-color:#000}
body{--x:0}
body.exam{--bg:#fff;--ink:#000;--mut:#333;--panel:#fff;--line:#000;--line2:#bbb;--chip:#eee;--acc:#000;--acc-soft:#e9e9e9;--ok:#000;--bad:#000}
body.exam .badge,body.exam .tier,body.exam .cid,body.exam .ansbox,body.exam .note,body.exam .noexam,body.exam abbr.ab{display:none!important}
body.exam .cid.keep{display:inline!important;color:#000}
body.exam .chips,body.exam .diag,body.exam .sub,body.exam p.muted{display:none}
body.exam.showans .ansbox{display:block!important}
body.exam.showans .ansbox .badge,body.exam.showans .ansbox .tier{display:inline-block!important}
body.exam aside.omr{background:#fff;border-color:#000;color:#000}
body.exam .omr-c{border-color:#000;color:#000} body.exam .omr-c.on{background:#000;color:#fff}
body.exam .fig img{border-color:#000}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) body.exam{background:#fff;color:#000}}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
</style>

 efficacy (기출 7회 이상)", "약물–수용체 복합체 수를 결정하는 요소 = affinity"], "notes": ["교안에는 potency·여분수용체(spare receptor)의 정의 서술이 없음 → 해당 기출은 ‘교안 근거 없음/부족’으로 표기."], "src": ["Ch.2 p.8–11, 17–18"], "rel": ["2.efficacy", "2.affinity", "2.partial-agonist", "2.agonist", "2.affinity-efficacy", "2.potency"]}, {"id": "C2-C", "ch": 2, "k": "2.", "title": "길항제: 경쟁적·비가역적·allosteric", "tables": [{"title": "용량–반응 곡선에 미치는 영향(교안 p.12–15)", "head": ["길항제", "결합", "곡선 변화"], "rows": [["Competitive (reversible)", "agonist와 같은 부위, 가역적", "log 농도–효과 곡선이 기울기·최대효과 변화 없이 오른쪽 이동(이동 정도 = dose ratio) → EC50(ED50) 증가"], ["Irreversible", "활성 부위에 공유결합 → 사용 가능한 수용체 수 영구 감소", "Emax 하향 이동, EC50 이동 없음"], ["Allosteric", "다른 부위(allosteric site)", "Emax 하향 이동, EC50 변화 없음"]], "src": "Ch.2 p.12–15"}], "core": ["캡션(p.13): EC50 = drug dose that shows 50% of maximal response"], "mem": ["경쟁적: → 오른쪽 평행이동(효력↓) / 비가역·allosteric: Emax↓·EC50 불변"], "notes": ["충돌 기록: 20학번 9번 typed 키 ③(오른쪽 이동)은 교안 p.12(비가역적 = Emax 하향)와 불일치 — 24학번 복기(“EC50 유지, Emax 감소”)가 교안과 일치."], "src": ["Ch.2 p.12–15"], "rel": ["2.competitive-antagonist", "2.irreversible-antagonist", "2.allosteric"], "figs": ["L2_13"]}, {"id": "C2-D", "ch": 2, "k": "2.", "title": "길항 작용의 3종 범주", "tables": [{"title": "교안 p.16", "head": ["범주", "정의", "교안 예"], "rows": [["Chemical antagonism", "용액 속 상호작용", "chelating agents(dimercaprol), neutralising antibody(infliximab)"], ["Pharmacokinetic antagonism", "한 약물이 다른 약물의 흡수·대사·배설에 영향", "cimetidine — lidocaine"], ["Physiological antagonism", "서로 반대되는 생리 작용을 내는 두 약물", "histamine — epinephrine"]], "src": "Ch.2 p.16"}], "mem": ["gentamicin+ampicillin(주사기 침전) → chemical / heparin+protamine(이온쌍) → chemical / histamine·epinephrine → physiological / warfarin·phenytoin(혈장단백 결합 경쟁) → pharmacokinetic"], "notes": ["위 4개 사례는 교안에 없고(교안은 범주 정의와 교안 예만), 기출 정답은 범주 정의에 대입해 판단.", "20학번 20번 typed 키 ④(noncompetitive)는 교안 정의와 불일치 → 수기 ③ physiological antagonism(충돌 기록)."], "src": ["Ch.2 p.16"], "rel": ["2.antagonism-types", "2.chemical-antagonism", "2.physiological-antagonism"]}, {"id": "C2-E", "ch": 2, "k": "2.", "title": "Two-state 모델 · inverse agonist", "core": ["two-state 모델: efficacy는 휴지 상태(R)와 활성 상태(R*)에 대한 화합물의 상대적 affinity를 반영 — p.18", "Agonist: 활성 상태(R*) 선택, Antagonist: 선택성 없음 — p.18", "Inverse agonist: 휴지 상태에 선택성; 수용체가 constitutive activity를 보일 때만 의미 — p.17"], "mem": ["그림 빈칸: 위 왼쪽(R로 가는 굵은 화살표) = inverse agonist, 위 오른쪽(R*로) = agonist, 아래 = antagonist"], "src": ["Ch.2 p.17–18"], "rel": ["2.two-state", "2.inverse-agonist"], "figs": ["L2_18"]}, {"id": "C2-F", "ch": 2, "k": "2.", "title": "치료지수(TI) · 점유 이론", "core": ["TI = TD50/ED50 (ED50 median effective dose, TD50 median toxic dose) — p.19", "큰 값 = 넓은 안전역, 작은 값 = 좁은 안전역, Safe drug: TI 10 이상 — p.19", "그림: warfarin은 Small therapeutic index(치료 창이 좁다), penicillin은 Large therapeutic index — p.19", "점유 이론: 가역적으로 결합하는 약물의 반응 크기는 점유 수용체 수에 비례. D + R ⇄ DR → Effect; Effect = Emax × [D]/(KD + [D]); KD(해리상수) = k2/k1 — p.21", "점유 이론의 한계(Limitation of occupation theory) 존재 — p.22"], "mem": ["안전역 비교: TD50/ED50가 가장 큰 쪽(기출: 20/0.5=40 vs 3.75/2.5=1.5 …)", "TI=2 → 효과 용량과 독성 용량이 비슷(24학번 13번)"], "src": ["Ch.2 p.19–22"], "rel": ["2.TI", "2.safety-margin", "2.occupation", "2.potency-table"], "figs": ["L2_19"]}, {"id": "C2-G", "ch": 2, "k": "2.", "title": "수용체 조절 · 급성/지연 반응", "core": ["수용체 조절 소제목: Desensitization, Down-regulation, Up-regulation, Spare receptor — p.23(정의 서술 없음)", "약물은 주로 세포 표적에 작용: 생화학·세포·생리·구조 수준의 효과 — p.24", "표적에 대한 직접 효과 → 생화학적·세포·생리 수준의 급성 반응 — p.24", "수용체의 지속 활성화 → 지연 장기 효과: desensitization·down-regulation, 조직 hypertrophy·atrophy·remodelling, tolerance, dependence and addiction — p.24", "지연 반응은 유전자 발현 변화에서 비롯 — p.24", "치료 효과는 급성 반응(예: asthma의 bronchodilator) 또는 지연 반응(예: antidepressants)에 기반 — p.24; 일부 약물은 유전자 발현에 직접 작용해 지연 반응을 만든다 — p.25 그림"], "notes": ["desensitization/down-/up-regulation·spare receptor의 정의는 교안에 없고 소제목만 있음 → 정의는 선배 필기(T2′)에만 있음(필기 대조 참조)."], "src": ["Ch.2 p.23–25"], "rel": ["2.acute-delayed", "2.gene-expression", "2.spare-receptor"]}, {"id": "C3-A",  · G protein 주기", "core": ["metabotropic(7-TDM) receptor; 7개 membrane-spanning α-helix — p.9", "G protein: α·β·γ 3 subunit의 막 단백질, α subunit이 GTPase 활성 — p.9", "N-terminal는 세포외, C-terminal는 세포내; 세 번째 cytoplasmic loop(TM V–VI)가 G protein과 상호작용; C 말단 tail의 Ser/Thr 인산화는 receptor–G protein 상호작용을 약화 — p.11", "주기(p.14): agonist 결합 수용체와 α subunit 결합 → 결합 GDP가 GTP로 교체 → α-GTP가 수용체·βγ에서 분리되어 표적(효소/이온통로)과 작용 → 표적 결합 시 GTPase 활성 증가 → GTP가 GDP로 가수분해 → α가 βγ와 재결합", "Family A(rhodopsin, 가장 큼, amine neurotransmitter·neuropeptide·purine·prostanoid·cannabinoid; N-terminal 짧음), B(secretin/glucagon: peptide hormone), C(metabotropic glutamate/Ca2+ sensor, GABAB; N-terminal 김) — p.12", "GPCR 예: muscarinic ACh receptors, adrenoceptors, neuropeptide·chemokine receptors, proteinase-activated receptors — p.10"], "mem": ["agonist가 결합한 수용체에 α가 결합한 직후 = GDP→GTP 교체(기출 6회)", "GPCR 아닌 것 = NMDA(LGIC), Vit A receptor(nuclear)"], "src": ["Ch.3 p.9–15"], "rel": ["3.GPCR", "3.GPCR-structure", "3.G-protein-cycle", "3.GPCR-muscarinic", "3.pertussis"], "figs": ["L3_14"]}, {"id": "C3-D", "ch": 3, "k": "3.", "title": "G protein 아형과 독소", "tables": [{"title": "교안 p.16", "head": ["아형", "주 effector", "비고"], "rows": [["Gαs", "adenylyl cyclase 자극 → cAMP 증가", "cholera toxin이 GTPase 활성을 차단 → 불활성화를 막아 지속 활성"], ["Gαi", "adenylyl cyclase 억제 → cAMP 감소", "pertussis toxin이 αβγ 복합체의 해리를 막아 차단"], ["Gαo", "α subunit 효과 제한적(주로 βγ 효과)", "pertussis toxin에 의해 차단; 주로 신경계"], ["Gαq", "phospholipase C 활성화 → IP3·DAG 증가 → 세포 내 Ca2+ 유리, PKC 활성화", ""], ["Gα12/13", "Rho 활성화 → Rho kinase", ""], ["Gβγ", "K+ channel 활성화, voltage-gated Ca2+ channel 억제, GPCR kinase·MAP kinase cascade 활성화", "PLCβ·일부 adenylyl cyclase와도 상호작용"]], "src": "Ch.3 p.16"}], "mem": ["cholera → Gαs “지속 활성” / pertussis → Gαi “차단” (24학번 24번 문구는 ‘지속적으로 활성화’로 복기되어 오기 병기)", "Gαs와 Gαi는 같은 효소(AC)를 반대로 조절 — p.15 그림"], "src": ["Ch.3 p.15–16"], "rel": ["3.cholera", "3.pertussis", "3.G-subtypes", "3.cAMP-Gs"], "figs": []}, {"id": "C3-E", "ch": 3, "k": "3.", "title": "Second messenger 경로", "core": ["AC/cAMP: adenylyl cyclase가 cAMP 합성 → protein kinase A(PKA)가 효소·운반체·단백질을 인산화해 세포 기능 조절 — p.17", "PLC/IP3/DAG: phospholipase C가 막 인지질에서 IP3와 DAG 생성 — p.19", "IP3: 세포 내 저장소(intracellular compartments)에서 Ca2+ 유리 → 수축·분비·효소 활성화·막 과분극 개시 — p.19", "DAG: protein kinase C(PKC) isoform 활성화 → 단백질 인산화 — p.19", "이온통로: K+ channel 개방(과분극), Ca2+ channel 억제(신경전달물질 유리 감소); phospholipase A2 → arachidonic acid·eicosanoid — p.20", "PIP2 절단: PLA2 → arachidonic acid, PLC → IP3·DAG, PLD → PA — p.21"], "mem": ["PKA ← cAMP / PKC ← DAG / Ca2+ 유리 ← IP3 (3쌍 혼동 주의; 24학번 30번 복기 “DAG와 cAMP”는 충돌 기록)", "Li+의 inositol 1-phosphatase 억제는 교안에 없음(기출 7개 학번 키)"], "notes": ["교안에 PDE(cAMP 분해) 서술 없음 → 15학번 31번 PDE 답은 교안 밖."], "src": ["Ch.3 p.17–23"], "rel": ["3.cAMP-PKA", "3.IP3", "3.DAG-PKC", "3.PLC", "3.Li", "3.cAMP", "3.second-messenger"]}, {"id": "C3-F", "ch": 3, "k": "3.", "title": "탈감작(GRK·arrestin) · protease-activated receptor", "core": ["GPCR 장기 활성화 시: GRK(G protein-coupled receptor kinase)가 막으로 동원되어 수용체를 인산화 → arrestin 결합 → clathrin-coated pit로 이동, dynamin 의존 endosome 내재화 → PP2A에 의한 탈인산화 후 막으로 재순환 또는 lysosome에서 분해 — p.24", "PAR: N-terminal 세포외 domain의 단백질 분해(cleavage)로 활성화, 인산화로 불활성화, 회복에는 수용체 재합성 필요 — p.13"], "mem": ["“proteolytic cleavage로 활성화 · phosphorylation으로 불활성화” = thrombin receptor(PAR) (기출 4회)"], "notes": ["thrombin이라는 약물명은 교안에 없음; PAR 일반 서술만 교안(기출 정답은 개념으로 대응)."], "src": ["Ch.3 p.13, 24"], "rel": ["3.PAR", "3.desensitization"], "figs": []}, {"id": "C3-G", "ch": 3, "k": "3.", "title": "Kinase-linked receptor · 인산화 · phosphatase", "core": ["growth factor 수용체: 세포내 domain에 tyrosine kinase 내장 / cytokine 수용체: 세포내 domain이 세포질 kinase를 결합·활성화 — p.25", "공통 구조: 큰 세포외 리간드 결합 domain + 단일 membrane-spanning helix + 세포내 domain — p.25", "신호전달: 수용체 이량체화 → tyrosine 잔기 자가인산화 → phosphotyrosine이 SH2 domain 단백질의 acceptor — p.25", "세포 성장·분화 조절, 유전자 전사 조절을 통한 간접 작용 — p.26", "Ras/Raf/MAP kinase pathway: 세포 분열·성장·분화 / Jak/Stat pathway: 많은 cytokine에 의해 활성, 염증 매개물질 합성·유리 조절 — p.26", "kinase cascade는 수용체 매개 사건을 증폭; 많은 phosphatase가 단백질을 탈인산화해 kinase 효과를 반전 — p.29"], "mem": ["single transmembrane helix = kinase-linked(cytokine receptor) / seven = GPCR", "Ras/Raf/MAP ← growth factor, Jak/Stat ← cytokine"], "notes": ["20학번 39번 typed 키 ②(세포막 확산·수용체 결합)는 steroid(nuclear) 서술과 같음 → 교안 p.25는 cytokine = 세포질 kinase 결합. 충돌 기록."], "src": ["Ch.3 p.25–30"], "rel": ["3.kinase-linked", "3.Ras", "3.Jak-Stat", "3.phosphatase", "3.single-TM", "3.cytokine-signaling"], "figs": ["L3_28"]}, {"id": "C3-H", "ch": 3, "k": "3.", "title": "Nuclear receptor", "tables": [{"title": "교안 p.31", "head": ["구분", "위치", "이합체", "리간드"], "rows": [["Class I", "세포질(리간드 결합 시 핵으로 이동)", "homodimer", "주로 내분비(endocrine)성: steroid hormone 등"], ["Class II", "핵에 상재(constitutively present)", "retinoid X receptor(RXR)와 heterodimer", "주로 지질(lipids, 예: fatty acids)"]], "src": "Ch.3 p.31"}], "core": ["48종의 가용성 수용체; 지질·호르몬 신호를 감지해 유전자 전사 조절. 리간드: steroid drug/hormone, thyroid hormone, vitamin A·D, 지질, xenobiotics — p.31", "리간드-수용체 복합체는 유전자 promoter의 hormone response element에 결합하고 co-activator/co-repressor를 동원 — p.32", "처방 약물의 약 10%가 NR의 표적, NR이 조절하는 효소는 처방 약물의 약 60%의 약동학에 영향 — p.32", "DNA 결합 domain = zinc finger 2개; RXR과 heterodimer로 육량체 AGGTCA의 반복(direct/everted/inverted)에 결합 — p.33"], "mem": ["“10% 표적 · 약동학 영향” = nuclear receptor", "insulin은 nuclear receptor 리간드가 아님(20학번 46번)"], "src": ["Ch.3 p.31–33"], "rel": ["3.nuclear", "3.nuclear-class", "3.nuclear-HRE", "3.nuclear-10pct", "3.nuclear-DNA", "3.nuclear-ligand", "3.steroid-signaling"], "figs": ["L3_33"]}], "senior": [{"text": "GABAA 수용체: 작용제는 진정, 일부 역작용제는 불안·초조 유발(기저 활성↓)", "kind": "강조", "rel": "교안밖", "conf": "중", "unit": "Ch.2·3"}, {"text": "TI 10 이상을 안전으로 판단; Therapeutic Window = 최소 유효농도와 최소 독성농도 사이", "kind": "교안보충", "rel": "보강", "conf": "상", "unit": "Ch.2"}, {"text": "Occupation theory: 약물–수용체 1:1 결합 전제의 한계", "kind": "교안보충", "rel": "교안밖", "conf": "중", "unit": "Ch.2"}, {"text": "Spare receptor: 비경쟁적 길항제(allosteric 등)가 여분 수용체를 점유 → 그래프가 오른쪽으로 살짝 길어짐", "kind": "    case 'abbr':S.abbr=!S.abbr;render();break;
   case 'toggle':S.show[id]=!S.show[id];keepScroll(id);break;
   case 'opt':case 'omr':{var key=t.dataset.key||'mc';var m=(key==='mock'?MARK:OMR);var k=+t.dataset.k;var a=m[id]||[];var i=a.indexOf(k);if(i>=0)a.splice(i,1);else a.push(k);m[id]=a;store.set(key==='mock'?'mmark':'omr',m);S.graded=null;keepScroll(id);break}
   case 'newopt':break;
   case 'ua':{var u=UA[id]||{a:[],reason:''};var k2=+t.dataset.k;var j=u.a.indexOf(k2);if(j>=0)u.a.splice(j,1);else u.a.push(k2);u.a.sort();UA[id]=u;if(!u.a.length)delete UA[id];store.set('ua',UA);S.show[id]=true;keepScroll(id);break}
   case 'uaclear':delete UA[id];store.set('ua',UA);keepScroll(id);break;
   case 'go':case 'goq':S.tab='mc';S.unit=0;S.cls='all';S.st={};S.focus=id;S.show[id]=(act==='go')?true:S.show[id];render();setTimeout(function(){scrollToId('q_'+id)},30);break;
   case 'gocard':S.tab='sum';S.unit=0;S.cardOpen=id;render();setTimeout(function(){var d=document.getElementById('c_'+id);if(d){d.open=true;d.scrollIntoView({block:'start'})}},30);break;
   case 'clearomr':OMR={};store.set('omr',OMR);S.graded=null;render();break;
   case 'grade':grade();break;
   case 'redraw':drawMock();render();break;
   case 'minew':S.mockOpts.inclNew=!S.mockOpts.inclNew;MOCK=null;drawMock();render();break;
   case 'miest':S.mockOpts.inclEst=!S.mockOpts.inclEst;MOCK=null;drawMock();render();break;
   case 'tstart':{var T=S.timer;if(T.run){T.acc+=Date.now()-T.t0;T.run=false}else{T.t0=Date.now();T.run=true}timerTick();break}
   case 'treset':S.timer={t0:0,acc:0,run:false};timerTick();break;
   case 'export':doExport();break;
   case 'copylim':copyText($('#limits').textContent,t);break;
  }});
document.addEventListener('input',function(ev){var t=ev.target;if(t.dataset&&t.dataset.act==='uareason'){var u=UA[t.dataset.id];if(u){u.reason=t.value;store.set('ua',UA)}}});
function keepScroll(){var y=window.scrollY;render();window.scrollTo(0,y)}
function grade(){
  var list=S.list||[];var key=S.tab==='mock'?MARK:OMR;var g={};var ok=0,n=0,marked=0,estN=0,estOk=0;
  list.forEach(function(it){
    var m=(key[it.id]||[]).slice().sort(function(x,y){return x-y});var A=effAns(it);if(m.length)marked++;
    if(!A||!m.length)return;
    var As=A.slice().sort(function(x,y){return x-y});
    var good=m.length===As.length&&m.every(function(x,i){return x===As[i]});
    var strict=gradable(it)||!!it.isNew;
    if(strict||S.tab==='mock')g[it.id]={ok:good};
    if(strict){n++;if(good)ok++}
    estN++;if(good)estOk++});
  g._sum={ok:ok,n:n,marked:marked,estN:(S.tab==='mock'?estN:null),estOk:estOk};
  S.graded=g;keepScroll()}
function doExport(){
  var ids=Object.keys(UA).filter(function(id){return UA[id].a&&UA[id].a.length});
  var o={exported_at:new Date().toISOString().slice(0,10),user_answers:ids.map(function(id){var it=byId[id];return {id:(it&&it.gb)||id,alias:id,answer:UA[id].a,reason:UA[id].reason||''}})};
  var txt=JSON.stringify(o);
  copyText(txt,null,function(ok){var b=$('#exportbox');if(b)b.innerHTML=(ok?'<div class="note">지정한 정답 '+ids.length+'건을 클립보드에 복사했습니다. 대화창에 붙여 넣어 주세요. (가공본 ID가 없어 id에도 별칭을 담았습니다)</div>':'<div class="note">클립보드 복사가 막혀 있어 아래 상자에 표시합니다. 직접 복사해 주세요.</div>')+'<textarea id="exp" rows="4" style="width:100%" readonly>'+esc(txt)+'</textarea>';var e=$('#exp');if(e&&!ok){e.focus();e.select()}})}
function copyText(txt,btn,cb){
  var done=function(ok){if(cb)cb(ok);else if(btn){btn.textContent=ok?'복사됨':'복사 실패 — 직접 선택해 복사하세요'}};
  try{navigator.clipboard.writeText(txt).then(function(){done(true)},function(){done(false)})}catch(e){done(false)}}
/* ---------- init (after all declarations) ---------- */
function init(){renderHead();
  if(!MOCK||!MOCK.ids||MOCK.ids.some(function(id){return !byId[id]&&!/^N-/.test(id)}))MOCK=null;
  var h=(location.hash||'').replace('#','');if(['mc','ds','sum','new','mock','stat'].indexOf(h)>=0)S.tab=h;
  render()}
setTimeout(init,0);
})();
</script>
