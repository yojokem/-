<script>

var AB={'GPCR':['G-protein-coupled receptor','교안'],'TI':['therapeutic index (치료지수)','교안'],'ED50':['median effective dose','교안'],'TD50':['median toxic dose','교안'],'EC50':['drug dose that shows 50% of maximal response','교안'],'Emax':['maximal effect (최대효과)','교안 외 풀이'],'cAMP':['cyclic AMP','교안 외 풀이'],'PKA':['protein kinase A','교안'],'PKC':['protein kinase C','교안'],'PLC':['phospholipase C','교안'],'IP3':['inositol trisphosphate','교안'],'DAG':['diacylglycerol','교안'],'GRK':['G protein-coupled receptor kinase','교안'],'PDE':['phosphodiesterase','교안 외 풀이'],'RXR':['retinoid X receptor','교안'],'NMDA':['N-methyl-D-aspartate (교안은 NMDA로만 표기)','교안 외 풀이'],'5-HT3':['5-hydroxytryptamine type 3','교안'],'SH2':['Src homology 2 domain','교안 외 풀이'],'MAP':['mitogen-activated protein','교안'],'ACh':['acetylcholine','교안'],'Ach':['acetylcholine (원문 표기 Ach)','교안'],'PAR':['proteinase-activated receptor','교안 외 풀이']};
var ABRE=new RegExp('(?<![A-Za-z0-9])('+Object.keys(AB).sort(function(a,b){return b.length-a.length}).map(function(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}).join('|')+')(?![A-Za-z0-9])','g');

/* ---------- filtering ---------- */
function clsList(){var s={};items.forEach(function(i){s[i.c]=1});return Object.keys(s).sort(function(a,b){return a-b})}
function filtered(type){

    if(i.t!==type)return false

    if(S.dedup&&S.cls==='all'&&i.rep===false)return false;

/* ---------- OMR ---------- */

  if(g.estN!=null)h+='<br><b>'+g.estOk+' / '+g.estN+'</b> <span class="muted">추정 포함 보조 점수</span>';
  return h}
function timerTick(){var el=$('#timer');if(!el)return;var t=S.timer;var ms=t.acc+(t.run?Date.now()-t.t0:0);var s=Math.floor(ms/1000);el.textContent='· 경과 '+String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')+(t.run?'':' (정지)')}
setInterval(timerTick,1000);
/* ---------- cards ---------- */
function optsHtml(it,seen,sel,showAns,key){
  var A=effAns(it)||[];var res=S.graded&&S.graded[it.id];
  return '<ul class="opts">'+(it.o||[]).map(function(o,ix){var k=ix+1;var c='';

    if(showAns&&A.indexOf(k)>=0&&(it.st!=='충돌'))c+=' ans';

    return '<li class="'+c+'" data-act="opt" data-id="'+esc(it.id)+'" data-k="'+k+'" data-key="'+(key||'mc')+'"><span class="no">'+CIRC[ix]+'</span><span>'+ab(o,seen)+'</span></li>'}).join('')+'</ul>'}

    if(it.a&&it.a.join()!==u.a.join())h+='<div class="note"><span class="tag">알림</span> 지정한 정답이 교안 근거와 다릅니다(이전 판정 대비). 지정은 그대로 적용됩니다. '+(u.reason?'':'(이유 미기재: 사용자 지정)')+'</div>'}

function ansBox(it,seen){

  if(it.dups&&it.dups.length>1)h+='<div class="muted" style="font-size:12px">같은 문항: '+it.dups.map(function(d){var x=byId[d];return d===it.id?esc(x.c+'학번 #'+x.n+'(이 카드)'):linkItem(d)}).join(' · ')+(S.dedup&&S.cls==='all'?' <span class="muted">— 중복 묶기 켜짐: 대표 1건만 표시</span>':'')+'</div>';
  h+='<div class="muted" style="font-size:12px">출제 이력(개념 '+esc(it.k)+', '+(FREQ[it.k]||0)+'건): '+esc(histOf(it.k))+'</div>';

function qCard(it,idx,opts){

  var showA=S.showAll||S.show[it.id];var hasOpts=it.t==='MC';

  if(it.st==='충돌')h+='<span class="badge">충돌 보존</span>';
  h+='</div>';

var LESSONS=['버전: 프롬프트 v6.2 · 2026-10-10 · 세션 1(작성은 v6.1, 2026-10-12 v6.2 병합 반영)','L-4 · 2026-10-12 · 상황: 학번만 다른 같은 문항이 카드로 따로 나열 · 문제: §15 동일 문항 판정이 학번 안 원번호 기준, §9에 중복 묶기 없음 · 처리: dups 묶음(유사도 0.85 이상 후보→정답 비교) + 대표 1건 표시 · 규칙: §9·§14·§15 · 상태: 채택(v6.2)','L-1 · 2026-10-10 · 상황: Notion 페이지에 ‘개정안’ 블록이 없음 · 문제: §0/§18의 적용 질의 대상이 없음 · 임시 처리: 현행 v6.1 유지로 질의 · 제안 규칙: 개정안 부재 시 질의를 ‘부재 보고+현행 유지’로 축약 · 영향 절: §0·§18 · 일반화: 가능 · 상태: 제안','L-2 · 2026-10-10 · 상황: 수기 표시 PDF에서 typed 키와 수기 정정이 충돌 · 문제: §6에 ‘수기 표시와 typed 키의 우열’ 규정 없음 · 임시 처리: 충돌로 보존하고 교안 일치 쪽을 후보 첫 항목으로 · 제안 규칙: 같은 사본의 typed 키·수기 표시는 독립 근거 1건으로 센다 · 영향 절: §6 · 일반화: 가능 · 상태: 제안','L-3 · 2026-10-10 · 상황: 다운로드 한도(10MB) · 문제: 8MB 스캔 사본·GB급 zip 열람 불가 · 임시 처리: 작은 사본으로 대체, blocked 기록 · 제안 규칙: §7 한계 문구에 ‘GB급 zip은 분할 제공 요청’ 예시 추가 · 영향 절: §7 · 일반화: 가능 · 상태: 제안','미결 제안: L-1, L-2, L-3(모두 ‘제안’ 상태, 사용자 승인 전 규칙 변경 없음)'].join('\n');
/* ---------- render ---------- */
function render(){
  document.body.classList.toggle('exam',S.exam&&(S.tab==='mc'||S.tab==='mock'));
  document.body.classList.toggle('showans',S.showAll);
  renderTabs();var a=$('#app');
  var fn={mc:viewMC,ds:viewDS,sum:viewSum,'new':viewNew,mock:viewMock,stat:viewStat}[S.tab];
  a.innerHTML=fn();timerTick();if(window.innerWidth<920){$$('aside.omr details').forEach(function(d){d.open=false})}
}
function scrollToId(id){var el=document.getElementById(id);if(el){el.scrollIntoView({block:'start'});}}
/* ---------- events ---------- */
document.addEventListener('click',function(ev){
  var t=ev.target.closest('[data-act],[data-tab]');if(!t)return;
  if(t.dataset.tab){S.tab=t.dataset.tab;S.graded=null;render();window.scrollTo(0,0);return}
  var act=t.dataset.act,id=t.dataset.id;
  switch(act){
   case 'unit':S.unit=+t.dataset.v;render();break;
   case 'cls':S.cls=t.dataset.v;render();break;
   case 'st':S.st[t.dataset.v]=!S.st[t.dataset.v];render();break;
   case 'exam':S.exam=!S.exam;render();break;
   case 'dedup':S.dedup=!S.dedup;render();break;
   case 'showall':S.showAll=!S.showAll;render();break;
   case 'abbr':S.abbr=!S.abbr;render();break;
   case 'toggle':S.show[id]=!S.show[id];keepScroll(id);break;
   case 'opt':case 'omr':{var key=t.dataset.key||'mc';var m=(key==='mock'?MARK:OMR);var k=+t.dataset.k;var a=m[id]||[];var i=a.indexOf(k);if(i>=0)a.splice(i,1);else a.push(k);m[id]=a;store.set(key==='mock'?'mmark':'omr',m);S.graded=null;keepScroll(id);break}
   case 'newopt':break;
   case 'ua':{var u=UA[id]||{a:[],reason:''};var k2=+t.dataset.k;var j=u.a.indexOf(k2);if(j>=0)u.a.splice(j,1);else u.a.push(k2);u.a.sort();UA[id]=u;if(!u.a.length)delete UA[id];store.set('ua',UA);S.show[id]=true;keepScroll(id);break}
   case 'uaclear':delete UA[id];store.set('ua',UA);keepScroll(id);break;
   case 'go':case 'goq':S.tab='mc';S.unit=0;S.cls='all';S.st={};S.focus=id;S.show[id]=(act==='go')?true:S.show[id];render();setTimeout(function(){scrollToId('q_'+id)},30);break;
   case 'gocard':S.tab='sum';S.unit=0;S.cardOpen=id;render();setTimeout(function(){var d=document.getElementById('c_'+id);if(d){d.open=true;d.scrollIntoView({block:'start'})}},30);break;
   case 'clearomr':OMR={};store.set('omr',OMR);S.graded=null;render();break;
   case 'grade':grade();break;
   case 'redraw':drawMock();render();break;
   case 'minew':S.mockOpts.inclNew=!S.mockOpts.inclNew;MOCK=null;drawMock();render();break;
   case 'miest':S.mockOpts.inclEst=!S.mockOpts.inclEst;MOCK=null;drawMock();render();break;
   case 'tstart':{var T=S.timer;if(T.run){T.acc+=Date.now()-T.t0;T.run=false}else{T.t0=Date.now();T.run=true}timerTick();break}
   case 'treset':S.timer={t0:0,acc:0,run:false};timerTick();break;
   case 'export':doExport();break;
   case 'copylim':copyText($('#limits').textContent,t);break;
  }});
document.addEventListener('input',function(ev){var t=ev.target;if(t.dataset&&t.dataset.act==='uareason'){var u=UA[t.dataset.id];if(u){u.reason=t.value;store.set('ua',UA)}}});
function keepScroll(){var y=window.scrollY;render();window.scrollTo(0,y)}
function grade(){
  var list=S.list||[];var key=S.tab==='mock'?MARK:OMR;var g={};var ok=0,n=0,marked=0,estN=0,estOk=0;
  list.forEach(function(it){
    var m=(key[it.id]||[]).slice().sort(function(x,y){return x-y});var A=effAns(it);if(m.length)marked++;
    if(!A||!m.length)return;
    var As=A.slice().sort(function(x,y){return x-y});
    var good=m.length===As.length&&m.every(function(x,i){return x===As[i]});
    var strict=gradable(it)||!!it.isNew;
    if(strict||S.tab==='mock')g[it.id]={ok:good};
    if(strict){n++;if(good)ok++}
    estN++;if(good)estOk++});
  g._sum={ok:ok,n:n,marked:marked,estN:(S.tab==='mock'?estN:null),estOk:estOk};
  S.graded=g;keepScroll()}
function doExport(){
  var ids=Object.keys(UA).filter(function(id){return UA[id].a&&UA[id].a.length});
  var o={exported_at:new Date().toISOString().slice(0,10),user_answers:ids.map(function(id){var it=byId[id];return {id:(it&&it.gb)||id,alias:id,answer:UA[id].a,reason:UA[id].reason||''}})};
  var txt=JSON.stringify(o);
  copyText(txt,null,function(ok){var b=$('#exportbox');if(b)b.innerHTML=(ok?'<div class="note">지정한 정답 '+ids.length+'건을 클립보드에 복사했습니다. 대화창에 붙여 넣어 주세요. (가공본 ID가 없어 id에도 별칭을 담았습니다)</div>':'<div class="note">클립보드 복사가 막혀 있어 아래 상자에 표시합니다. 직접 복사해 주세요.</div>')+'<textarea id="exp" rows="4" style="width:100%" readonly>'+esc(txt)+'</textarea>';var e=$('#exp');if(e&&!ok){e.focus();e.select()}})}
function copyText(txt,btn,cb){
  var done=function(ok){if(cb)cb(ok);else if(btn){btn.textContent=ok?'복사됨':'복사 실패 — 직접 선택해 복사하세요'}};
  try{navigator.clipboard.writeText(txt).then(function(){done(true)},function(){done(false)})}catch(e){done(false)}}
/* ---------- init (after all declarations) ---------- */
function init(){renderHead();
  if(!MOCK||!MOCK.ids||MOCK.ids.some(function(id){return !byId[id]&&!/^N-/.test(id)}))MOCK=null;
  var h=(location.hash||'').replace('#','');if(['mc','ds','sum','new','mock','stat'].indexOf(h)>=0)S.tab=h;
  render()}
setTimeout(init,0);
})();
</script>
