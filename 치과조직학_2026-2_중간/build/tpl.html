<title>치과조직학 중간 대비</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* 배치: 상단 탭 + 좌측 OMR 사이드바 + 문항 카드 열. 시험지형은 흑백 세리프 단일 열. */
:root{
  --bg:#f4f6f6; --surface:#ffffff; --fg:#16201f; --muted:#566562; --line:#d7dedd; --soft:#e9eeed;

  --ok:#1b7a43; --bad:#b0352b; --ok-bg:#e0f1e6; --bad-bg:#f8e2df;
  --s-conf:#1b7a43; --s-cross:#2b64a8; --s-est:#9a6200; --s-conflict:#b0352b; --s-undec:#69736f; --s-infer:#6a4ca0; --s-user:#1b7a43;
  --font-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-serif:"Noto Serif KR","Batang","Nanum Myeongjo",serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1514; --surface:#162120; --fg:#e3ebea; --muted:#9db0ad; --line:#2a3a38; --soft:#1e2c2b;
  --accent:#5fcbc2; --accent-fg:#06211f; --accent-weak:#173c39;
  --ok:#62c88a; --bad:#f0857b; --ok-bg:#163826; --bad-bg:#40201d;
  --s-conf:#62c88a; --s-cross:#79aef0; --s-est:#e0aa4a; --s-conflict:#f0857b; --s-undec:#9aa6a3; --s-infer:#b79df0; --s-user:#62c88a;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1514; --surface:#162120; --fg:#e3ebea; --muted:#9db0ad; --line:#2a3a38; --soft:#1e2c2b;
  --accent:#5fcbc2; --accent-fg:#06211f; --accent-weak:#173c39;
  --ok:#62c88a; --bad:#f0857b; --ok-bg:#163826; --bad-bg:#40201d;
  --s-conf:#62c88a; --s-cross:#79aef0; --s-est:#e0aa4a; --s-conflict:#f0857b; --s-undec:#9aa6a3; --s-infer:#b79df0; --s-user:#62c88a;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.6;padding-inline:16px;padding-block:0 48px;margin:0}

.stem{font-family:var(--font-serif);font-size:1rem;margin:0 0 8px;white-space:pre-line;text-wrap:pretty}

blockquote{margin:2px 0 0;padding-left:10px;border-left:2px solid var(--line);color:var(--muted);font-size:.82rem;overflow-wrap:anywhere}

.box{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:14px;min-width:0}

.box h3{font-size:.9rem;margin:12px 0 4px}
.tw{overflow-x:auto}
table{border-collapse:collapse;font-size:.84rem;min-width:520px}
th,td{border:1px solid var(--line);padding:4px 8px;text-align:left;vertical-align:top}

ul.plain{margin:4px 0;padding-left:20px}

sup,sub{font-size:.72em;line-height:0}
.why{display:flex;flex-direction:column;gap:6px;margin:4px 0 0;padding:0;list-style:none}
.why li{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:6px;align-items:start;font-size:.86rem}
.vd{font-size:.7rem;border:1px solid var(--line);border-radius:4px;padding:0 6px;white-space:nowrap}
.vd.a{color:var(--ok);border-color:var(--ok)}.vd.x{color:var(--bad);border-color:var(--bad)}.vd.r{color:var(--s-infer);border-color:var(--s-infer)}
.bz{font-size:.7rem;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-left:4px;white-space:nowrap}
.figwrap{position:relative;display:inline-block;max-width:100%}
.figlab{position:absolute;top:6px;left:6px;pointer-events:none;border:1.5px solid var(--accent);color:var(--accent);background:transparent;font:700 .8rem var(--font-mono);padding:0 6px;border-radius:4px;text-shadow:0 0 3px var(--surface),0 0 3px var(--surface),0 0 6px var(--surface)}
.scard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:14px;min-width:0}
.scard-h{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-bottom:6px}
.scard-h h2{font-size:1.02rem;margin:0 8px 0 0}
.cnt{font-size:.72rem;background:var(--accent-weak);border-radius:999px;padding:0 9px;white-space:nowrap}
.sec-t{font-size:.76rem;font-weight:700;color:var(--accent);margin:14px 0 4px;letter-spacing:.03em}
.pts{list-style:none;margin:0;padding:0}

.pts .s{font-size:.7rem;color:var(--muted);margin-left:6px}
.mem{background:var(--accent-weak);border-radius:6px;padding:8px 12px;margin:0;list-style:none}
.mem li{padding:3px 0}
.vsrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
@media (max-width:600px){.vsrow{grid-template-columns:minmax(0,1fr)}}
.vsc{border:1px solid var(--line);border-radius:6px;padding:6px 10px;min-width:0}
.vsc .vh{font-weight:700;font-size:.86rem}
.vst{font-size:.78rem;color:var(--muted);margin-bottom:2px}
table.st th{background:var(--accent-weak)}
table.st tbody tr:nth-child(even){background:var(--soft)}
table.st td:first-child{font-weight:700}
details.srcd{margin-top:10px;font-size:.84rem}

.toc{display:flex;flex-wrap:wrap;gap:6px}
.hid{display:none}
@media print{header.top,.tools,.row-actions,.no-print,.foot,.tabs{display:none!important}body{padding:0;background:#fff;color:#000}.scard{border:0;break-inside:avoid-page;padding:0}.hid{display:block!important}details.srcd:not([open]) *{display:none}}
/* 시험지형 */
body.exam{--bg:#ffffff;--surface:#ffffff;--fg:#000000;--muted:#000000;--line:#000000;--soft:#ffffff;--accent:#000000;--accent-weak:#ffffff;--accent-fg:#ffffff;color-scheme:light;font-family:var(--font-serif)}
body.exam .meta,body.exam .ans-box,body.exam .card-h .badge,body.exam .card-h .tag:not(.keep),body.exam .row-actions,body.exam figcaption,body.exam .dupl{display:none!important}

<div class="wrap">
<header class="top">
  <div class="title-row">
    <h1>치과조직학 중간 대비</h1>
    <span class="sub">단국대 치과대학 치의예과 · 2026-2 · 중간고사 · 25학번</span>
    <span class="ver" id="ver"></span>
    <button class="btn" id="themeBtn" type="button" style="margin-left:auto">테마</button>
  </div>
  <nav class="tabs" id="tabs" role="tablist" aria-label="탭"></nav>
</header>
<main id="main" style="padding-top:6px"></main>
<div class="foot" id="diag"></div>
</div>

<script>
const DB = __DATA__;
const IMG = __IMG__;
const LS = {
  get(k, d){ try{ const v = localStorage.getItem('hist26.' + k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('hist26.' + k, JSON.stringify(v)); return true; }catch(e){ return false; } }
};
const TABS = [["status","현황·범위"],["mc","객관식"],["sum","내용 정리"],["all","전체 내용 정리"],["new","예상 문제"],["mock","모의고사"]];
const S = { tab: LS.get('tab','status'), ch: 0, hak: 'all', st: 'all', group: true, exam: false, showAll: false,
  omr: LS.get('omr', {}), ua: LS.get('ua', {}), uaWhy: LS.get('uaWhy', {}), open: {}, graded: null, inclEst: false,
  mock: null, newOpen: {}, newMarks: {}, sch: 0, fold: {}, cc: {} };
const MKS = {c:'①②③④⑤⑥⑦⑧', ga:'가나다라마바', g:'ㄱㄴㄷㄹㅁㅂ'};
const mark = (mk, i) => mk === 'n' ? (i+1)+'.' : mk === 'ga' ? MKS.ga[i]+')' : mk === 'g' ? MKS.g[i]+'.' : MKS.c[i];
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TIER = {T1:'T1 정답지', T2:'T2 타 선배 원본 야마', T2p:'T2′ 선배 필기', T4:'T4 교안', T5:'T5 추론', T6:'T6 교재'};
const Q = DB.Q, NEW = DB.NEW;
const qById = Object.fromEntries(Q.map(q => [q.id, q]));
const uaOf = id => S.ua[id];
const statusOf = q => uaOf(q.id) ? '사용자 확정' : q.status;
const ansOf = q => uaOf(q.id) || q.ans;
const times = q => q.srcs.length;
const haks = q => [...new Set(q.srcs.map(s => s.k))];
const ansLabel = (q, a) => a && a.length ? a.map(i => mark(q.mk, i-1) + (q.opts[i-1] ? ' ' + q.opts[i-1] : '')).join(' / ') : '';


/* v6.8 §14 ② 위·아래 첨자: 화면 표시 단계에서만 변환(원문 인용은 esc만 사용) */
function sx(raw){
  let h = esc(raw);
  h = h.replace(/\b10\^(-?\d+)/g, (m, n) => '10<sup>' + n.replace('-', '−') + '</sup>');
  h = h.replace(/\b10-(\d{1,3})(?=\s*(?:[~∼]|sec\b|[μµ㎛]m|nm\b|mm\b|cm\b|\)|M\b))/g, '10<sup>−$1</sup>');
  h = h.replace(/([A-Za-z\)])\^(\d+)/g, '$1<sup>$2</sup>');
  h = h.replace(/\b(Sv|Gy|Bq)-1\b/g, '$1<sup>−1</sup>');
  h = h.replace(/\b(Ca|Mg)(\d)\+/g, '$1<sup>$2+</sup>');
  h = h.replace(/\b(H2O2|H2O|CO2|O2|I2|N0|D1|D2)(?![\w])/g, m => m.replace(/(\d)/g, '<sub>$1</sub>'));
  return h;
}
function rich(raw){
  let t = String(raw ?? '');
  if(!/\*\*/.test(t)){ const m = t.match(/^([^:：=]{2,26})([:：])/); if(m) t = '**' + m[1] + '**' + t.slice(m[1].length); }
  return sx(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
}
const EXAM_AT = new Date('2026-10-23T10:00:00+09:00');
function dday(){
  const d = Math.ceil((EXAM_AT - Date.now()) / 86400000);
  return d > 0 ? 'D-' + d : d === 0 ? 'D-Day' : 'D+' + (-d);
}
const FN_TITLE = '각주 · 타 학번 필기 · 정답 판정 근거 아님';

function badge(q){
  const s = statusOf(q);
  return `<span class="badge" data-s="${esc(s)}">${esc(s)}${q.conf ? ' · 신뢰도 ' + esc(q.conf) : ''}</span>`;
}
function srcTags(q){
  return q.srcs.map(s => `<span class="tag mono keep" title="${esc(s.n || '')}">${esc(s.k)}학번 ${esc(s.no)}</span>`).join('');
}
function evHtml(list){
  return `<ul class="evs">` + list.map(e => `<li><span class="tier">${esc(TIER[e.t] || e.t)}</span><div><span class="src">${esc(e.s)}</span>${e.p ? ' <span class="tag">요약·개념 수준</span>' : ''}<blockquote>${esc(e.q)}</blockquote></div></li>`).join('') + `</ul>`;
}
function imgHtml(q){
  if(!q.img) return '';
  const cap = {plasma:'그림: 형질세포 전자현미경 사진(23학번 docx 이미지, 문항 번호 2-07)',
    em:'그림: 골격근 세로 전자현미경 사진(23학번 docx). a~e 라벨은 원본에 없음, 손글씨 표시는 지웠으나 흔적이 일부 남아 있음',
    cardiac:'그림: 근육 세로 단면(24학번 docx, 화살표 = 사이원반)'}[q.img];
  const fq = DB.FIGNO[q.img] || '';
  return `<figure><div class="figwrap"><img src="${IMG[q.img]}" alt="${esc(fq + ' ' + q.id + ' ' + cap)}"><span class="figlab meta" aria-hidden="true">${esc(fq)}</span></div><figcaption>${esc(fq + ' · ' + cap)}</figcaption></figure>`;
}
function cardHtml(q, ctx){
  ctx = ctx || 'mc';
  const marks = ctx === 'mc' ? (S.omr[q.id] || []) : [];
  const opts = q.opts.length
    ? `<div class="opts" role="group" aria-label="선지">` + q.opts.map((o, i) =>
      `<button type="button" class="opt" data-act="opt" data-q="${q.id}" data-i="${i+1}"><span class="mk">${esc(mark(q.mk, i))}</span><span>${sx(o)}</span></button>`).join('') + `</div>`
    : `<p class="note meta">선지가 복기되지 않은 문항입니다.</p>`;
  const times_ = times(q);
  const dup = times_ > 1 ? `<span class="badge plain dupl" title="학번 간 동일 문항 묶음 · 같은 시험 내 반복 포함">동일 문항 ${times_}회 출제</span>` : '';
  const vars = q.var && q.var.length ? `<div class="note meta"><b>타 학번 표기</b><ul class="plain">${q.var.map(v => `<li>${esc(v.k)}학번: ${esc(v.stem)}${v.ans ? ' → ' + esc(v.ans) : ''}</li>`).join('')}</ul></div>` : '';
  const ex = ctx === 'mc' ? `
    <div class="row-actions meta">

function ansBox(q){
  const a = ansOf(q);
  let h = '';
  const line = a && a.length ? ansLabel(q, a) : (q.anstext || (q.proposed ? '정답 없음(판정 보류)' : '정답 없음'));
  h += `<div class="keyline">${esc(statusOf(q))}: ${esc(line)}</div>`;
  if(q.proposed) h += `<div class="note"><b>추론·잠정:</b> ${esc(q.proposed)} <span class="tag">채점 제외</span></div>`;
  if(q.cand) h += `<div class="note"><b>후보:</b> ${esc(q.cand)}</div>`;
  if(q.why && q.why.length){
    const noAns = !(q.ans && q.ans.length);
    h += `<div class="whybox"><b>${noAns ? '검토 포인트 · 정답 미확정이라 채점 제외' : '보기별 판단 이유'}</b>${uaOf(q.id) ? ' <span class="note">(사용자 정답 지정과 다를 수 있습니다. 아래는 대장 정답 기준)</span>' : ''}<ul class="why">${q.why.map(w => `<li><span class="vd ${w.ok === null ? 'r' : w.ok ? 'a' : 'x'}">${w.ok === null ? '검토' : w.ok ? '정답' : '오답'}</span><span class="mono">${esc(mark(q.mk, w.l - 1))}</span><div>${sx(w.s)}<span class="bz">${w.b === 'T4' ? '교안 근거(수기 대조)' : '일반 지식·논리'}</span>${w.b === 'T4' && w.q ? `<blockquote>${esc(w.q)}</blockquote>` : ''}</div></li>`).join('')}</ul></div>`;
  } else if(!q.opts.length){ h += `<div class="note">선지 본문이 없는 문항이라 보기별 이유를 쓰지 않았습니다.</div>`; }
  const mm = DB.MISMATCH.find(x => x[0] === q.id);
  if(mm) h += `<div class="warn"><b>교안과 불일치 소지(사용자 확인 목록)</b> ${esc(mm[1])}</div>`;
  const ref = q.ev.filter(e => e.t !== 'T2p'), nb = q.ev.filter(e => e.t === 'T2p');
  if(ref.length) h += `<div><b>근거</b>${evHtml(ref)}</div>`;
  if(nb.length) h += `<div><b>선배 필기 대조</b> <span class="note">타 학번 기준이라 올해와 다를 수 있음 · 정답을 바꾸지 않음</span>${evHtml(nb)}</div>`;
  if(q.cf.length) h += `<div class="warn"><b>충돌·불일치(보존)</b><ul class="plain">${q.cf.map(c => `<li>${esc(c.s)}: ${esc(c.a)} — ${esc(c.n)}</li>`).join('')}</ul></div>`;
  if(q.note) h += `<div class="note">${esc(q.note)}</div>`;
  const rel = DB.REL[q.id] || [];
  if(rel.length) h += `<div class="note"><b>관련 단원 요약:</b> <button class="link" type="button" data-act="gosum" data-ch="${q.ch}">Ch${q.ch} ${esc(DB.CH[q.ch])}</button> · 예상 문제 ${rel.map(n => `<button class="link" type="button" data-act="gonew" data-id="${n}">${n}</button>`).join(' ')}</div>`;
  return h;
}

function listFor(){
  let L = Q.filter(q => (S.ch === 0 || q.ch === S.ch) && (S.st === 'all' || statusOf(q) === S.st));
  if(S.hak !== 'all'){
    const rows = [];
    for(const q of L) for(const s of q.srcs) if(s.k === S.hak) rows.push({q, s});
    rows.sort((a, b) => (parseInt(a.s.no) || 999) - (parseInt(b.s.no) || 999));
    return rows.map(r => ({q: r.q, label: r.s.k + '학번 ' + r.s.no}));
  }
  if(!S.group){
    const rows = [];
    for(const q of L) for(const s of q.srcs) rows.push({q, label: s.k + '학번 ' + s.no});
    return rows;
  }
  return L.map(q => ({q}));
}

  const memH = mem.length ? `<div class="sec-t">암기 포인트</div><ul class="mem">${mem.map(m => `<li>${rich(m[0])} <span class="note">[${esc(m[1])}]</span></li>`).join('')}</ul>` : '';

  const links = `<div class="sec-t">기출·예상 연계</div><p class="note">${qs.map(q => `<button class="link" type="button" data-act="gomc" data-q="${q.id}">${q.id} ${esc(q.key.replace(/^\d\./, ''))}</button>`).join(' · ')}${ns.length ? '<br>예상 문제 ' + ns.map(n => `<button class="link" type="button" data-act="gonew" data-id="${n.id}">${n.id}</button>`).join(' ') : ''}</p>`;
  const quotes = []; const seen = new Set();
  const add = (src, q) => { if(q && !seen.has(q)){ seen.add(q); quotes.push([src, q]); } };
  qs.forEach(q => q.ev.filter(e => e.t === 'T4' && !e.p).forEach(e => add(e.s, e.q)));

  return `<section class="scard" id="${all ? 'all' : 'sum'}-${c}"><div class="scard-h"><h2>Ch${c} ${esc(DB.CH[c])}</h2><span class="cnt">요약 ${u.pts.length}</span><span class="cnt">표 ${u.tbl ? 1 : 0}</span><span class="cnt">암기 ${mem.length}</span><span class="cnt">비교 ${vs.length}</span><span class="cnt">기출 ${qs.length}</span>${all ? `<button class="btn no-print" type="button" data-act="cc" data-ch="${c}" style="margin-left:auto">${closed ? '펴기' : '접기'}</button>` : ''}</div>${all && closed ? '' : body}</section>`;

function mockTab(){
  const m = S.mock;
  const head = `<div class="box"><h2>모의고사</h2>
    <p><b>시험 일시</b> 2026-10-23(금) 10:00–12:00 · <b>${dday()}</b> <span class="tag">사용자 제공, 원문 미확인</span></p>

    <label><input type="checkbox" id="mockNew" ${m && m.useNew ? 'checked' : ''}> 예상 문제 포함</label>
    <button class="btn primary" type="button" data-act="mockstart">새로 뽑기</button>
    ${m ? `<span class="timer" id="timer">남은 --:--</span><button class="btn" type="button" data-act="mockend">채점</button>` : ''}</div></div>`;
  if(!m) return head;
  const res = m.done ? `<div class="res">확정·교차확인 기준 ${m.s1}/${m.j1}점, 추정 포함 ${m.s2}/${m.j2}점 (추정 문항은 보조 점수입니다)</div>` : '';
  return head + res + `<div class="cards">${m.items.map((q, n) => {
    const ks = m.marks[q.id] || [];
    const ok = m.done ? (JSON.stringify([...ansOfAny(q)].sort()) === JSON.stringify([...ks].sort())) : null;
    return `<article class="card ${m.done ? (ok ? 'ok' : 'bad') : ''}"><div class="card-h"><span class="cid">${n+1}번</span><span class="tag mono">${esc(q.id)}</span>${m.done ? `<span class="badge" data-s="${esc(q.status || '예상')}">${esc(q.status || '예상 문제')}</span>` : ''}</div>
      <p class="stem">${sx(q.stem)}</p>${q.img ? imgHtml(q) : ''}<div class="opts">${q.opts.map((o, i) => `<button type="button" class="opt ${ks.includes(i+1) ? 'on' : ''} ${m.done && ansOfAny(q).includes(i+1) ? 'key' : ''}" data-act="mopt" data-q="${q.id}" data-i="${i+1}"><span class="mk">${esc(mark(q.mk, i))}</span><span>${sx(o)}</span></button>`).join('')}</div></article>`;
  }).join('')}</div>`;
}
const ansOfAny = q => (ansOf(q) || []);

/* ───────── 렌더·이벤트 ───────── */
const $ = s => document.querySelector(s);
function refreshMarks(){
  document.querySelectorAll('.bub[data-q], .card[data-card] .opt[data-q]').forEach(b => {
    const q = b.dataset.q, i = +b.dataset.i, on = (S.omr[q] || []).includes(i);
    b.classList.toggle('on', on); b.setAttribute('aria-pressed', on);
  });
  if(S.graded) document.querySelectorAll('.card[data-card]').forEach(c => {
    const r = S.graded.rs[c.dataset.card];
    c.classList.toggle('ok', !!(r && r.judged && r.ok)); c.classList.toggle('bad', !!(r && r.judged && !r.ok));
  });
}
function render(){
  document.body.classList.toggle('exam', S.exam);
  $('#tabs').innerHTML = TABS.map(([k, n]) => `<button class="tab" role="tab" type="button" data-act="tab" data-k="${k}" aria-selected="${S.tab === k}">${n}</button>`).join('');
  $('#main').innerHTML = ({status: statusTab, mc: mcTab, sum: sumTab, all: allTab, new: newTab, mock: mockTab}[S.tab] || statusTab)();
  refreshMarks();
  if(S.tab === 'mc' && S.graded) renderGrade();
}
function renderGrade(){
  const g = S.graded, b = $('#gradeBox'); if(!b) return;
  b.innerHTML = `<div class="res">확정·교차확인·사용자 확정 기준 <b>${g.s1}/${g.j1}</b>점${S.inclEst ? ` · 추정 포함 보조 <b>${g.s2}/${g.j2}</b>점` : ''} · 추론·충돌·미확정은 제외했습니다.</div>`;
}
function grade(){
  const rs = {}; let s1 = 0, j1 = 0, s2 = 0, j2 = 0;
  for(const q of Q){
    const a = ansOf(q), m = S.omr[q.id] || [];
    const st = statusOf(q);
    const strong = ['확정', '교차확인', '사용자 확정'].includes(st), est = st === '추정';
    if(!a || !a.length || !(strong || est)) continue;
    const ok = JSON.stringify([...a].sort()) === JSON.stringify([...m].sort());
    if(strong){ j1++; if(ok) s1++; rs[q.id] = {judged: true, ok}; }
    if(strong || est){ j2++; if(ok) s2++; if(est) rs[q.id] = {judged: S.inclEst, ok}; }
  }
  S.graded = {rs, s1, j1, s2, j2};
}
function toggleMark(id, i){
  const q = qById[id], cur = new Set(S.omr[id] || []);
  if(cur.has(i)) cur.delete(i); else { if(!q.multi && !(q.opts.length && /모두/.test(q.stem))) cur.clear(); cur.add(i); }
  S.omr[id] = [...cur].sort(); LS.set('omr', S.omr); refreshMarks();
  const h = document.querySelector('.omr h3'); if(h) h.textContent = 'OMR · 답안 ' + Object.keys(S.omr).filter(k => (S.omr[k] || []).length).length + '/' + document.querySelectorAll('.omr-row').length;
}
function goto(tab, fn){ S.tab = tab; LS.set('tab', tab); render(); if(fn) fn(); window.scrollTo({top: 0}); }
let timerH = null;
function startTimer(){
  clearInterval(timerH);
  timerH = setInterval(() => { const t = $('#timer'); if(!t || !S.mock || S.mock.done) return; const el = Math.floor((Date.now() - S.mock.t0) / 1000), left = Math.round(S.mock.n * 90) - el, a = Math.abs(left); t.textContent = (left >= 0 ? '남은 ' : '초과 ') + String(Math.floor(a / 60)).padStart(2, '0') + ':' + String(a % 60).padStart(2, '0'); t.style.color = left < 0 ? 'var(--bad)' : ''; }, 1000);
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if(!t) return;
  const a = t.dataset.act, id = t.dataset.q || t.dataset.id;
  if(a === 'tab'){ S.tab = t.dataset.k; LS.set('tab', S.tab); render(); window.scrollTo({top: 0}); }

  else if(a === 'nch'){ S.nch = +t.dataset.ch; render(); }
  else if(a === 'sch'){ S.sch = +t.dataset.ch; render(); }
  else if(a === 'fold'){ S.fold[t.dataset.ch] = true; render(); document.getElementById('sum-' + t.dataset.ch)?.scrollIntoView(); }
  else if(a === 'cc'){ S.cc[t.dataset.ch] = !S.cc[t.dataset.ch]; render(); document.getElementById('all-' + t.dataset.ch)?.scrollIntoView(); }
  else if(a === 'expall'){ S.cc = {}; render(); document.querySelectorAll('details.srcd').forEach(d => d.open = true); }
  else if(a === 'colall'){ Object.keys(DB.CH).forEach(c => S.cc[c] = true); render(); }
  else if(a === 'goall'){ if(S.cc[t.dataset.ch]){ S.cc[t.dataset.ch] = false; render(); } document.getElementById('all-' + t.dataset.ch)?.scrollIntoView(); }
  else if(a === 'print'){ try{ window.print(); }catch(err){ const n = $('#printNote'); if(n) n.hidden = false; } setTimeout(() => { const n = $('#printNote'); if(n) n.hidden = false; }, 400); }
  else if(a === 'group'){ S.group = !S.group; render(); }
  else if(a === 'exam'){ S.exam = !S.exam; render(); }
  else if(a === 'showall'){ S.showAll = !S.showAll; render(); }
  else if(a === 'opt'){ toggleMark(id, +t.dataset.i); }
  else if(a === 'ans'){ S.open[id] = !S.open[id]; const box = document.getElementById('ans-' + id); box.hidden = !S.open[id] && !S.showAll; t.textContent = '정답·근거 ' + (box.hidden ? '보기' : '접기'); t.setAttribute('aria-expanded', !box.hidden); }
  else if(a === 'ua'){ const b = document.getElementById('ua-' + id); b.hidden = !b.hidden; }
  else if(a === 'uapick'){ const cur = new Set(S.ua[id] || []); const i = +t.dataset.i; cur.has(i) ? cur.delete(i) : cur.add(i); if(cur.size) S.ua[id] = [...cur].sort(); else delete S.ua[id]; LS.set('ua', S.ua); render(); document.getElementById('c-' + id)?.scrollIntoView({block: 'center'}); }
  else if(a === 'uaclear'){ delete S.ua[id]; delete S.uaWhy[id]; LS.set('ua', S.ua); LS.set('uaWhy', S.uaWhy); render(); }
  else if(a === 'grade'){ S.inclEst = !!($('#estChk') && $('#estChk').checked); grade(); refreshMarks(); renderGrade(); }

  else if(a === 'jump'){ e.preventDefault(); document.getElementById('c-' + id)?.scrollIntoView({block: 'start', behavior: 'smooth'}); }
  else if(a === 'gosum'){ S.sch = 0, goto('sum', () => document.getElementById('sum-' + t.dataset.ch)?.scrollIntoView()); }
  else if(a === 'gomc'){ S.ch = 0; S.hak = 'all'; S.st = 'all'; S.group = true; goto('mc', () => { const c = document.getElementById('c-' + id); if(c){ c.scrollIntoView({block: 'center'}); S.open[id] = true; const b = document.getElementById('ans-' + id); if(b) b.hidden = false; } }); }
  else if(a === 'gonew'){ S.nch = 0; goto('new', () => document.getElementById('n-' + id)?.scrollIntoView({block: 'center'})); }
  else if(a === 'nopt'){ const cur = new Set(S.newMarks[id] || []); const n = NEW.find(x => x.id === id); const i = +t.dataset.i; if(cur.has(i)) cur.delete(i); else { if(!n.multi) cur.clear(); cur.add(i); } S.newMarks[id] = [...cur]; render(); document.getElementById('n-' + id)?.scrollIntoView({block: 'center'}); }
  else if(a === 'nans'){ S.newOpen[id] = !S.newOpen[id]; render(); document.getElementById('n-' + id)?.scrollIntoView({block: 'center'}); }
  else if(a === 'mockstart'){
    const n = Math.max(5, Math.min(60, +($('#mockN').value) || 20)), useNew = $('#mockNew').checked;
    let pool = Q.filter(q => q.opts.length && ansOf(q) && ansOf(q).length && ['확정', '교차확인', '추정', '사용자 확정'].includes(statusOf(q)));
    if(useNew) pool = pool.concat(NEW.map(x => ({...x, key: x.id, status: '예상 문제', conf: '', srcs: []})));
    const byCh = {}; pool.forEach(q => (byCh[q.ch] = byCh[q.ch] || []).push(q));
    const tot = pool.length, items = [];
    Object.values(byCh).forEach(g => g.sort(() => Math.random() - .5));
    const chs = Object.keys(byCh);
    chs.forEach(c => { const k = Math.max(1, Math.round(n * byCh[c].length / tot)); items.push(...byCh[c].slice(0, k)); });
    items.sort(() => Math.random() - .5);
    S.mock = {n, useNew, items: items.slice(0, n), marks: {}, t0: Date.now(), done: false}; startTimer(); render();
  }
  else if(a === 'mopt'){ const m = S.mock; if(m.done) return; const q = m.items.find(x => x.id === id), cur = new Set(m.marks[id] || []), i = +t.dataset.i; if(cur.has(i)) cur.delete(i); else { if(!(q.multi || /모두/.test(q.stem))) cur.clear(); cur.add(i); } m.marks[id] = [...cur]; const y = window.scrollY; render(); window.scrollTo({top: y}); }
  else if(a === 'mockend'){
    const m = S.mock; m.done = true; let s1 = 0, j1 = 0, s2 = 0, j2 = 0;
    m.items.forEach(q => { const a2 = ansOfAny(q), k = m.marks[q.id] || [], ok = JSON.stringify([...a2].sort()) === JSON.stringify([...k].sort()); const strong = ['확정', '교차확인', '사용자 확정'].includes(statusOf(q)); if(strong){ j1++; if(ok) s1++; } j2++; if(ok) s2++; });
    Object.assign(m, {s1, j1, s2, j2}); render();
  }
  else if(a === 'export'){
    const arr = Object.keys(S.ua).map(id => ({id, alias: qById[id].srcs.map(s => s.k + '-' + s.no).join(','), answer: S.ua[id], reason: S.uaWhy[id] || ''}));
    const txt = JSON.stringify({exported_at: new Date().toISOString().slice(0, 10), user_answers: arr});
    const ta = $('#expOut'); ta.value = txt; ta.hidden = false;
    (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).catch(() => { ta.select(); });
  }
  else if(a === 'copylim'){ const txt = $('#limits').textContent; (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).catch(() => {}); }
});
document.addEventListener('change', e => {
  if(e.target.id === 'hakSel'){ S.hak = e.target.value; render(); }
  else if(e.target.id === 'stSel'){ S.st = e.target.value; render(); }
  else if(e.target.id === 'estChk'){ S.inclEst = e.target.checked; if(S.graded){ grade(); refreshMarks(); renderGrade(); } }
});
document.addEventListener('input', e => { const t = e.target; if(t.dataset && t.dataset.act === 'uawhy'){ S.uaWhy[t.dataset.q] = t.value; LS.set('uaWhy', S.uaWhy); } });
$('#themeBtn').addEventListener('click', () => {
  const r = document.documentElement, cur = r.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : cur === 'light' ? null : 'dark';
  next ? r.setAttribute('data-theme', next) : r.removeAttribute('data-theme');
  $('#themeBtn').textContent = '테마: ' + (next === 'dark' ? '어둡게' : next === 'light' ? '밝게' : '시스템');
});
$('#themeBtn').textContent = '테마: 시스템';
$('#ver').textContent = DB.VER;
const lsOk = LS.set('probe', 1);
$('#diag').textContent = '화면 진단 · 프롬프트 ' + DB.VER + ' · 문항 ' + DB.STATS.uniq + '건 · 보기별 이유 ' + DB.WHYSTAT.cards + '문항(교안 인용 ' + DB.WHYSTAT.quotes + '건, 자동 대조 ' + (DB.WHYSTAT.auto ? '통과' : '미실시·수기') + ') · 인용 그림 ' + DB.FIGS.length + '건 · AI: 미구현(요청 없음) · 브라우저 저장: ' + (lsOk ? '사용 가능' : '사용 불가(OMR 새로고침 시 초기화)') + ' · 생성 ' + DB.BUILT;
render();
</script>
