<title>치과조직학 중간 대비</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* 배치: 상단 탭 + 좌측 OMR 사이드바 + 문항 카드 열. 시험지형은 흑백 세리프 단일 열. */
:root{
  --bg:#f4f6f6; --surface:#ffffff; --fg:#16201f; --muted:#566562; --line:#d7dedd; --soft:#e9eeed;
  --accent:#0e6b66; --accent-fg:#ffffff; --accent-weak:#d8edeb;
  --ok:#1b7a43; --bad:#b0352b; --ok-bg:#e0f1e6; --bad-bg:#f8e2df;
  --c1:#0e6b66; --c2:#2b64a8; --c3:#b0352b; --c4:#9a6200; --c5:#6a4ca0; --c6:#1b7a43; --c7:#a24a7d; --c8:#5b6770;
  --s-conf:#1b7a43; --s-cross:#2b64a8; --s-est:#9a6200; --s-conflict:#b0352b; --s-undec:#69736f; --s-infer:#6a4ca0; --s-user:#1b7a43;
  --font-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-serif:"Noto Serif KR","Batang","Nanum Myeongjo",serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1514; --surface:#162120; --fg:#e3ebea; --muted:#9db0ad; --line:#2a3a38; --soft:#1e2c2b;
  --accent:#5fcbc2; --accent-fg:#06211f; --accent-weak:#173c39;
  --ok:#62c88a; --bad:#f0857b; --ok-bg:#163826; --bad-bg:#40201d;
  --c1:#5fcbc2; --c2:#79aef0; --c3:#f0857b; --c4:#e0aa4a; --c5:#b79df0; --c6:#62c88a; --c7:#e28bbd; --c8:#a9b8c2;
  --s-conf:#62c88a; --s-cross:#79aef0; --s-est:#e0aa4a; --s-conflict:#f0857b; --s-undec:#9aa6a3; --s-infer:#b79df0; --s-user:#62c88a;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1514; --surface:#162120; --fg:#e3ebea; --muted:#9db0ad; --line:#2a3a38; --soft:#1e2c2b;
  --accent:#5fcbc2; --accent-fg:#06211f; --accent-weak:#173c39;
  --ok:#62c88a; --bad:#f0857b; --ok-bg:#163826; --bad-bg:#40201d;
  --c1:#5fcbc2; --c2:#79aef0; --c3:#f0857b; --c4:#e0aa4a; --c5:#b79df0; --c6:#62c88a; --c7:#e28bbd; --c8:#a9b8c2;
  --s-conf:#62c88a; --s-cross:#79aef0; --s-est:#e0aa4a; --s-conflict:#f0857b; --s-undec:#9aa6a3; --s-infer:#b79df0; --s-user:#62c88a;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.6;padding-inline:16px;padding-block:0 48px;margin:0}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin-inline:auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:12px 0;border-bottom:1px solid var(--line)}
.title-row{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
h1{font-size:1.2rem;margin:0;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);font-size:.82rem}
.ver{font-family:var(--font-mono);font-size:.74rem;border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--muted)}
.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:10px;scrollbar-width:thin}
.tab{border:0;background:none;padding:9px 14px;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;font-weight:500}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent);font-weight:700}
.tools{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin:14px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px;font-size:.84rem}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:5px 12px;font-size:.88rem}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:700}
.btn[aria-pressed="true"]{background:var(--accent-weak);border-color:var(--accent)}
select,input[type=number],input[type=text]{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px 8px}
.layout{display:grid;grid-template-columns:200px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:820px){.layout{grid-template-columns:minmax(0,1fr)}}
aside.omr{position:sticky;top:calc(env(safe-area-inset-top,0px) + 96px);max-height:calc(100vh - 120px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px}
@media (max-width:820px){aside.omr{position:static;max-height:260px}}
.omr h3{margin:0 0 6px;font-size:.8rem;color:var(--muted);font-weight:500}
.omr-row{display:flex;align-items:center;gap:4px;padding:2px 0}
.omr-row a{font-family:var(--font-mono);font-size:.68rem;color:var(--muted);width:34px;text-decoration:none;flex:none}
.bub{width:22px;height:22px;border-radius:50%;border:1px solid var(--muted);background:none;font-size:.68rem;padding:0;line-height:20px;text-align:center;color:var(--muted)}
.bub.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.cards{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;min-width:0}
.card.ok{border-color:var(--ok);box-shadow:inset 3px 0 0 var(--ok)}
.card.bad{border-color:var(--bad);box-shadow:inset 3px 0 0 var(--bad)}
.card-h{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-bottom:8px}
.cid{font-family:var(--font-mono);font-weight:500;font-size:.8rem}
.tag{font-size:.74rem;border:1px solid var(--line);border-radius:4px;padding:0 6px;color:var(--muted);white-space:nowrap}
.tag.mono{font-family:var(--font-mono)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:.76rem;border:1px solid var(--line);border-radius:4px;padding:0 7px;white-space:nowrap}
.badge::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--s-undec)}
.badge[data-s="확정"]::before,.badge[data-s="사용자 확정"]::before{background:var(--s-conf)}
.badge[data-s="교차확인"]::before{background:var(--s-cross)}
.badge[data-s="추정"]::before{background:var(--s-est)}
.badge[data-s="충돌"]::before{background:var(--s-conflict)}
.badge[data-s="추론"]::before{background:var(--s-infer)}
.badge.plain::before{display:none}
.stem{font-family:var(--font-serif);font-size:1rem;margin:0 0 8px;white-space:pre-line;text-wrap:pretty}
.opts{display:flex;flex-direction:column;gap:4px;margin:0 0 8px;padding:0;list-style:none}
.opt{display:flex;gap:8px;text-align:left;width:100%;border:1px solid transparent;background:none;border-radius:6px;padding:4px 8px;font-family:var(--font-serif)}
.opt:hover{background:var(--soft)}
.opt .mk{flex:none;min-width:1.7em;color:var(--muted);font-family:var(--font-body)}
.opt.on{background:var(--accent-weak);border-color:var(--accent)}
.opt.key{background:var(--ok-bg);border-color:var(--ok)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
figure{margin:0 0 10px}
figure img{border:1px solid var(--line);border-radius:6px;max-width:100%;height:auto;display:block}
figcaption{font-size:.76rem;color:var(--muted);margin-top:3px}
.ans-box{border-top:1px dashed var(--line);margin-top:8px;padding-top:8px;font-size:.9rem;display:flex;flex-direction:column;gap:8px}
.keyline{font-weight:700}
.evs{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.evs li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:start;font-size:.84rem}
.tier{font-family:var(--font-mono);font-size:.72rem;border:1px solid var(--line);border-radius:4px;padding:0 5px;background:var(--soft);white-space:nowrap}
.src{color:var(--muted)}
blockquote{margin:2px 0 0;padding-left:10px;border-left:2px solid var(--line);color:var(--muted);font-size:.82rem;overflow-wrap:anywhere}
.note{font-size:.84rem;color:var(--muted)}
.warn{font-size:.84rem;border-left:3px solid var(--s-conflict);padding-left:8px}
.row-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:14px;min-width:0}
.box h2{font-size:1rem;margin:0 0 8px}
.box h3{font-size:.9rem;margin:12px 0 4px}
.tw{overflow-x:auto}
table{border-collapse:collapse;font-size:.84rem;min-width:520px}
th,td{border:1px solid var(--line);padding:4px 8px;text-align:left;vertical-align:top}
th{background:var(--soft);font-weight:500}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
pre.code{background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:10px;overflow-x:auto;font-family:var(--font-mono);font-size:.78rem;white-space:pre-wrap;margin:0}
ul.plain{margin:4px 0;padding-left:20px}
ul.plain li{margin:3px 0}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 14px;font-size:.88rem}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.res{font-size:1rem;padding:10px 14px;border:1px solid var(--accent);background:var(--accent-weak);border-radius:8px;margin-bottom:12px}
.link{color:var(--accent);text-decoration:underline;cursor:pointer;background:none;border:0;padding:0;font-size:inherit}
.foot{margin-top:24px;font-size:.76rem;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}

sup,sub{font-size:.72em;line-height:0}
.why{display:flex;flex-direction:column;gap:6px;margin:4px 0 0;padding:0;list-style:none}
.why li{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:6px;align-items:start;font-size:.86rem}
.vd{font-size:.7rem;border:1px solid var(--line);border-radius:4px;padding:0 6px;white-space:nowrap}
.vd.a{color:var(--ok);border-color:var(--ok)}.vd.x{color:var(--bad);border-color:var(--bad)}.vd.r{color:var(--s-infer);border-color:var(--s-infer)}
.bz{font-size:.7rem;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-left:4px;white-space:nowrap}
.figwrap{position:relative;display:inline-block;max-width:100%}
.figlab{position:absolute;top:6px;left:6px;pointer-events:none;border:1.5px solid var(--accent);color:var(--accent);background:transparent;font:700 .8rem var(--font-mono);padding:0 6px;border-radius:4px;text-shadow:0 0 3px var(--surface),0 0 3px var(--surface),0 0 6px var(--surface)}
.scard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:14px;min-width:0}
.scard-h{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-bottom:6px}
.scard-h h2{font-size:1.02rem;margin:0 8px 0 0}
.cnt{font-size:.72rem;background:var(--accent-weak);border-radius:999px;padding:0 9px;white-space:nowrap}
.sec-t{font-size:.76rem;font-weight:700;color:var(--accent);margin:14px 0 4px;letter-spacing:.03em}
.pts{list-style:none;margin:0;padding:0}
.pts li{padding:5px 0;border-bottom:1px dotted var(--line)}
.pts .s{font-size:.7rem;color:var(--muted);margin-left:6px}
.mem{background:var(--accent-weak);border-radius:6px;padding:8px 12px;margin:0;list-style:none}
.mem li{padding:3px 0}
.vsrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
@media (max-width:600px){.vsrow{grid-template-columns:minmax(0,1fr)}}
.vsc{border:1px solid var(--line);border-radius:6px;padding:6px 10px;min-width:0}
.vsc .vh{font-weight:700;font-size:.86rem}
.vst{font-size:.78rem;color:var(--muted);margin-bottom:2px}
table.st th{background:var(--accent-weak)}
table.st tbody tr:nth-child(even){background:var(--soft)}
table.st td:first-child{font-weight:700}
details.srcd{margin-top:10px;font-size:.84rem}
details.srcd summary{cursor:pointer;color:var(--muted)}
.fnb{font-size:.82rem;border-top:1px solid var(--line);margin-top:6px;padding-top:6px}
.toc{display:flex;flex-wrap:wrap;gap:6px}
.hid{display:none}
@media print{header.top,.tools,.row-actions,.no-print,.foot,.tabs{display:none!important}body{padding:0;background:#fff;color:#000}.scard{border:0;break-inside:avoid-page;padding:0}.hid{display:block!important}details.srcd:not([open]) *{display:none}}
/* 시험지형 */
body.exam{--bg:#ffffff;--surface:#ffffff;--fg:#000000;--muted:#000000;--line:#000000;--soft:#ffffff;--accent:#000000;--accent-weak:#ffffff;--accent-fg:#ffffff;color-scheme:light;font-family:var(--font-serif)}
body.exam .meta,body.exam .ans-box,body.exam .card-h .badge,body.exam .card-h .tag:not(.keep),body.exam .row-actions,body.exam figcaption,body.exam .dupl{display:none!important}
body.exam .card{border-radius:0;border-width:0 0 1px 0}
body.exam .opt.on{background:#fff;border-color:#000;text-decoration:underline}
body.exam aside.omr{border-radius:0}
.timer{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}}

/* v6.9 내용 정리: 단원 허브(흐름 → 키워드 → 비교 → 순서 → 함정), 반복 개념, 연결 맵, 기간 막대 */
.hub{--cc:var(--accent);background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--cc);border-radius:8px;padding:16px 18px 14px;margin-bottom:18px;min-width:0}
.hub-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin-bottom:4px}
.hub-n{font-family:var(--font-mono);font-weight:500;font-size:.8rem;color:var(--cc);border:1px solid var(--cc);border-radius:4px;padding:0 7px}
.hub-h h2{font-size:1.2rem;margin:0;letter-spacing:-.01em}
.hub-tag{color:var(--muted);font-size:.92rem;flex:1 1 220px}
.hub .cn-row{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px}
.cn{border:1px solid var(--line);background:var(--soft);border-radius:12px;padding:2px 10px;font-size:.78rem;display:inline-flex;flex-wrap:wrap;gap:0 6px;align-items:baseline;max-width:100%;text-align:left}.cn .note{flex:1 1 150px;min-width:0}
.cn::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--cc,var(--accent));align-self:center;flex:none}
button.cn:hover{border-color:var(--cc,var(--accent))}
.h3s{font-size:.78rem;font-weight:700;letter-spacing:.04em;color:var(--cc);margin:18px 0 8px;display:flex;align-items:center;gap:8px}
.h3s::after{content:"";flex:1;height:1px;background:var(--line)}
ol.flow{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 16px}
ol.flow>li{position:relative;background:color-mix(in srgb,var(--cc) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--cc) 28%,var(--line));border-radius:8px;padding:10px 12px 10px;min-width:0}
ol.flow>li:not(:last-child)::after{content:"\2192";position:absolute;right:-12px;top:50%;transform:translateY(-50%);color:var(--cc);font-weight:700;background:var(--surface);border-radius:50%;width:16px;height:16px;line-height:15px;text-align:center;font-size:.8rem;z-index:1}
.fn{font-family:var(--font-mono);font-size:.72rem;color:var(--cc);margin-right:6px}
ol.flow b{font-size:.95rem}
.fk{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 4px}
.kc{font-family:var(--font-mono);font-size:.72rem;background:var(--surface);border:1px solid color-mix(in srgb,var(--cc) 35%,var(--line));border-radius:4px;padding:0 6px}
ol.flow p{overflow-wrap:anywhere;margin:2px 0 0;font-size:.82rem;color:var(--muted);line-height:1.45}
@media (max-width:640px){ol.flow{grid-template-columns:minmax(0,1fr)}ol.flow>li:not(:last-child)::after{content:"\2193";right:auto;left:50%;top:auto;bottom:-14px;transform:translateX(-50%)}}
.kg{margin:10px 0 0}
.kg h4{margin:0 0 6px;font-size:.88rem;display:flex;align-items:center;gap:8px}
.kg h4::before{content:"";width:9px;height:9px;border-radius:2px;background:var(--cc)}
.kt{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px}
.kti{border:1px solid var(--line);border-left:3px solid var(--cc);border-radius:4px;padding:5px 9px;background:var(--surface);min-width:0}
.kti b{display:block;font-size:.86rem;overflow-wrap:anywhere}
.kti span{display:block;font-size:.78rem;color:var(--muted);line-height:1.4}
.cmpw{margin:10px 0 0}.cmpw .ct{font-size:.84rem;font-weight:700;margin-bottom:3px}
.cmpw table.st th{background:color-mix(in srgb,var(--cc) 16%,var(--surface))}
.cmpw table.st td:first-child{color:var(--cc)}
.steps{list-style:none;padding:0;margin:4px 0 0;display:flex;flex-wrap:wrap;gap:6px 0;counter-reset:st}
.steps li{counter-increment:st;display:flex;align-items:stretch}
.steps li>div{background:color-mix(in srgb,var(--cc) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--cc) 28%,var(--line));border-radius:6px;padding:4px 10px;font-size:.82rem;min-width:110px}
.steps li>div b{display:block}.steps li>div span{color:var(--muted);font-size:.76rem}
.steps li:not(:last-child)::after{content:"\2192";align-self:center;padding:0 6px;color:var(--cc);font-weight:700}
.tline{position:relative;display:flex;flex-wrap:wrap;gap:8px 0;margin:8px 0 0;padding-top:14px}
.tline::before{content:"";position:absolute;left:0;right:0;top:6px;height:2px;background:color-mix(in srgb,var(--cc) 40%,var(--line))}
.tline>div{flex:1 1 130px;min-width:110px;position:relative;padding:6px 8px 0 0}
.tline>div::before{content:"";position:absolute;top:-12px;left:0;width:10px;height:10px;border-radius:50%;background:var(--cc);border:2px solid var(--surface)}
.tline b{display:block;font-size:.84rem}.tline span{font-size:.76rem;color:var(--muted)}
.seqt{font-size:.84rem;font-weight:700;margin:12px 0 2px}
ul.traps{list-style:none;padding:0;margin:4px 0 0;display:grid;gap:5px}
ul.traps li{display:flex;gap:8px;font-size:.88rem;background:var(--bad-bg);border-radius:6px;padding:5px 10px}
ul.traps li::before{content:"!";font-weight:700;color:var(--bad);font-family:var(--font-mono)}
.hub details.srcd{margin-top:12px}
.con-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px}
.con{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;min-width:0}
.con h3{margin:0;font-size:1rem;display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline}.con h3 small{color:var(--muted);font-weight:400;font-size:.76rem}
.fq{display:flex;align-items:center;gap:8px;margin:8px 0 6px;font-size:.78rem;color:var(--muted)}
.fq .bar{flex:1;height:8px;background:var(--soft);border-radius:4px;overflow:hidden}.fq .bar i{display:block;height:100%;background:var(--accent)}
.cbars{display:flex;gap:3px;align-items:flex-end;height:26px;margin:2px 0 8px}
.cbars span{flex:1;background:var(--soft);border-radius:2px 2px 0 0;position:relative;min-height:3px}
.cbars span.on{background:var(--cc)}
.con ul{list-style:none;padding:0;margin:0;display:grid;gap:3px;font-size:.82rem}
.con li{display:flex;gap:8px}.con li b{color:var(--cc);font-family:var(--font-mono);font-size:.74rem;flex:none;width:30px}
table.mx{border-collapse:collapse;font-size:.84rem;width:100%}
table.mx th,table.mx td{border:1px solid var(--line);padding:4px 8px;text-align:center}
table.mx thead th{background:var(--soft);font-weight:700;position:sticky;top:0}
table.mx td:first-child,table.mx th:first-child{text-align:left;font-weight:700;position:sticky;left:0;background:var(--surface)}

.yon .tag{margin-left:4px}.yx{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0 0}.yx span{font-size:.78rem;border:1px dashed color-mix(in srgb,var(--cc) 45%,var(--line));border-radius:4px;padding:0 7px}
.vdl{font-size:.74rem;border-radius:999px;padding:0 8px;background:var(--soft);white-space:nowrap}.vdl.ok{background:var(--ok-bg);color:var(--ok)}.vdl.diff{background:var(--bad-bg);color:var(--bad)}.vdl.unk{background:color-mix(in srgb,var(--s-est) 18%,var(--surface))}.star{color:var(--accent);font-weight:700}tr.rel td{color:var(--muted)}
.yt td:nth-child(2),.yt td:nth-child(4){white-space:nowrap}
.solo{margin:6px 0;padding-left:0;list-style:none}.solo li{padding:4px 8px;border-left:3px solid var(--line);margin:3px 0;font-size:.92em}.solo li.sy{border-color:var(--ok);background:color-mix(in srgb,var(--ok-bg) 100%,transparent)}.sol{margin-bottom:8px}
.ansc{display:inline-block;min-width:22px;text-align:center;border:1px solid var(--ok);color:var(--ok);background:var(--ok-bg);border-radius:999px;padding:0 6px;font-weight:700}.keyline.okk{color:var(--ok)}.keyline.badd{color:var(--bad)}.yt-l{display:block;margin:6px 0 2px;font-size:.84rem;color:var(--muted)}.yt-ta{width:100%;margin-top:4px;font:inherit;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 8px}.tag.bad{background:var(--bad-bg);color:var(--bad)}

<div class="wrap">
<header class="top">
  <div class="title-row">
    <h1>치과조직학 중간 대비</h1>
    <span class="sub">단국대 치과대학 치의예과 · 2026-2 · 중간고사 · 25학번</span>
    <span class="ver" id="ver"></span>
    <button class="btn" id="themeBtn" type="button" style="margin-left:auto">테마</button>
  </div>
  <nav class="tabs" id="tabs" role="tablist" aria-label="탭"></nav>
</header>
<main id="main" style="padding-top:6px"></main>
<div class="foot" id="diag"></div>
</div>

<script>
const DB = __DATA__;
const IMG = __IMG__;
const LS = {
  get(k, d){ try{ const v = localStorage.getItem('hist26.' + k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('hist26.' + k, JSON.stringify(v)); return true; }catch(e){ return false; } }
};
const TABS = [["status","현황·범위"],["mc","객관식"],["sum","내용 정리"],["full","전체 내용 정리"],["all","단원별 전체 펴기"],["yon","연대야마"],["new","예상 문제"],["mock","모의고사"]];
const S = { tab: LS.get('tab','status'), ch: 0, hak: 'all', st: 'all', group: true, exam: false, showAll: false,
  omr: LS.get('omr', {}), ua: LS.get('ua', {}), uaWhy: LS.get('uaWhy', {}), open: {}, graded: null, inclEst: false,
  mock: null, newOpen: {}, newMarks: {}, sch: 0, fold: {}, cc: {}, ymode: 'tab', yex: 'all', yst: 'all', yp: LS.get('yp', {}), yt: LS.get('yt', {}), yopen: {}, yclr: false };
const MKS = {c:'①②③④⑤⑥⑦⑧', ga:'가나다라마바', g:'ㄱㄴㄷㄹㅁㅂ'};
const mark = (mk, i) => mk === 'n' ? (i+1)+'.' : mk === 'ga' ? MKS.ga[i]+')' : mk === 'g' ? MKS.g[i]+'.' : MKS.c[i];
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TIER = {T1:'T1 정답지', T2:'T2 타 선배 원본 야마', T2p:'T2′ 선배 필기', T4:'T4 교안', T5:'T5 추론', T6:'T6 교재'};
const Q = DB.Q, NEW = DB.NEW;
const qById = Object.fromEntries(Q.map(q => [q.id, q]));
const uaOf = id => S.ua[id];
const statusOf = q => uaOf(q.id) ? '사용자 확정' : q.status;
const ansOf = q => uaOf(q.id) || q.ans;
const times = q => q.srcs.length;
const haks = q => [...new Set(q.srcs.map(s => s.k))];
const ansLabel = (q, a) => a && a.length ? a.map(i => mark(q.mk, i-1) + (q.opts[i-1] ? ' ' + q.opts[i-1] : '')).join(' / ') : '';


/* v6.8 §14 ② 위·아래 첨자: 화면 표시 단계에서만 변환(원문 인용은 esc만 사용) */
function sx(raw){
  let h = esc(raw);
  h = h.replace(/\b10\^(-?\d+)/g, (m, n) => '10<sup>' + n.replace('-', '−') + '</sup>');
  h = h.replace(/\b10-(\d{1,3})(?=\s*(?:[~∼]|sec\b|[μµ㎛]m|nm\b|mm\b|cm\b|\)|M\b))/g, '10<sup>−$1</sup>');
  h = h.replace(/([A-Za-z\)])\^(\d+)/g, '$1<sup>$2</sup>');
  h = h.replace(/\b(mm|cm|nm|km|m|[μµ]m|㎛)([23])(?![\d.])/g, (m, u, n) => u + '<sup>' + n + '</sup>');
  h = h.replace(/\b(Sv|Gy|Bq)-1\b/g, '$1<sup>−1</sup>');
  h = h.replace(/\b(Ca|Mg)(\d)\+/g, '$1<sup>$2+</sup>');
  h = h.replace(/\b(H2O2|H2O|CO2|O2|I2|N0|D1|D2)(?![\w])/g, m => m.replace(/(\d)/g, '<sub>$1</sub>'));
  return h;
}
function rich(raw){
  let t = String(raw ?? '');
  if(!/\*\*/.test(t)){ const m = t.match(/^([^:：=]{2,26})([:：])/); if(m) t = '**' + m[1] + '**' + t.slice(m[1].length); }
  return sx(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
}
const EXAM_AT = new Date('2026-10-23T10:00:00+09:00');
function dday(){
  const d = Math.ceil((EXAM_AT - Date.now()) / 86400000);
  return d > 0 ? 'D-' + d : d === 0 ? 'D-Day' : 'D+' + (-d);
}
const FN_TITLE = '각주 · 타 학번 필기 · 정답 판정 근거 아님';

function badge(q){
  const s = statusOf(q);
  return `<span class="badge" data-s="${esc(s)}">${esc(s)}${q.conf ? ' · 신뢰도 ' + esc(q.conf) : ''}</span>`;
}
function srcTags(q){
  return q.srcs.map(s => `<span class="tag mono keep" title="${esc(s.n || '')}">${esc(s.k)}학번 ${esc(s.no)}</span>`).join('');
}
function evHtml(list){
  return `<ul class="evs">` + list.map(e => `<li><span class="tier">${esc(TIER[e.t] || e.t)}</span><div><span class="src">${esc(e.s)}</span>${e.p ? ' <span class="tag">요약·개념 수준</span>' : ''}<blockquote>${esc(e.q)}</blockquote></div></li>`).join('') + `</ul>`;
}
function imgHtml(q){
  if(!q.img) return '';
  const cap = {plasma:'그림: 형질세포 전자현미경 사진(23학번 docx 이미지, 문항 번호 2-07)',
    em:'그림: 골격근 세로 전자현미경 사진(23학번 docx). a~e 라벨은 원본에 없음, 손글씨 표시는 지웠으나 흔적이 일부 남아 있음',
    cardiac:'그림: 근육 세로 단면(24학번 docx, 화살표 = 사이원반)'}[q.img];
  const fq = DB.FIGNO[q.img] || '';
  return `<figure><div class="figwrap"><img src="${IMG[q.img]}" alt="${esc(fq + ' ' + q.id + ' ' + cap)}"><span class="figlab meta" aria-hidden="true">${esc(fq)}</span></div><figcaption>${esc(fq + ' · ' + cap)}</figcaption></figure>`;
}
function cardHtml(q, ctx){
  ctx = ctx || 'mc';
  const marks = ctx === 'mc' ? (S.omr[q.id] || []) : [];
  const opts = q.opts.length
    ? `<div class="opts" role="group" aria-label="선지">` + q.opts.map((o, i) =>
      `<button type="button" class="opt" data-act="opt" data-q="${q.id}" data-i="${i+1}"><span class="mk">${esc(mark(q.mk, i))}</span><span>${sx(o)}</span></button>`).join('') + `</div>`
    : `<p class="note meta">선지가 복기되지 않은 문항입니다.</p>`;
  const times_ = times(q);
  const dup = times_ > 1 ? `<span class="badge plain dupl" title="학번 간 동일 문항 묶음 · 같은 시험 내 반복 포함">동일 문항 ${times_}회 출제</span>` : '';
  const vars = q.var && q.var.length ? `<div class="note meta"><b>타 학번 표기</b><ul class="plain">${q.var.map(v => `<li>${esc(v.k)}학번: ${esc(v.stem)}${v.ans ? ' → ' + esc(v.ans) : ''}</li>`).join('')}</ul></div>` : '';
  const ex = ctx === 'mc' ? `
    <div class="row-actions meta">
      <button class="btn" type="button" data-act="ans" data-q="${q.id}" aria-expanded="${!!(S.open[q.id] || S.showAll)}">정답·근거 ${S.open[q.id] || S.showAll ? '접기' : '보기'}</button>
      <button class="btn" type="button" data-act="ua" data-q="${q.id}">정답 지정</button>
    </div>
    <div class="ans-box meta" ${S.open[q.id] || S.showAll ? '' : 'hidden'} id="ans-${q.id}">${ansBox(q)}</div>
    <div class="ans-box meta" hidden id="ua-${q.id}">${uaBox(q)}</div>` : '';
  return `<article class="card" id="c-${q.id}" data-card="${q.id}">
    <div class="card-h"><span class="cid">${q.id}</span><span class="tag meta">Ch${q.ch} ${esc(DB.CH[q.ch])}</span>${badge(q)}${dup}${srcTags(q)}</div>
    <p class="stem">${sx(q.stem)}</p>${imgHtml(q)}${opts}${vars}${ex}</article>`;
}
function ansBox(q){
  const a = ansOf(q);
  let h = '';
  const line = a && a.length ? ansLabel(q, a) : (q.anstext || (q.proposed ? '정답 없음(판정 보류)' : '정답 없음'));
  h += `<div class="keyline">${esc(statusOf(q))}: ${esc(line)}</div>`;
  if(q.proposed) h += `<div class="note"><b>추론·잠정:</b> ${esc(q.proposed)} <span class="tag">채점 제외</span></div>`;
  if(q.cand) h += `<div class="note"><b>후보:</b> ${esc(q.cand)}</div>`;
  if(q.why && q.why.length){
    const noAns = !(q.ans && q.ans.length);
    h += `<div class="whybox"><b>${noAns ? '검토 포인트 · 정답 미확정이라 채점 제외' : '보기별 판단 이유'}</b>${uaOf(q.id) ? ' <span class="note">(사용자 정답 지정과 다를 수 있습니다. 아래는 대장 정답 기준)</span>' : ''}<ul class="why">${q.why.map(w => `<li><span class="vd ${w.ok === null ? 'r' : w.ok ? 'a' : 'x'}">${w.ok === null ? '검토' : w.ok ? '정답' : '오답'}</span><span class="mono">${esc(mark(q.mk, w.l - 1))}</span><div>${sx(w.s)}<span class="bz">${w.b === 'T4' ? (DB.WHYSTAT.auto ? '교안 근거(자동 대조 통과)' : '교안 근거(수기 대조)') : '일반 지식·논리'}</span>${w.b === 'T4' && w.q ? `<blockquote>${esc(w.q)}</blockquote>` : ''}</div></li>`).join('')}</ul></div>`;
  } else if(!q.opts.length){ h += `<div class="note">선지 본문이 없는 문항이라 보기별 이유를 쓰지 않았습니다.</div>`; }
  const mm = DB.MISMATCH.find(x => x[0] === q.id);
  if(mm) h += `<div class="warn"><b>교안과 불일치 소지(사용자 확인 목록)</b> ${esc(mm[1])}</div>`;
  const yy = DB.Y[q.id];
  if(yy){
    const vl = {ok: '정답 후보와 일치', diff: '정답 후보와 불일치', unk: '우리 쪽 정답 미정', nm: '연대 쪽 정답 표시 없음'}[yy[3]];
    h += `<div class="yon ${yy[3]}"><b>타 학교 대조 · 연대야마</b> <span class="tag">${yy[0] === 'S' ? '같은 문항' : '비슷한 문항'}</span> <span class="tag">${vl}</span> <span class="tag">${{M: '정답 표시', N: '해설·노트 근거', '-': '표시 없음'}[yy[1]]}</span><div>${sx(yy[2])}</div><div class="note">정답·상태는 바꾸지 않았습니다. 에이전트가 읽은 기록이며 원문 쪽수는 확인하지 않았습니다.</div></div>`;
  }
  const ref = q.ev.filter(e => e.t !== 'T2p'), nb = q.ev.filter(e => e.t === 'T2p');
  if(ref.length) h += `<div><b>근거</b>${evHtml(ref)}</div>`;
  if(nb.length) h += `<div><b>선배 필기 대조</b> <span class="note">타 학번 기준이라 올해와 다를 수 있음 · 정답을 바꾸지 않음</span>${evHtml(nb)}</div>`;
  if(q.cf.length) h += `<div class="warn"><b>충돌·불일치(보존)</b><ul class="plain">${q.cf.map(c => `<li>${esc(c.s)}: ${esc(c.a)} — ${esc(c.n)}</li>`).join('')}</ul></div>`;
  if(q.note) h += `<div class="note">${esc(q.note)}</div>`;
  const rel = DB.REL[q.id] || [];
  if(rel.length) h += `<div class="note"><b>관련 단원 요약:</b> <button class="link" type="button" data-act="gosum" data-ch="${q.ch}">Ch${q.ch} ${esc(DB.CH[q.ch])}</button> · 예상 문제 ${rel.map(n => `<button class="link" type="button" data-act="gonew" data-id="${n}">${n}</button>`).join(' ')}</div>`;
  return h;
}
function uaBox(q){
  const cur = uaOf(q.id) || [];
  return `<div class="note">사용자가 정답을 지정하면 어떤 상태든 '사용자 확정'이 되어 최우선 적용됩니다. 이 브라우저에만 저장됩니다.</div>
  <div class="chips">${q.opts.map((o, i) => `<button type="button" class="chip" data-act="uapick" data-q="${q.id}" data-i="${i+1}" aria-pressed="${cur.includes(i+1)}">${esc(mark(q.mk, i))}</button>`).join('')}
  <button type="button" class="chip" data-act="uaclear" data-q="${q.id}">해제</button></div>
  <label>이유(선택) <input type="text" id="why-${q.id}" value="${esc(S.uaWhy[q.id] || '')}" data-act="uawhy" data-q="${q.id}" style="width:min(100%,360px)"></label>`;
}

/* ───────── 탭: 현황 ───────── */
function statusTab(){
  const st = DB.STATS;
  const dist = Object.entries(st.dist).map(([k, v]) => `<tr><td>${esc(k)}</td><td class="n">${v}</td></tr>`).join('');
  const conf = Object.entries(st.conf).map(([k, v]) => `<tr><td>${esc(k)}</td><td class="n">${v}</td></tr>`).join('');
  const hak = DB.HAK.map(r => `<tr>${r.map((c, i) => `<td class="${i >= 3 && i <= 4 ? '' : ''}">${esc(c)}</td>`).join('')}</tr>`).join('');
  const cross = DB.CROSS.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('');
  const files = DB.FILES.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('');
  const refs = DB.REFS.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('');
  return `
  <div class="box"><h2>이번 시험</h2><dl class="kv">
    <dt>대상</dt><dd>단국대 치과대학 치의예과 · 2026-2(2026학년도 2학기) · 중간고사 · 치과조직학(이동준 교수)</dd>
    <dt>내 학번</dt><dd>25학번(사용자 확정). 25학번 응시본은 아직 없어 '내 학번' 강조 대상 문항이 없습니다. 자료의 학번 구분은 그대로 둡니다.</dd>
    <dt>일정</dt><dd>2026.10.23 10:00–12:00 (사용자 확정으로 고정, 2026-10-16). 강의계획서에는 10/24로 적혀 있으나 따르지 않으며 참고로만 남깁니다.</dd>
    <dt>형식</dt><dd>객관식(선택형) 위주(24학번 복기본 번호 최대 81, 2025 선배 정리본 표제 '선택형에 한하여'). 문항 수·시간·배점 공지는 확인하지 못했습니다. 성적 비중: 중간 30%, 기말 30%, 실습시험 20%, 실습과제 10%, 출석 10%.</dd>
    <dt>프롬프트</dt><dd>${esc(DB.VER)}. 2026-10-10에는 v6.2로 만들었고, 2026-10-14 사용자 지시로 최신 Notion 범용 프롬프트(v6.8, v6.3~v6.7 포함)에 맞춰 교정했습니다. 문항 판정과 정답은 바꾸지 않았습니다.</dd>
  </dl></div>

function listFor(){
  let L = Q.filter(q => (S.ch === 0 || q.ch === S.ch) && (S.st === 'all' || statusOf(q) === S.st));
  if(S.hak !== 'all'){
    const rows = [];
    for(const q of L) for(const s of q.srcs) if(s.k === S.hak) rows.push({q, s});
    rows.sort((a, b) => (parseInt(a.s.no) || 999) - (parseInt(b.s.no) || 999));
    return rows.map(r => ({q: r.q, label: r.s.k + '학번 ' + r.s.no}));
  }
  if(!S.group){
    const rows = [];
    for(const q of L) for(const s of q.srcs) rows.push({q, label: s.k + '학번 ' + s.no});
    return rows;
  }
  return L.map(q => ({q}));
}

function chapterCard(c, mode){
  const u = DB.SUM[c], mem = DB.MEM[c] || [], vs = DB.VS[c] || [];
  const qs = Q.filter(q => q.ch == c), ns = NEW.filter(n => n.ch == c);
  const fns = DB.FN.filter(f => f.ch == c);
  const all = mode === 'all', closed = !!S.cc[c];
  const fold = !all && !S.fold[c] && u.pts.length > 6;
  const pts = u.pts.map((p, i) => `<li class="${fold && i >= 6 ? 'hid' : ''}">${rich(p[0])}<span class="s">[${esc(p[1])}]</span> ${p[2].map(id => `<button class="link" type="button" data-act="gomc" data-q="${id}">${id}</button>`).join(' ')}</li>`).join('');
  let tbl = '';
  if(u.tbl){
    const marks = fns.map((f, i) => `<sup>${i + 1}</sup>`).join('');
    tbl = `<div class="sec-t">비교표</div><div class="tw"><table class="st"><thead><tr>${u.tbl.h.map((h, i) => `<th>${i === 0 && fns.length ? (sx(h) || '표 전체') + marks : sx(h)}</th>`).join('')}</tr></thead><tbody>${u.tbl.r.map(r => `<tr>${r.map(c2 => `<td>${sx(c2)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    if(fns.length) tbl += `<div class="fnb"><b>${FN_TITLE}</b> <span class="note">표 전체 각주(행 연결 사전에서 못 찾아 표 머리 첫 칸에 붙임)</span><ul class="plain">${fns.map((f, i) => `<li><sup>${i + 1}</sup> [${esc(f.kind)}] ${sx(f.t)} <span class="note">(${esc(f.src)} · 쪽 미확인 · 신뢰도 ${esc(f.conf)})</span> <button class="link" type="button" data-act="gomc" data-q="${f.q}">${f.q}</button></li>`).join('')}</ul></div>`;
  }
  let gen = '';
  if(!u.tbl && fns.length) gen = `<div class="fnb"><b>단원 전반 각주</b> · <span class="note">${FN_TITLE}</span><ul class="plain">${fns.map(f => `<li>[${esc(f.kind)}] ${sx(f.t)} <span class="note">(${esc(f.src)} · 쪽 미확인 · 신뢰도 ${esc(f.conf)})</span> <button class="link" type="button" data-act="gomc" data-q="${f.q}">${f.q}</button></li>`).join('')}</ul></div>`;
  const memH = mem.length ? `<div class="sec-t">암기 포인트</div><ul class="mem">${mem.map(m => `<li>${rich(m[0])} <span class="note">[${esc(m[1])}]</span></li>`).join('')}</ul>` : '';
  const vsH = vs.length ? `<div class="sec-t">헷갈리는 비교</div>${vs.map(v => `<div class="vst">${esc(v[0])}</div><div class="vsrow"><div class="vsc"><div class="vh">${esc(v[1])}</div>${sx(v[2])}<div class="note">${esc(v[3])}</div></div><div class="vsc"><div class="vh">${esc(v[5])}</div>${sx(v[6])}</div></div>`).join('')}` : '';
  const links = `<div class="sec-t">기출·예상 연계</div><p class="note">${qs.map(q => `<button class="link" type="button" data-act="gomc" data-q="${q.id}">${q.id} ${esc(q.key.replace(/^\d\./, ''))}</button>`).join(' · ')}${ns.length ? '<br>예상 문제 ' + ns.map(n => `<button class="link" type="button" data-act="gonew" data-id="${n.id}">${n.id}</button>`).join(' ') : ''}</p>`;
  const quotes = []; const seen = new Set();
  const add = (src, q) => { if(q && !seen.has(q)){ seen.add(q); quotes.push([src, q]); } };
  qs.forEach(q => q.ev.filter(e => e.t === 'T4' && !e.p).forEach(e => add(e.s, e.q)));
  mem.forEach(m => add(m[1], m[2])); vs.forEach(v => { add(v[3], v[4]); add(v[3], v[7]); });
  const srcH = `<details class="srcd" ${all ? 'open' : ''}><summary>근거 원문(${quotes.length}건, 교안 열람 텍스트에서 옮김)</summary><ul class="plain">${quotes.map(x => `<li><span class="note">${esc(x[0])}</span><blockquote>${esc(x[1])}</blockquote></li>`).join('')}</ul></details>`;
  const body = `<p class="note">근거: ${esc(DB.CH_SRC[c])}</p>${gen}<div class="sec-t">핵심 요약</div><ul class="pts">${pts}</ul>${fold ? `<button class="btn no-print" type="button" data-act="fold" data-ch="${c}">더 보기 (${u.pts.length - 6}줄)</button>` : ''}${tbl}${memH}${vsH}${links}${srcH}`;
  return `<section class="scard" id="${all ? 'all' : 'sum'}-${c}"><div class="scard-h"><h2>Ch${c} ${esc(DB.CH[c])}</h2><span class="cnt">요약 ${u.pts.length}</span><span class="cnt">표 ${u.tbl ? 1 : 0}</span><span class="cnt">암기 ${mem.length}</span><span class="cnt">비교 ${vs.length}</span><span class="cnt">기출 ${qs.length}</span>${all ? `<button class="btn no-print" type="button" data-act="cc" data-ch="${c}" style="margin-left:auto">${closed ? '펴기' : '접기'}</button>` : ''}</div>${all && closed ? '' : body}</section>`;
}

function renderGrade(){
  const g = S.graded, b = $('#gradeBox'); if(!b) return;
  b.innerHTML = `<div class="res">확정·교차확인·사용자 확정 기준 <b>${g.s1}/${g.j1}</b>점${S.inclEst ? ` · 추정 포함 보조 <b>${g.s2}/${g.j2}</b>점` : ''} · 추론·충돌·미확정은 제외했습니다.</div>`;

function grade(){
  const rs = {}; let s1 = 0, j1 = 0, s2 = 0, j2 = 0;
  for(const q of Q){
    const a = ansOf(q), m = S.omr[q.id] || [];
    const st = statusOf(q);
    const strong = ['확정', '교차확인', '사용자 확정'].includes(st), est = st === '추정';
    if(!a || !a.length || !(strong || est)) continue;
    const ok = JSON.stringify([...a].sort()) === JSON.stringify([...m].sort());
    if(strong){ j1++; if(ok) s1++; rs[q.id] = {judged: true, ok}; }
    if(strong || est){ j2++; if(ok) s2++; if(est) rs[q.id] = {judged: S.inclEst, ok}; }
  }
  S.graded = {rs, s1, j1, s2, j2};
}

  else if(a === 'ych'){ S.ych = +t.dataset.ch; render(); }
  else if(a === 'goid'){ document.getElementById(t.dataset.id)?.scrollIntoView({behavior: 'smooth', block: 'start'}); }
  else if(a === 'gocon'){ if(S.tab !== 'full'){ S.tab = 'full'; LS.set('tab', 'full'); render(); } document.getElementById('con-' + t.dataset.id)?.scrollIntoView({block: 'center'}); }
  else if(a === 'fold'){ S.fold[t.dataset.ch] = true; render(); document.getElementById('sum-' + t.dataset.ch)?.scrollIntoView(); }
  else if(a === 'cc'){ S.cc[t.dataset.ch] = !S.cc[t.dataset.ch]; render(); document.getElementById('all-' + t.dataset.ch)?.scrollIntoView(); }
  else if(a === 'expall'){ S.cc = {}; render(); document.querySelectorAll('details.srcd').forEach(d => d.open = true); }
  else if(a === 'colall'){ Object.keys(DB.CH).forEach(c => S.cc[c] = true); render(); }
  else if(a === 'goall'){ if(S.cc[t.dataset.ch]){ S.cc[t.dataset.ch] = false; render(); } document.getElementById('all-' + t.dataset.ch)?.scrollIntoView(); }
  else if(a === 'print'){ try{ window.print(); }catch(err){ const n = $('#printNote'); if(n) n.hidden = false; } setTimeout(() => { const n = $('#printNote'); if(n) n.hidden = false; }, 400); }
  else if(a === 'group'){ S.group = !S.group; render(); }
  else if(a === 'exam'){ S.exam = !S.exam; render(); }
  else if(a === 'showall'){ S.showAll = !S.showAll; render(); }
  else if(a === 'opt'){ toggleMark(id, +t.dataset.i); }
  else if(a === 'ans'){ S.open[id] = !S.open[id]; const box = document.getElementById('ans-' + id); box.hidden = !S.open[id] && !S.showAll; t.textContent = '정답·근거 ' + (box.hidden ? '보기' : '접기'); t.setAttribute('aria-expanded', !box.hidden); }
  else if(a === 'ua'){ const b = document.getElementById('ua-' + id); b.hidden = !b.hidden; }
  else if(a === 'uapick'){ const cur = new Set(S.ua[id] || []); const i = +t.dataset.i; cur.has(i) ? cur.delete(i) : cur.add(i); if(cur.size) S.ua[id] = [...cur].sort(); else delete S.ua[id]; LS.set('ua', S.ua); render(); document.getElementById('c-' + id)?.scrollIntoView({block: 'center'}); }
  else if(a === 'uaclear'){ delete S.ua[id]; delete S.uaWhy[id]; LS.set('ua', S.ua); LS.set('uaWhy', S.uaWhy); render(); }
  else if(a === 'grade'){ S.inclEst = !!($('#estChk') && $('#estChk').checked); grade(); refreshMarks(); renderGrade(); }
  else if(a === 'resetomr'){ S.omr = {}; LS.set('omr', S.omr); S.graded = null; render(); }
  else if(a === 'jump'){ e.preventDefault(); document.getElementById('c-' + id)?.scrollIntoView({block: 'start', behavior: 'smooth'}); }
  else if(a === 'gosum'){ S.sch = 0, goto('sum', () => document.getElementById('sum-' + t.dataset.ch)?.scrollIntoView()); }
  else if(a === 'gomc'){ S.ch = 0; S.hak = 'all'; S.st = 'all'; S.group = true; goto('mc', () => { const c = document.getElementById('c-' + id); if(c){ c.scrollIntoView({block: 'center'}); S.open[id] = true; const b = document.getElementById('ans-' + id); if(b) b.hidden = false; } }); }
  else if(a === 'gonew'){ S.nch = 0; goto('new', () => document.getElementById('n-' + id)?.scrollIntoView({block: 'center'})); }
  else if(a === 'nopt'){ const cur = new Set(S.newMarks[id] || []); const n = NEW.find(x => x.id === id); const i = +t.dataset.i; if(cur.has(i)) cur.delete(i); else { if(!n.multi) cur.clear(); cur.add(i); } S.newMarks[id] = [...cur]; render(); document.getElementById('n-' + id)?.scrollIntoView({block: 'center'}); }
  else if(a === 'nans'){ S.newOpen[id] = !S.newOpen[id]; render(); document.getElementById('n-' + id)?.scrollIntoView({block: 'center'}); }
  else if(a === 'mockstart'){
    const n = Math.max(5, Math.min(60, +($('#mockN').value) || 20)), useNew = $('#mockNew').checked;
    let pool = Q.filter(q => q.opts.length && ansOf(q) && ansOf(q).length && ['확정', '교차확인', '추정', '사용자 확정'].includes(statusOf(q)));
    if(useNew) pool = pool.concat(NEW.map(x => ({...x, key: x.id, status: '예상 문제', conf: '', srcs: []})));
    const byCh = {}; pool.forEach(q => (byCh[q.ch] = byCh[q.ch] || []).push(q));
    const tot = pool.length, items = [];
    Object.values(byCh).forEach(g => g.sort(() => Math.random() - .5));
    const chs = Object.keys(byCh);
    chs.forEach(c => { const k = Math.max(1, Math.round(n * byCh[c].length / tot)); items.push(...byCh[c].slice(0, k)); });
    items.sort(() => Math.random() - .5);
    S.mock = {n, useNew, items: items.slice(0, n), marks: {}, t0: Date.now(), done: false}; startTimer(); render();
  }
  else if(a === 'mopt'){ const m = S.mock; if(m.done) return; const q = m.items.find(x => x.id === id), cur = new Set(m.marks[id] || []), i = +t.dataset.i; if(cur.has(i)) cur.delete(i); else { if(!(q.multi || /모두/.test(q.stem))) cur.clear(); cur.add(i); } m.marks[id] = [...cur]; const y = window.scrollY; render(); window.scrollTo({top: y}); }
  else if(a === 'mockend'){
    const m = S.mock; m.done = true; let s1 = 0, j1 = 0, s2 = 0, j2 = 0;
    m.items.forEach(q => { const a2 = ansOfAny(q), k = m.marks[q.id] || [], ok = JSON.stringify([...a2].sort()) === JSON.stringify([...k].sort()); const strong = ['확정', '교차확인', '사용자 확정'].includes(statusOf(q)); if(strong){ j1++; if(ok) s1++; } j2++; if(ok) s2++; });
    Object.assign(m, {s1, j1, s2, j2}); render();
  }
  else if(a === 'export'){
    const arr = Object.keys(S.ua).map(id => ({id, alias: qById[id].srcs.map(s => s.k + '-' + s.no).join(','), answer: S.ua[id], reason: S.uaWhy[id] || ''}));
    const txt = JSON.stringify({exported_at: new Date().toISOString().slice(0, 10), user_answers: arr});
    const ta = $('#expOut'); ta.value = txt; ta.hidden = false;
    (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).catch(() => { ta.select(); });
  }
  else if(a === 'copylim'){ const txt = $('#limits').textContent; (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).catch(() => {}); }
});
document.addEventListener('change', e => {
  if(e.target.id === 'hakSel'){ S.hak = e.target.value; render(); }
  else if(e.target.id === 'stSel'){ S.st = e.target.value; render(); }
  else if(e.target.id === 'estChk'){ S.inclEst = e.target.checked; if(S.graded){ grade(); refreshMarks(); renderGrade(); } }
});
document.addEventListener('input', e => { const t = e.target; if(t.dataset && t.dataset.act === 'yt'){ S.yt[t.dataset.id] = t.value; LS.set('yt', S.yt); const n = t.parentElement.nextElementSibling; if(n) n.textContent = '저장됨 · ' + t.value.length + '자'; return; } if(t.dataset && t.dataset.act === 'uawhy'){ S.uaWhy[t.dataset.q] = t.value; LS.set('uaWhy', S.uaWhy); } });
$('#themeBtn').addEventListener('click', () => {
  const r = document.documentElement, cur = r.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : cur === 'light' ? null : 'dark';
  next ? r.setAttribute('data-theme', next) : r.removeAttribute('data-theme');
  $('#themeBtn').textContent = '테마: ' + (next === 'dark' ? '어둡게' : next === 'light' ? '밝게' : '시스템');
});
$('#themeBtn').textContent = '테마: 시스템';
$('#ver').textContent = DB.VER;
const lsOk = LS.set('probe', 1);
$('#diag').textContent = '화면 진단 · 프롬프트 ' + DB.VER + ' · 문항 ' + DB.STATS.uniq + '건 · 보기별 이유 ' + DB.WHYSTAT.cards + '문항(교안 인용 ' + DB.WHYSTAT.quotes + '건, 대조 ' + (DB.WHYSTAT.auto ? DB.WHYSTAT.autoOk + '건 자동 통과' : '수기') + ') · 인용 그림 ' + DB.FIGS.length + '건 · AI: 미구현(요청 없음) · 브라우저 저장: ' + (lsOk ? '사용 가능' : '사용 불가(OMR 새로고침 시 초기화)') + ' · 생성 ' + DB.BUILT;
render();
</script>
