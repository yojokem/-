{ch:1,items:[

 ["1.되먹임","음성되먹임은 변화에 반대되는 방향으로 조절되어 정상으로 회복되는 기전이고, 앞먹임 기전은 변화를 예상하여 반응을 일으키는 것입니다.","교안 1장 '항상성 관련 조절기전'"],

const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=s=>document.querySelector(s);
const link=k=>{const s=SRC[k];return s?`<a href="https://drive.google.com/file/d/${s.id}/view" target="_blank" rel="noopener">${esc(s.n)}</a>`:esc(k)};
const stKey={"확정":"x","사용자 확정":"user","교차확인":"x","추정":"e","추론":"p","충돌":"c","미확정":"u","예상":"e"};
function eff(q){ // 사용자 정정 최우선
  const u=ST.user[q.id];
  if(u&&u.ans&&u.ans.length)return Object.assign({},q,{ans:u.ans,status:"사용자 확정",_user:u});
  if(u&&u.text)return Object.assign({},q,{atext:u.text,status:"사용자 확정",_user:u});
  return q;
}
function freq(q){const s=new Set((q.srcs||[]).map(x=>x[0]));return s.size}
function ansText(q){
  if(q.form==="MC"&&q.ans)return q.ans.map(i=>CIRC[i]+" "+q.opts[i]).join(" / ");
  return q.atext||"";
}
function sameSet(a,b){if(!a||!b)return false;const x=[...a].sort().join(","),y=[...b].sort().join(",");return x===y}

function cardHTML(q0,ctx){
  const q=q0.exp?q0:eff(q0); const isB=!!q0.exp; // 예상 문제는 expl 필드
  const mc=q.form==="MC";
  const rev=ST.all||ST.rev[ctx+q.id];
  const mk=ST.omr[ctx+":"+q.id]||[];
  const gr=ST.graded[ctx+":"+q.id];
  let h=`<article class="card${gr==="ok"?" ok":gr==="ng"?" ng":""}" id="c-${ctx}-${esc(q.id)}">`;
  h+=`<div class="chead"><span class="cid">${esc(q.id)}</span>`;
  if(isB){h+=`<span class="st st-e">예상 · 교안 근거</span>`}
  else{
    h+=`<span class="st st-${stKey[q.status]||"u"}">${esc(q.status)}${q.status==="추정"&&q.conf?" · 신뢰도 "+esc(q.conf):""}</span>`;
    if(q.prop)h+=`<span class="tag">잠정 · 신뢰도 ${esc(q.prop.conf)}</span>`;
    if(q.ev)h+=`<span class="tag">${[...new Set(q.ev.map(e=>e[0]))].join("·")}</span>`;
    const f=freq(q); if(f>1)h+=`<span class="tag">반복 ${f}회 (${[...new Set(q.srcs.map(x=>x[0]))].join("·")}학번)</span>`;
    if(q.typo)h+=`<span class="tag warn">오기 병기</span>`;
    if(q.dup)h+=`<span class="tag warn">중복 의심</span>`;
    if(q.out)h+=`<span class="tag">범위 외</span>`;
  }
  h+=`</div><div class="stem">${esc(q.stem)}</div>`;
  if(mc){
    h+=`<ol class="opts">`+q.opts.map((o,i)=>{
      let c=""; if(mk.includes(i))c+=" sel";
      if(rev&&q.ans&&q.ans.includes(i)&&(isB||GRADED.includes(q.status)||q.status==="추정"))c+=" corr";
      return `<li class="${c}" data-act="mark" data-ctx="${ctx}" data-id="${esc(q.id)}" data-i="${i}"><span class="n">${CIRC[i]}</span><span>${esc(o)}</span></li>`}).join("")+`</ol>`;
  }else if(q.form==="DS"){
    h+=`<div class="own"><input type="text" id="t-${ctx}-${esc(q.id)}" placeholder="내 답 (채점 대상 아님)" aria-label="내 답" style="flex:1;min-width:140px"></div>`;
  }
  if(rev){
    if(isB){h+=`<div class="ansbox">정답: ${esc(ansText(q))}</div><div class="expl">${esc(q.expl)}</div>`}
    else if(q.status==="미확정"){
      h+=`<div class="ansbox prov">정답 미확정${q.cand&&mc?" · 후보 "+q.cand.map(i=>CIRC[i]).join(", "):""}${q.cand&&!mc?" · 후보 "+esc(q.cand.join(" / ")):""}</div>`;
    }else if(q.status==="추론"){
      h+=`<div class="ansbox prov">잠정 답(추론, 채점 제외): ${esc(q.prop.text)}<br>대안: ${esc(q.prop.alt)} · 재판정 조건: ${esc(q.prop.recheck)}</div>`;
    }else{
      h+=`<div class="ansbox">${q.status==="사용자 확정"?"사용자 확정 정답":q.status==="추정"?"정답(추정)":"정답"}: ${esc(ansText(q))}</div>`;
    }
    if(q.note&&!isB)h+=`<div class="expl">${esc(q.note)}</div>`;
  }
  if(!isB){
    if(q.typo)h+=q.typo.map(t=>`<div class="typo">[원문] ${esc(t[0])}<br>[수정 제안] ${esc(t[1])}<br>[사유] ${esc(t[2])}</div>`).join("");
    if(q.dup)h+=`<div class="typo">${esc(q.dup)}</div>`;
    if(q.conflicts)h+=q.conflicts.map(c=>`<div class="typo">[표기 차이] ${link(c[0])}: ${esc(c[1])}<br>${esc(c[2])}</div>`).join("");
    if(q.srcs){
      h+=`<div class="meta"><div>출처: ${q.srcs.map(s=>`${esc(s[0])}학번 ${esc(s[1])} 중간 ${s[3]==="-"?"번호 없음":esc(s[3])}`).join(" · ")}</div></div>`;
    }
    if(q.ev){
      h+=`<details><summary>근거·출처 (${q.ev.length})</summary><ul>`+q.ev.map(e=>`<li><b>${esc(e[0])}</b> ${link(e[1])}<br><span class="q">${e[3]?"[요약] ":""}“${esc(e[2])}”</span></li>`).join("")+`</ul></details>`;
    }
    if(q.srcs&&q.srcs.length){
      h+=`<details><summary>출처 파일</summary><ul>`+[...new Set(q.srcs.map(s=>s[4]))].map(k=>`<li>${link(k)}</li>`).join("")+`</ul></details>`;
    }
    if(q.key){
      const rel=B.filter(b=>b.der.includes(q.id));
      if(rel.length)h+=`<div class="meta"><div>파생 예상 문제: ${rel.map(b=>`<button class="jump" data-act="gotoB" data-id="${b.id}" type="button">${b.id}</button>`).join(" ")}</div></div>`;
    }
    // 정답 지정(사용자)
    h+=`<div class="own"><label for="u-${ctx}-${esc(q.id)}">내 확정 정답</label>`;
    if(mc){h+=`<select id="u-${ctx}-${esc(q.id)}" data-act="user" data-id="${esc(q.id)}"><option value="">(지정 안 함)</option>`+q.opts.map((o,i)=>`<option value="${i}"${q._user&&q._user.ans&&q._user.ans.includes(i)?" selected":""}>${CIRC[i]}</option>`).join("")+`</select>`}
    else{h+=`<input id="u-${ctx}-${esc(q.id)}" data-act="usertext" data-id="${esc(q.id)}" value="${esc(q._user&&q._user.text||"")}" placeholder="정답 텍스트">`}
    h+=`<input id="r-${ctx}-${esc(q.id)}" data-act="reason" data-id="${esc(q.id)}" value="${esc((ST.user[q.id]&&ST.user[q.id].reason)||"")}" placeholder="이유(선택)"></div>`;
  }else{
    h+=`<div class="meta"><div>근거: ${link(q.ev[0])}<br><span class="q">${q.ev[2]?"[요약] ":""}“${esc(q.ev[1])}”</span></div><div>파생 기출: ${q.der.map(d=>`<button class="jump" data-act="gotoQ" data-id="${esc(d)}" type="button">${esc(d)}</button>`).join(" ")}</div></div>`;
  }
  h+=`<div class="acts"><button class="btn" data-act="rev" data-ctx="${ctx}" data-id="${esc(q.id)}" type="button">${rev?"정답 숨기기":"정답 보기"}</button></div></article>`;
  return h;
}

function renderOMR(list,ctx){
  const el=$("#omrBody");
  const mcs=list.filter(q=>q.form==="MC");
  if(!mcs.length){el.innerHTML=`<span style="color:var(--muted)">이 탭에는 OMR 대상(객관식)이 없습니다.</span>`;return}
  el.innerHTML=mcs.map((q,idx)=>{
    const mk=ST.omr[ctx+":"+q.id]||[]; const gr=ST.graded[ctx+":"+q.id];
    return `<div class="omr-row ${gr||""}"><button class="no" data-act="goto" data-ctx="${ctx}" data-id="${esc(q.id)}" type="button" title="${esc(q.id)}">${idx+1}</button>`+
      q.opts.map((o,i)=>`<button class="bub${mk.includes(i)?" on":""}" data-act="mark" data-ctx="${ctx}" data-id="${esc(q.id)}" data-i="${i}" type="button" aria-label="${idx+1}번 ${i+1}">${i+1}</button>`).join("")+`</div>`;
  }).join("")+`<div class="acts"><button class="btn" data-act="clearOmr" data-ctx="${ctx}" type="button">마킹 지우기</button></div>`;
}

/* ===== 채점 ===== */
function gradeList(list,ctx){
  let tot=0,ok=0,skipped=0,marked=0;
  list.forEach(q0=>{
    if(q0.form!=="MC")return;
    const q=q0.exp?q0:eff(q0);
    const key=ctx+":"+q.id; const mk=ST.omr[key]||[];
    if(mk.length)marked++;
    if(!(q0.exp||GRADED.includes(q.status))||!q.ans){skipped++;delete ST.graded[key];return}
    tot++;
    const r=sameSet(mk,q.ans)?"ok":"ng"; if(r==="ok")ok++;
    ST.graded[key]=r;
  });
  return {tot,ok,skipped,marked};
}

function saMatch(c,input){
  const u=SAN(input); if(!u)return {ok:false,hit:0,n:c.groups.length,empty:true};

    const m=g.some(alt=>{const a=SAN(alt); if(!a)return false; return u.includes(a)||(c.groups.length===1&&u.length>=2&&a.includes(u))});

}

function render(){
  document.body.classList.toggle("paper",ST.paper);
  renderTabs();
  ({mc:renderMC,ds:renderDS,sa:renderSA,ks:renderKS,sum:renderSum,all:renderAll,exp:renderExp,mock:renderMock,info:renderInfo})[ST.tab]();

/* ===== 이벤트 ===== */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act]"); if(!t)return;
  const act=t.dataset.act, id=t.dataset.id, ctx=t.dataset.ctx;
  if(act==="tab"){ST.tab=t.dataset.t;render();window.scrollTo(0,0)}
  else if(act==="ch"){ST.ch=+t.dataset.c;render()}
  else if(act==="rev"){const k=ctx+id;ST.rev[k]=!ST.rev[k];render();const c=document.getElementById("c-"+ctx+"-"+id);if(c)c.scrollIntoView({block:"nearest"})}
  else if(act==="mark"){
    const q=findQ(id); if(!q)return; const k=ctx+":"+id; const i=+t.dataset.i;
    const cur=ST.omr[k]||[]; ST.omr[k]=cur.includes(i)?cur.filter(x=>x!==i):cur.concat(i).sort((a,b)=>a-b);
    delete ST.graded[k]; saveOmr(); render();
  }
  else if(act==="goto"){const c=document.getElementById("c-"+ctx+"-"+id);if(c)c.scrollIntoView({behavior:"smooth",block:"start"})}
  else if(act==="clearOmr"){Object.keys(ST.omr).filter(k=>k.startsWith(ctx+":")).forEach(k=>{delete ST.omr[k];delete ST.graded[k]});saveOmr();render()}
  else if(act==="grade"){
    const list=ctx==="mc"?Q.filter(q=>q.form==="MC"&&(!ST.ch||q.ch===ST.ch)):ctx==="ks"?KS.filter(k=>!ST.ch||k.ch===ST.ch):B.filter(b=>!ST.ch||b.ch===ST.ch);
    const r=gradeList(list,ctx); render();
    const el=$("#gres"); if(el)el.textContent=`채점 ${r.ok}/${r.tot} (마킹한 문항 ${r.marked}, 채점 제외 ${r.skipped}문항)`;
  }
  else if(act==="gotoB"){ST.tab="exp";ST.ch=0;render();const c=document.getElementById("c-exp-"+id);if(c)c.scrollIntoView({block:"start"})}
  else if(act==="gotoQ"){
    const q=Q.find(x=>x.id===id); if(!q)return; ST.tab=q.form==="MC"?"mc":"ds"; ST.ch=0; render();
    const c=document.getElementById("c-"+(q.form==="MC"?"mc":"ds")+"-"+id); if(c)c.scrollIntoView({block:"start"});
  }
  else if(act==="export"){
    const ua=Object.keys(ST.user).map(id=>{const q=Q.find(x=>x.id===id);const u=ST.user[id];return {id:id,alias:id,answer:u.ans&&q?u.ans.map(i=>CIRC[i]):u.text||null,reason:u.reason||""}}).filter(x=>x.answer);
    const txt=JSON.stringify({exported_at:new Date().toISOString(),user_answers:ua},null,1);
    const out=$("#gres"); const fb=()=>{if(out)out.innerHTML=`<br><textarea id="expTxt" rows="6" style="width:100%" aria-label="내보내기 JSON">${esc(txt)}</textarea>`;const ta=$("#expTxt");if(ta)ta.select()};
    try{navigator.clipboard.writeText(txt).then(()=>{if(out)out.textContent="클립보드에 복사했습니다."},fb)}catch(err){fb()}
  }
  else if(act==="mockNew"){
    const withB=$("#mB").checked, n=+$("#mN").value;
    const pool=mockPool(withB).slice(); for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
    const list=pool.slice(0,Math.min(n,pool.length));
    Object.keys(ST.omr).filter(k=>k.startsWith("mock:")).forEach(k=>{delete ST.omr[k];delete ST.graded[k]});
    ST.mock={list,withB,n}; ST.mockStart=Date.now(); ST.rev={}; saveOmr(); render();
    clearInterval(ST.timer); ST.timer=setInterval(tickMock,1000);
  }
  else if(act==="mockGrade"){
    if(!ST.mock)return; let a=0,at=0,b=0,bt=0,ex=0,ext=0;
    ST.mock.list.forEach(q=>{
      const k="mock:"+q.id; const mk=ST.omr[k]||[]; const ok=sameSet(mk,q.ans);
      if(q.exp){ext++;if(ok)ex++}
      else if(GRADED.includes(q.status)){at++;if(ok)a++}
      else {bt++;if(ok)b++}
      ST.graded[k]=ok?"ok":"ng";
    });
    clearInterval(ST.timer); render(); clearInterval(ST.timer);
    $("#mres").innerHTML=`<div class="card">확정·교차확인 기준 ${a}/${at} · 추정 포함 보조 점수 ${a+b+ex}/${at+bt+ext} (추정 기출 ${b}/${bt}, 예상 문제 ${ex}/${ext})<br><span class="q">추론·충돌·미확정은 출제하지 않았습니다.</span></div>`;
  }
});
document.addEventListener("change",e=>{
  const t=e.target; if(!t.dataset||!t.dataset.act)return; const id=t.dataset.id;
  if(t.dataset.act==="user"){ST.user[id]=ST.user[id]||{}; if(t.value==="")delete ST.user[id].ans; else ST.user[id].ans=[+t.value]; cleanUser(id);saveUser();render()}
  else if(t.dataset.act==="usertext"){ST.user[id]=ST.user[id]||{}; if(t.value.trim()==="")delete ST.user[id].text; else ST.user[id].text=t.value.trim(); cleanUser(id);saveUser();render()}
  else if(t.dataset.act==="reason"){ST.user[id]=ST.user[id]||{}; ST.user[id].reason=t.value; cleanUser(id);saveUser()}
});
function cleanUser(id){const u=ST.user[id];if(u&&!u.ans&&!u.text&&!u.reason)delete ST.user[id]}
function findQ(id){return Q.find(q=>q.id===id)||B.find(q=>q.id===id)||KS.find(q=>q.id===id)||(ST.mock&&ST.mock.list.find(q=>q.id===id))||OUT.map(o=>({id:o.id,form:o.opts?"MC":"DS",opts:o.opts})).find(q=>q.id===id)}
$("#optAll").addEventListener("change",e=>{ST.all=e.target.checked;render()});
$("#optPaper").addEventListener("change",e=>{ST.paper=e.target.checked;render()});
$("#optOut").addEventListener("change",e=>{ST.out=e.target.checked;render()});
$("#btnTheme").addEventListener("click",()=>{
  const r=document.documentElement; const dark=r.getAttribute("data-theme")==="dark"||(!r.getAttribute("data-theme")&&matchMedia("(prefers-color-scheme: dark)").matches);
  r.setAttribute("data-theme",dark?"light":"dark"); lsSet("dp-theme",dark?"light":"dark");
});
(function init(){
  const th=lsGet("dp-theme"); if(th==="dark"||th==="light")document.documentElement.setAttribute("data-theme",th);
  const t=lsGet("dp-tab"); if(t&&TABS.some(x=>x[0]===t))ST.tab=t;
  $("#diag").textContent="진단: 기출 "+Q.length+"건 · 범위 외 "+OUT.length+"건 · 예상 "+B.length+"건 · AI 기능 미사용 · 저장소 "+(lsGet("dp-omr")===null?"비어 있음 또는 사용 불가":"사용 중");
  render();
})();
