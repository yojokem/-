 memo:['화생은 악성전환(암 발생)이 개시될 수 있다.','편평화생 = 상피화생 중 편평상피로 변하는 경우.'],
 cmp:[['비대 vs 증식','비대: 세포 크기 ↑, 새 세포 없음 / 증식: 세포 수 ↑, 분열능 필요'],['생리적 vs 병리적','자궁: 임신(비대)·분만 후(위축) 생리적 / 고혈압(좌심실 비대)·뇌 위축 병리적']],
 q:['23-2025-M-MC-01','23-2025-M-MC-02','N2-01','N2-02','N2-03']},
{id:'n2b',ch:2,t:'세포손상의 원인 7가지',src:'Ch2 p.12',
 sum:['산소결핍: 저산소증(hypoxia; 허혈, 빈혈) → 호기성 산화적 호흡 감소 → 세포 손상.','물리적 요인: 기계적 외상, 극한의 온도(화상, 동상), 방사선, 전기적 쇼크.','화학물질 및 약물: 비소, 청산, 수은염, 살충제, 제초제.','감염원: 바이러스, 진균, 기생충 등.','면역반응: 미생물, 환경물질(외인성), 자가면역질환(내인성).','유전적 장애: 기능적 단백질 결핍, 손상된 DNA 혹은 misfolded protein 축적.','영양불균형: 단백질-칼로리 결핍, 영양과다(비만).'],
 memo:['암기 순서: 산소 · 물리 · 화학 · 감염 · 면역 · 유전 · 영양'],q:['23-2025-M-MC-03']},
{id:'n2c',ch:2,t:'가역적 손상과 괴사의 형태',src:'Ch2 p.13–17',
 sum:['세포 손상 → 기능 저하 → 생화학적 변화 → 구조적 변화(미세구조·광학현미경) → 형태학적 변화(육안)의 순으로, 스트레스와 형태 변화 사이에는 시간적 간격이 있다.','가역적 손상: 세포·세포소기관 확장, 원형질막의 농포 형성, 소포체로부터 리보솜 분리, 핵내 염색질 응축. ATP 생성 감소, 단백질 합성 결함, 세포골격 손상, DNA 손상과 연관.','광학현미경 관찰: 세포종창(모든 형태의 세포 손상에서 관찰되는 일차적 소견), 지방변화(저산소증·독소에서 지방공포 출현).','괴사 = 비가역적 손상 = uncontrolled/unprogrammed 세포사. 호산성 증가, 핵융해·핵농축·핵붕괴, 막 파괴, 미토콘드리아 종창, 미엘린상 증가, 세포성 물질 누출, 효소성 소화.'],
 tbls:[{cap:'가역적 손상 vs 괴사',h:['구분','가역적 손상','괴사 (비가역)'],r:[
  ['세포·소기관','확장, 종창','원형질막·소기관 막 파괴, 미토콘드리아 종창'],
  ['핵','염색질 응축','핵융해(karyolysis) · 핵농축(pyknosis) · 핵붕괴(karyorrhexis)'],
  ['염색','—','호산성 증가: 단백질 변성(양전하 노출) → eosin 결합↑, RNA 감소 → hematoxylin↓'],
  ['지속 시','자극 중지 시 정상 복귀','세포성 물질 누출, 효소성 소화']]}],
 memo:['심근 허혈: 수 분 내 세포 종창 → 1~2시간 비가역 → 4~12시간 후 광학현미경상 세포사 확인.'],q:['23-2025-M-MC-04','23-2025-M-MC-05','N2-04','N2-05','N2-06']},
{id:'n2d',ch:2,t:'조직 괴사의 양상 6가지',src:'Ch2 p.18–23',
 tbls:[{h:['양상','핵심 서술','호발·예'],r:[
  ['응고괴사 (coagulative)','죽은 조직 구조가 최소 며칠간 보존. 단단함. 구조단백질·효소 변성','허혈(혈액 공급 차단). 심장·신장 경색'],
  ['액화괴사 (liquefactive)','사멸 세포가 소화되어 액상 점액덩어리. 죽은 백혈구 포함 시 크림 같은 황색 = 고름(pus)','뇌경색, 국소 세균·진균 감염'],
  ['괴저괴사 (gangrenous)','혈액공급 차단으로 여러 조직에서 괴사. 병변이 흑색','하지, 당뇨병 환자 발가락'],
  ['건락괴사 (caseous)','cheese-like, 부서지기 쉬운 백색. 무정형 과립성 부산물이 염증성 경계로 둘러싸임 = 육아종(granuloma)','대부분 결핵 병소'],
  ['지방괴사 (fat necrosis)','지방분해효소 방출 → 지방산이 칼슘과 결합해 백색 침착(비누화 saponification)','급성 췌장염'],
  ['섬유소성괴사 (fibrinoid)','항원-항체 복합체가 동맥벽에 침착 + 피브린 → 무정형 밝은 분홍색(유사섬유소)','자가면역질환, 혈관염']]}],
 memo:['허혈 → 응고괴사(경색). 뇌는 예외적으로 액화괴사.','육아종 = 건락괴사 + 염증성 경계.'],q:['N2-07']},
{id:'n2e',ch:2,t:'세포손상의 기전',src:'Ch2 p.25–32',
 sum:['손상성 자극에 가장 많이 손상되는 성분: 미토콘드리아, 세포막, 단백질, DNA.','① ATP 고갈 ② 미토콘드리아 손상 ③ 칼슘 유입 ④ ROS 축적 ⑤ 세포막 투과성 증가(전형적으로 괴사) ⑥ 손상된 DNA·잘못 접힌 단백질 축적(세포자멸사 유발).','ATP 고갈: Na-K 펌프 활성 감소 → 나트륨 유입 → 물 유입 → 세포 종창·ER 확장 / 혐기성 해당과정↑ → glycogen 고갈, 젖산↑ → pH↓ → 핵 응축 / 리보솜 분리 → 단백질 합성↓.','미토콘드리아 손상: 투과성 전이공(mitochondrial permeability transition pore) 개방 → 막 전위·산화적 인산화 상실 → ATP↓ → 괴사. 비정상 산화적 인산화로 ROS 생성. cytochrome c 유출 → apoptosis.','칼슘: 세포 내 저장소(ER 등)에서 세포질로 방출 → 미토콘드리아 pore 개방(ATP 고갈), phospholipase·protease·endonuclease 활성화.','산화 스트레스: 자유라디칼(최외각 궤도에 홑전자를 가진 화학물), ROS는 산소 유래 자유라디칼. 정상 미토콘드리아 호흡 중 낮은 농도로 생성되며 증가하면 지질·단백질·DNA 손상.','막 투과성: 미토콘드리아막(pore, cytochrome c) · 원형질막(삼투압 균형 파괴) · 리소좀막(효소 유출 → 괴사).'],
 memo:['pH가 낮아지는 이유: 혐기성 해당 → 젖산 증가.','DNA 손상이 너무 크면 복구 불가 → apoptosis.'],q:['23-2025-M-MC-06','23-2025-M-MC-07','N2-08','N2-09','N2-10']},
{id:'n2f',ch:2,t:'세포 사멸 유형 비교',src:'Ch2 p.34–49',
 tbls:[{h:['유형','핵심 특징','주요 분자','염증'],r:[
  ['Apoptosis (Type 1)','세포수축, 염색질 응축·핵 분절, membrane blebbing, apoptotic body. 프로그램된 자살','caspase: initiator(8, 9) / effector(3, 6, 7). 외인성: TNFR1·Fas → DISC → caspase-8. 내인성: Bcl-2 family, MOMP, cytochrome c → Apaf-1 → apoptosome → caspase-9','대부분 흔적 없이 제거, 큰 규모에서도 염증을 유발하지 않음'],
  ['Necroptosis','necrosis 형태 + apoptosis 기전. ATP 상실, 종창, ROS, 원형질막 파열','death receptor(TNF/TNFR1, FasL/Fas), RIP1·RIP3·MLKL = necrosome, MLKL oligomer가 막에 pore. caspase-8 비활성','DAMPs 방출 → 염증'],
  ['Pyroptosis','미생물 감염 세포. cell swelling, 막 파열, DNA damage','PRR → inflammasome → caspase-1 → IL-1β 활성, gasdermin D pore','염증성 cytokine 방출'],
  ['Autophagy (Type 2)','자기 내용물(cargo)을 먹음. 영양결핍·노화·스트레스 시 생존에 필수. 감당 못 할 스트레스면 세포사','phagophore(자가소화포) → elongation → autophagosome → lysosome 융합 → autolysosome → degradation. Macro-(주된 유형)·Micro-·Chaperone-mediated','—']]}],
 memo:['Eat me: phosphatidylserine / Find me: lysophosphatidylcholine, sphingosine 1-phosphate.','Anti-apoptotic: Bcl-2, Bcl-xL, Mcl-1 / Pro-apoptotic: Bax, Bak / BH3-only: Bad, Bim, Bid, Puma, Noxa.','Gasdermin D pore = pyroptosis. MLKL pore = necroptosis.'],
 cmp:[['Necroptosis vs Apoptosis','둘 다 death receptor로 개시 가능. necroptosis는 caspase-8이 활성화되지 않고 괴사 양상·염증'],['Pyroptosis vs Necroptosis','pyroptosis: inflammasome–caspase-1–gasdermin D / necroptosis: RIP1·RIP3–MLKL']],
 q:['23-2025-M-MC-08','23-2025-M-MC-09','23-2025-M-MC-10','N2-11','N2-12','N2-13']},
{id:'n2g',ch:2,t:'세포 내 축적 · 병적 석회화 · 세포 노화',src:'Ch2 p.51–60',
 tbls:[{cap:'세포 내 축적',h:['물질','핵심'],r:[
  ['지방 (lipids)','지방증(steatosis): 비정상적 중성지방 축적, 흔히 간. 콜레스테롤침착증(cholesterolosis): 담낭 콜레스테롤 함유 대식세포 축적(딸기 담낭)'],
  ['단백질','세포질 내 둥근 호산성 과립·액포. 신세뇨관에서 분홍색 유리질 방울'],
  ['글리코겐','글리코겐 대사 이상 시 과도 축적, 투명한 액포로 관찰'],
  ['색소','외인성: 탄소(대기오염) / 내인성: lipofuscin(지질과산화 분해산물), hemosiderin(철), 멜라닌']]},
  {cap:'병적 석회화',h:['구분','혈중 칼슘','부위'],r:[
  ['이영양성 (dystrophic)','정상','응고·건락·액화·지방괴사 등 괴사 부위'],
  ['전이성 (metastatic)','고칼슘혈증 (대개 PTH 과다분비)','정상 조직']]}],
 sum:['텔로미어: 염색체 말단의 짧은 반복서열. 단백질로 번역되지 않지만 노화·암과 관련.','텔로머라아제: 자신의 RNA를 주형으로 쓰는 RNA-단백질 복합체. 생식세포에서 활성 높고 줄기세포는 낮으며 체세포에서는 검출되지 않아 분열이 반복될수록 텔로미어가 짧아짐. 대부분의 암세포에서 재활성화.','세포 노화 3기전: ① DNA 손상 ② 세포성 노화(telomere 지속 감소 → 세포주기 정지) ③ 결함단백질의 항상성.'],
 q:['23-2025-M-MC-11','N2-14','N2-15','N2-16']},

{id:'n3a',ch:3,t:'염증 개요: 정의 · 5단계 · 5대 징후 · 원인',src:'Ch3 p.6–10',
 sum:['염증: 혈관이 있는 조직이 감염·손상에 반응해 방어 세포·분자를 순환계로 동원하는 방어 반응. 생존에 필수적이며 손상의 원인과 결과(괴사) 모두 제거한다.','염증반응 5단계: ① Recognition(인지) ② Recruitment(동원) ③ Removal(제거) ④ Regulation(규제) ⑤ Repair or Resolution(수복 또는 용해).','국소염증(특정 부위) vs 전신염증(pro-inflammatory cytokines이 혈액으로 퍼짐, 예: 패혈증의 SIRS).','급성염증(수 분~수 시간 내 발생, 호중구) vs 만성염증(오래 지속, 림프구·대식세포, 섬유화).','원인 4가지: 감염 · 조직괴사(허혈, 외상, 물리화학적 손상, 방사선) · 이물질(요산염, 콜레스테롤 결정 등 내인성 포함) · 면역반응(과민증: 자가면역, 알레르기).'],
 tbls:[{cap:'염증의 징후',h:['징후','기전'],r:[
  ['발적 (rubor)','혈관 확장 → 혈류 증가'],['부종 (tumor)','혈관 투과성 증가 → 조직으로 체액 이동'],['발열 (calor)','혈류 증가, 대사활성 증가'],['통증 (dolor)','PGE₂, bradykinin 등이 신경 말단 자극'],['기능상실 (functio laesa)','조직 손상 → 정상 기능 제한 (Virchow 추가, 19C)']]}],

{id:'n3b',ch:3,t:'급성염증의 혈관 반응',src:'Ch3 p.12–16 · Ch4 p.4–5',
 sum:['급성염증의 3대 구성요소: ① 혈관 직경의 변화(혈류 증가) ② 미세혈관의 구조적 변화(혈관 투과성 증가) ③ 백혈구의 이동과 활성화.','혈관 확장은 주로 혈관 평활근에 대한 히스타민의 작용 → 발열·발적(홍반).','투과성 증가 ①: 내피세포 수축(히스타민, 브라디키닌, 류코트리엔) — 노출 직후, 활동시간 15~30분으로 즉각/일시적. ②: 내피세포 손상(괴사·분리) — 손상 즉시 시작, 수 시간 지속(염증 시 내피세포에 부착한 호중구도 손상을 줄 수 있음).','림프관·림프절: 림프 흐름 증가, 림프관염(lymphangitis)·림프절염(lymphadenitis), 림프절 비대.'],

 q:['23-2025-M-MC-15','23-2025-M-MC-16','23-2025-M-MC-17','23-2025-M-MC-24','N3-05']},
{id:'n3c',ch:3,t:'백혈구 동원과 식작용',src:'Ch3 p.17–24',
 sum:['부착: 혈류 느려짐 → 백혈구가 내피세포 표면을 따라 모임(변연화, margination) → 구르기(rolling; selectin) → 단단한 부착(integrin).','이행(transmigration, diapedesis): PECAM-1(CD31) 관여.','화학주성(chemotaxis): chemokine(IL-8), 보체 성분(C5a), arachidonic acid metabolites, LTB4.','초기에는 호중구 우세(6~24시간) → 24~48시간에 단핵구·대식세포로 대체. 호중구는 혈액 내 가장 많고(50~70%) chemokine에 빨리 반응하며 P/E-selectin에 단단히 부착하고, 단기간 생존 후 세포자멸사.','포식작용 3단계: ① Recognition and attachment ② Engulfment(phagosome → phagolysosome) ③ Killing and degradation(ROS, NO, 리소좀 효소).','NETs: 호중구가 분비하는 핵염색체 그물성 구조물로 미생물을 포획.','대식세포: 성장인자(VEGF, PDGF, TGF-β, FGF) 생성 → 염증 후 조직 수복에 중요. 종료 신호: IL-10, TGF-β, resolvin/protectin, 콜린성 항염증 경로, 리폭신.'],
 memo:['rolling = selectin / 단단한 부착 = integrin.'],q:['23-2025-M-MC-18','N3-03','N3-04']},
{id:'n3d',ch:3,t:'염증 매개체',src:'Ch3 p.25–31',
 tbls:[{h:['매개체','출처·생성','주요 작용'],r:[
  ['Histamine','비만세포·호염기구·혈소판 과립 (탈과립)','소동맥 확장, 소정맥 투과성 증가. 염증 초기에 유리'],
  ['Serotonin','혈소판, 신경내분비세포','히스타민과 유사하나 염증에서의 중요성 불명확'],
  ['Prostaglandin','cyclooxygenase 경로 (Cox1 상시 / Cox2 염증자극 유도)','동통·발열, 혈관·전신 반응'],
  ['Leukotriene','lipoxygenase 경로 (백혈구, 비만세포)','화학주성, 혈관투과성 증가, 기관지 수축 → 염증 촉진'],
  ['Lipoxin','lipoxygenase 경로','호중구 화학주성·부착 방해 → 염증 억제'],
  ['Cytokine / Chemokine','활성화된 림프구·대식세포 등','TNF-α·IL-1: 백혈구 동원. chemokine: 화학유인, integrin 친화력 강화'],
  ['보체계','혈장 단백질 (C1~C9, 비활성형)','C3 cleavage가 핵심. 염증, C3b 옵소닌화·포식, MAC 세포 용해'],
  ['키닌계','kininogen → (kallikrein) → bradykinin','혈관 확장·투과성 증가·평활근 수축·통증. kininase로 빠르게 불활성화']]}],
 memo:['아라키돈산 대사물질은 에이코사노이드(eicosanoid)라고도 한다.','매개체는 작용기간이 짧고 다른 매개체 분비를 자극한다.'],q:['23-2025-M-MC-19','N3-05','N3-06','N3-07','N3-08']},
{id:'n3e',ch:3,t:'급성염증의 형태와 결과',src:'Ch3 p.33–35',
 tbls:[{cap:'형태',h:['형태','특징'],r:[
  ['장액성 (serous)','단백질이 적고 세포 성분이 거의 없는 맑은 액체가 고임'],['섬유소성 (fibrinous)','투과성이 심해 fibrinogen 삼출 → fibrin 그물망. 체강(수막·심막·흉막)에서 특징적'],['화농성 (purulent)','호중구, 괴사세포의 액화 찌꺼기, 부종액 = 고름. 농양(abscess)은 국소적 화농성염증의 결과'],['궤양 (ulcer)','염증성 괴사조직이 떨어져 나가 생긴 표면 결손. 구강·위·장·비뇨생식관 점막']]}],
 sum:['결과 4가지: ① 완전 용해(손상이 한정적·파괴 조직이 적고 실질세포 재생 가능) ② 농양 형성 ③ 결체조직 대체에 의한 치유(섬유화) ④ 만성염증으로 진행.'],q:['N3-09','N3-10']},
{id:'n3f',ch:3,t:'만성염증과 육아종',src:'Ch3 p.37–45',
 sum:['만성염증: 수 주~수개월 지속. 지속적 염증·조직손상·수복이 공존. 급성염증 후 또는 선행 증상 없이 서서히 진행.','원인: 지속적 감염(mycobacteria, virus, fungi, parasite) · 과민성 질환(자가면역, 알레르기) · 독성물질 지속 노출(실리카 → 규폐증, 콜레스테롤 → 죽상경화증).','형태: 단핵세포(대식세포·림프구·형질세포) 침윤 · 조직 파괴 · 수복(작은 혈관 생성, 섬유화).','림프구–대식세포 양방향 상호작용(대식세포 IL-12 → T세포 IFN-γ → 대식세포 활성화)이 만성염증을 유지.','호산구: IgE 매개 면역반응(알레르기)·기생충 감염, eotaxin. 비만세포: IgE Fc 수용체 발현, 급성·만성 모두 관여.'],
 tbls:[{cap:'대식세포 활성화 경로',h:['경로','자극','결과'],r:[
  ['고전적 → M1','세균 내독소(LPS), IFN-γ','ROS, NO, lysosomal enzyme ↑ → 포식. IL-1 분비 → 전염증성'],
  ['대안적 → M2','IFN-γ 제외 cytokines','growth factors, TGF-β → 조직 수복·섬유화. IL-10, TGF-β → 항염증']]},
  {cap:'육아종 (granulomatous inflammation)',h:['구분','이물형 육아종','면역 육아종'],r:[
  ['유발','외부물질(봉합사, 실리콘, 활석 등)','T세포 매개 면역반응을 유도하는 물질(분해·제거가 어려운 것)'],['T세포 면역반응','부재','대식세포 → T세포 활성화 → IL-2 → 다른 T세포 활성화로 반응 지속'],['세포','상피양세포·다핵 거대세포가 이물 표면에 몰림','T림프구·대식세포, 때때로 중심부 괴사']]}],
 memo:['육아종: 상피양세포(epithelioid cell) + 다핵 거대세포(multinucleated giant cell).'],q:['23-2025-M-MC-20','N3-11','N3-12']},
{id:'n3g',ch:3,t:'염증의 전신적 영향: 급성기반응',src:'Ch3 p.47',
 sum:['국소 염증이더라도 cytokine 유도 전신 반응을 급성기반응(acute-phase response)이라 하며 매개체는 TNF, IL-1, IL-6 등.','발열: 세균생성물 LPS → 백혈구 자극 → IL-1, TNF → 시상하부 PGE₂ 생성 자극.','급성기 단백질: 간에서 CRP, Fibrinogen, SAA 생성.','백혈구증가증(leukocytosis): 집락자극인자 ↑ → 골수 전구세포 증식.','패혈성 쇼크: IL-1·TNF 대량 생산 → 파종혈관내응고, 저혈압 쇼크, 인슐린 저항성, 고혈당.','맥박 및 혈압 증가.'],q:['23-2025-M-MC-22']},
{id:'n3h',ch:3,t:'조직 수복과 창상 치유',src:'Ch3 p.49–60',
 sum:['조직 수복: 재생(regeneration) 또는 결합조직 침착(흉터 형성, scar formation).','결합조직 침착 3단계: ① 혈관형성(angiogenesis; NO, VEGF) ② 육아조직 형성(섬유모세포·혈관·백혈구, 분홍색의 부드러운 과립형) ③ 결합조직 재형성(remodeling; MMPs, TIMPs).','창상 치유: 일차유합(손상이 상피층에 국한, 봉합된 외과적 절개창) vs 이차유합(큰 조직 손실, 육아조직 풍부, 큰 흉터, 창상 수축).','실질장기 섬유화: 간경화, 피부경화증, 진폐증, 폐섬유증.','수복의 이상: 부적절한 흉터(창상 벌어짐 dehiscence, 궤양) · 과도한 형성(비후흉터, 켈로이드) · 구축(contracture; 심한 화상 후 관절 운동 제한).','수복 영향 요인: 감염, 당뇨, 영양상태, 글루코코르티코이드, 기계적 요소, 관류 저하, 외래물질, 손상의 유형·범위·위치.'],
 tbls:[{cap:'조직의 증식능력',h:['분류','특징','예'],r:[
  ['불안정조직 (labile)','세포가 계속 소실되고 줄기세포 성숙·증식으로 대체. 재생능력 높음','피부, 구강, 위장관'],['안정조직 (stable)','G0, 최소 복제. 손상 시 필요하면 분열','간, 신장, 이자의 실질세포'],['영구조직 (permanent)','최종 분화, 증식 안 함. 재생능력 매우 제한적','신경세포, 심근세포']]}],
 q:['23-2025-M-MC-23','N3-13','N3-14']},
/* ================= 4장 ================= */
{id:'n4a',ch:4,t:'부종과 삼출',src:'Ch4 p.4–8',
 sum:['부종(edema): 혈관 → 사이질 공간으로 체액 이동 / 삼출(effusion): 혈관 → 체강(흉강·복강·심막강)으로 이동.','정상: 혈관 정수압(내보내려는 힘)과 콜로이드 삼투압(들어오게 하는 힘)이 균형. 이동량 > 림프 회수량이면 부종.','원인 4가지: ① 정수압 증가(정맥환류 장애: 국소 = 심부정맥혈전증, 전신 = 울혈성 심부전) ② 혈장 교질삼투압 감소(알부민 합성 감소: 간경화·단백질 섭취 부족 / 손실: 신증후군; 알도스테론과잉증으로 악화) ③ 나트륨·물 저류(신기능 저하) ④ 림프관 폐쇄(사상충증 → 코끼리피부병, 유방암 수술·방사선 후 상지부종).','형태: 피하부종·체위부종·함요부종(pitting)·안와주위부종(신기능장애)·폐부종(폐 무게 2~3배)·뇌부종(대뇌 고랑 좁아짐).'],
 memo:['삼출액 = 염증성(단백질 풍부) / 누출액 = 비염증성(단백질 부족).'],q:['23-2025-M-MC-24','N4-01']},
{id:'n4b',ch:4,t:'충혈과 울혈',src:'Ch4 p.10–11',
 tbls:[{h:['구분','충혈 (Hyperemia)','울혈 (Congestion)'],r:[
  ['기전','동맥 확장 → 혈류량 증가 (능동적)','정맥혈 환류 방해 (수동적)'],['외관','산소가 풍부해 붉음','—'],['예','염증으로 빨개진 눈, 운동 후 근육','심부전으로 인한 폐울혈, 심부정맥혈전증'],['결과','—','정수압 증가 → 부종. 만성수동울혈 → 만성 저산소 → 허혈성 손상']]}],
 sum:['만성 울혈: 모세혈관 파열 → 작은 출혈병소 → 유출 적혈구를 대식세포가 탐식 → 혈철소탐식대식세포(hemosiderin-laden macrophage) 침윤.','만성폐울혈: 중격 비후·섬유화, 허파꽈리에 혈철소 탐식 대식세포.','만성수동성간울혈: 간소엽 중심부 적갈색(세포 죽음으로 압박), 주변부는 담갈색 = 육두구간(nutmeg liver).'],q:['23-2025-M-MC-26','N4-02']},
{id:'n4c',ch:4,t:'지혈 · 혈소판 · 응고연쇄반응',src:'Ch4 p.13–21',
 sum:['지혈: 혈소판·응고인자·내피세포가 조화를 이루어 피덩이(blood clot)를 형성, 출혈을 막음. 이상: 출혈장애 vs 혈전성 장애.','지혈 4단계: ① 세동맥 혈관수축(endothelin) ② 일차 지혈: 혈소판 마개(vWF, collagen 노출 → 부착·활성화 → 응집) ③ 이차 지혈: 조직인자 + 응고인자 Ⅶ → thrombin → fibrinogen → fibrin 망 ④ 피덩이 안정화와 흡수(t-PA, thrombomodulin).','혈소판: 부착 = GpIb–vWF (결핍: von Willebrand disease, Bernard-Soulier). 활성화: 형태 변화, 과립 분비(thrombin, ADP; TxA₂ 생성). 응집 = GpⅡb/Ⅲa–fibrinogen (Glanzmann thrombasthenia).','응고연쇄반응: 효소·기질·보조인자가 활성화된 혈소판의 음전하 인지질 표면에서 조합되고 칼슘이온에 의해 결합. 검사: PT = 외인성 경로, PTT = 내인성 경로.','Thrombin의 역할: ① fibrinogen → fibrin 변환, Factor ⅩⅢ 활성화로 fibrin 교차연결 ② 혈소판 활성화(PARs) ③ 향염증 효과 ④ 정상 내피세포를 만나면 향응고성에서 항응고성으로 전환.','응고 제한: 희석, 음전하 인지질, 섬유소 분해(t-PA → plasminogen → plasmin; free plasmin + α₂-antiplasmin → 복합체로 혈전 크기 제한).','내피세포 항혈전 특성: 혈소판 억제(PGI₂, NO, adenosine diphosphatase), 항응고(조직인자 보호, thrombomodulin, 헤파린 등), 섬유소 용해(t-PA 합성).','출혈장애: 일차성(혈소판 결함: 점출혈·자색반) / 이차성(응고인자 결함: 근육·관절 출혈, 혈우병) / 작은 혈관 결함(자색반, 반상출혈).'],
 memo:['응고 3요소: 효소(활성 응고인자) · 기질(전구 효소체) · 보조인자 — 결합 이온은 칼슘.'],q:['23-2025-M-MC-28','23-2025-M-MC-29','23-2025-M-MC-30','N4-03','N4-04','N4-05','N4-06']},
{id:'n4d',ch:4,t:'혈전증',src:'Ch4 p.23–25',
 sum:['비르효 3대 징후(Virchow\'s triad): ① 내피세포 손상(독소, 고혈압, 염증, 대사성장애 → 동맥·심장 혈전) ② 혈류의 정체(stasis: 정맥혈전의 주요 원인)나 와류(turbulence: 동맥·심장혈전) ③ 혈액의 과다응고.','형태: 잔선(lines of Zahn)의 층판상. 벽혈전(mural). 동맥혈전은 혈류 반대 방향, 정맥혈전은 혈류 방향으로 성장하며 적혈구가 많아 적색혈전.','혈전의 운명 4가지: ① 증식 ② 색전형성 ③ 용해 ④ 기질화와 재관통.'],q:['23-2025-M-MC-31','N4-07']},
{id:'n4e',ch:4,t:'색전증',src:'Ch4 p.27–29',
 tbls:[{h:['종류','핵심'],r:[
  ['폐색전증','심부정맥혈전증에서 95% 이상. 60~80%는 작아 증상 없음. 폐순환 폐쇄 → 우측 심장부전·폐출혈·폐경색·급사'],

var ABBR={'ATP':['adenosine triphosphate · 교안 외 풀이',0],'ROS':['reactive oxygen species(활성산소종) · 교안 병기',1],'DISC':['Death-inducing signaling complex · 교안 병기',1],'MOMP':['미토콘드리아 외막 투과성 증가 · 교안 병기',1],'NETs':['Neutrophil Extracellular Traps(호중구 세포외덫) · 교안 병기',1],'PAF':['Platelet-Activating Factor(혈소판 활성인자) · 교안 병기',1],'CRP':['C-반응성단백질 · 교안 병기',1],'SAA':['Serum Amyloid A · 교안 병기',1],'vWF':['von Willebrand Factor · 교안 병기',1],'PT':['Prothrombin time · 교안 병기',1],'PTT':['partial thromboplastin time · 교안 병기',1],'t-PA':['tissue plasminogen activator · 교안 병기',1],'MMPs':['Metalloproteinases · 교안 병기',1],'TIMPs':['Tissue inhibitors of metalloproteinases · 교안 병기',1],'LPS':['세균 내독소 · 교안 병기(e.g., LPS)',1],'MLKL':['necrosome 구성 단백질 · 교안 병기',1],'DAMPs':['Damage-associated molecular patterns · 교안 병기',1],'VEGF':['혈관내피세포 성장인자 · 교안 병기',1],'MAC':['막공격복합체 · 교안 표기만(풀이는 교안 외)',0],'PECAM-1':['CD31 · 교안 병기',1],'TxA<sub>2</sub>':['트롬복산 A2 · 교안 병기',1]};
function abbrify(html,seen){
  seen=seen||{};
  return String(html).split(/(<[^>]+>)/).map(function(p){
    if(p.charAt(0)==='<')return p;
    return p.replace(/(^|[^A-Za-z0-9-])(ATP|ROS|DISC|MOMP|NETs|PAF|CRP|SAA|vWF|PTT|PT|t-PA|MMPs|TIMPs|LPS|MLKL|DAMPs|VEGF|MAC|PECAM-1)(?![A-Za-z0-9-])/g,function(m,a,k){
      if(seen[k])return m;seen[k]=1;var d=ABBR[k];
      return a+'<abbr title="'+d[0]+(d[1]?'':' (교안 외 풀이)')+'">'+k+'</abbr>';});
  }).join('');
}

function refreshMarks(){

function toggleMark(id,i){
  var m=(MARK[id]||[]).slice(),k=m.indexOf(i);
  if(k>=0)m.splice(k,1);else m.push(i);
  m.sort();if(m.length)MARK[id]=m;else delete MARK[id];
  lsSet('pat26-mark',MARK);refreshMarks();

function same(a,b){return a.length===b.length&&a.every(function(x,i){return x===b[i]})}
function grade(){
  var l=omrList(),s1=0,n1=0,s2=0,n2=0;S.graded={};
  l.forEach(function(q){
    var e=eff(q);if(!e.ans)return;
    var mk=(MARK[q.id]||[]).slice().sort(),ok=same(mk,e.ans);
    S.graded[q.id]=mk.length?ok:null;
    n2++;if(ok)s2++;
    if(STAT_STRONG[e.st]){n1++;if(ok)s1++}
  });
  var sk=l.filter(function(q){return !eff(q).ans}).length;
  $('#score').className='score on';
  $('#score').innerHTML='<div>기준 점수(확정·교차확인): <b>'+(n1?s1+' / '+n1:'채점 대상 없음')+'</b></div>'+
    '<div>추정 포함 보조: <b>'+s2+' / '+n2+'</b></div>'+
    '<div class="note">정답 미정(추론·충돌·미확정) '+sk+'건 제외'+(n1?'':' · 확정·교차확인 문항이 아직 없습니다. 아래 정답 지정으로 사용자 확정을 만들 수 있습니다.')+'</div>';

/* ---------- 모의고사 ---------- */
function pool(){
  return QS.filter(function(q){
    if(q.oos)return false;
    if(!q.opts||q.opts.length<3)return false;
    if(!eff(q).ans)return false;
    if(q.set==='new'&&!S.mockNew)return false;
    return true;
  });
}
function rng(seed){var s=seed>>>0;return function(){s=(s*1664525+1013904223)>>>0;return s/4294967296}}
function draw(){
  var p=pool(),r=rng(S.mockSeed*7919+13);
  var ws={};PAST.forEach(function(q){if(!q.oos&&q.opts&&q.opts.length)ws[q.ch]=(ws[q.ch]||0)+1});
  var tot=0;Object.keys(ws).forEach(function(k){tot+=ws[k]});
  var n=Math.min(S.mockN,p.length),pick=[];
  var by={};p.forEach(function(q){(by[q.ch]=by[q.ch]||[]).push(q)});
  Object.keys(by).forEach(function(k){by[k].sort(function(){return r()-.5})});
  var left=n;
  Object.keys(ws).forEach(function(k,ix,arr){
    var c=ix===arr.length-1?left:Math.round(n*ws[k]/tot);c=Math.min(c,(by[k]||[]).length,left);
    pick=pick.concat((by[k]||[]).slice(0,c));left-=c;
  });
  if(left>0){var rest=p.filter(function(q){return pick.indexOf(q)<0}).sort(function(){return r()-.5});pick=pick.concat(rest.slice(0,left));}
  pick.sort(function(a,b){return a.ch-b.ch||(a.set===b.set?0:a.set==='past'?-1:1)});
  S.mockIds=pick.map(function(q){return q.id});
  pick.forEach(function(q,i){q.mn=i+1});
}
function mockHtml(){
  if(!S.mockIds.length)draw();
  var l=S.mockIds.map(function(i){return BYID[i]});
  var h='<div class="bar"><span class="chip a">'+dday()+'</span><span class="chip w">시험 시간 14:00–16:00(120분)은 사용자 전달 · 공지 원문 미확인</span><span class="timer" id="timer">'+timerText()+'</span>'+
    '<button class="btn s" id="m-start">'+(S.mockStart?'타이머 초기화':'시작')+'</button></div>';
  h+='<div class="bar"><label class="tg">문항 수 <select id="m-n">'+[20,30,40].map(function(n){return '<option value="'+n+'"'+(S.mockN===n?' selected':'')+'>'+n+'</option>'}).join('')+'</select></label>'+
    '<label class="tg"><input type="checkbox" id="m-new"'+(S.mockNew?' checked':'')+'> 예상 문제 포함</label><button class="btn s" id="m-draw">새로 뽑기</button>'+
    '<span class="grow"></span><label class="tg"><input type="checkbox" id="t-exam"'+(S.exam?' checked':'')+'> 시험지형</label></div>';
  h+='<p class="note hide-exam">출제 풀: 범위 내 · 정답이 있는 문항(추론·미확정 제외) '+pool().length+'건. 단원 비중은 기출 문항 수에 비례한다는 가정입니다(실제 비중 미공지). 같은 문항은 한 시험에 두 번 나오지 않습니다. 점수는 채점하기에서 두 가지로 표시됩니다.</p>';
  l.forEach(function(q){var c=Object.assign({},q);c.n=String(q.mn)+'번';h+=card(Object.assign(c,{id:q.id,set:q.set}),true)});
  return h;
}
function timerText(){
  if(!S.mockStart)return '120:00';
  var rem=EXAM_MIN*60-Math.floor((Date.now()-S.mockStart)/1000),over=rem<0,a=Math.abs(rem);
  var mm=Math.floor(a/60),ss=a%60;
  return (over?'초과 +':'남은 ')+(mm<10?'0':'')+mm+':'+(ss<10?'0':'')+ss;
}
function tick(){var t=$('#timer');if(t){t.textContent=timerText();t.className='timer'+((EXAM_MIN*60-Math.floor((Date.now()-S.mockStart)/1000))<0&&S.mockStart?' over':'')}}

/* ---------- 현황·범위 ---------- */
function cnt(f){return QS.filter(f).length}

      by={};QS.forEach(function(q){by[q.st]=(by[q.st]||0)+1});

    '<dt>대상</dt><dd>단국대 치의학과 · 2026-2 · 중간고사 · 치과병리학 · 신지애 교수 · 24학번(사용자 명시)</dd>'+
    '<dt>범위</dt><dd>2·3·4장만 (사용자 확정 2026-10-21). 면역계통(6장)은 \'범위 외\'로 숨김 처리</dd>'+
    '<dt>형식</dt><dd>객관식만 (사용자 확정). 오규영 교수 시기(21·22학번) 자료·형식 전부 제외</dd>'+
    '<dt>일정</dt><dd>2026-10-26(월) 14:00–16:00 본4 (과대표 공지 10/13 전달, 공지 원문 미확인). Notion 학사 업무 계획은 \'미확정\', 일정 정리 페이지는 \'미정 유지\'로 불일치 → 사용자 지시로 학사 업무 계획 표를 갱신함</dd>'+
    '<dt>문항 수</dt><dd>기출(범위 내) 고유 '+inP.length+'건(중복 0묶음 포함 총 '+inP.length+'건) · 범위 외 '+(PAST.length-inP.length)+'건 · 예상 '+NEWQ.length+'건</dd>'+
    '<dt>상태 분포</dt><dd>'+Object.keys(by).map(function(k){return esc(k)+' '+by[k]}).join(' · ')+'</dd>'+
    '</dl><pre class="code">'+esc(JSON.stringify(SCOPE,null,1))+'</pre></section>';
  h+='<section class="sec"><h2>가정</h2><ul>'+ASSUME.map(function(a){return '<li>'+fmt(a)+'</li>'}).join('')+'</ul></section>';
  h+='<section class="sec"><h2>자료 현황표</h2><div class="tw"><table class="t"><thead><tr><th>학년도</th><th>위치(폴더 id)</th><th>내용</th><th>활용</th></tr></thead><tbody>'+
    MATS.map(function(r){return '<tr><td>'+esc(r[0])+'</td><td>'+esc(r[1])+'</td><td>'+esc(r[2])+'</td><td>'+esc(r[3])+'</td></tr>'}).join('')+'</tbody></table></div></section>';
  h+='<section class="sec"><h2>학번 × 자료원 반영 현황</h2><div class="tw"><table class="t"><thead><tr><th>학번(시기)</th><th>원본 시험지</th><th>원본 야마</th><th>가공본</th><th>비고</th></tr></thead><tbody>'+
    MATRIX.map(function(r){return '<tr>'+r.map(function(x){return '<td>'+esc(x)+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table></div></section>';
  h+='<section class="sec"><h2>인용 그림 색인</h2><p>그림 번호(Qn) 부여 0건. 이번 기출 원본(23학번 PDF·docx)은 텍스트 추출본만 열람했고 문항 그림은 확인하지 못했습니다. 그림 있음/텍스트 캡처 분류: 미수행(이미지 미열람). 교안 그림은 내장하지 않았습니다.</p></section>';
  h+='<section class="sec"><h2>외부 참조(\'표 N-N 참조\' 류)</h2><p>2·3·4장 교안 텍스트에서 \'그림 4-18\', \'4-18B\', \'4-19\'(경색) 참조가 있으나 교재 그림이며 교재는 열람하지 않았습니다. 해당 서술은 교안 요약 문장으로만 반영했습니다.</p></section>';
  h+='<section class="sec"><h2>알려진 한계 목록</h2><pre class="code">'+esc(LIMITS)+'</pre><button class="btn s" id="b-copylim">복사</button></section>';
  h+='<section class="sec"><h2>사용자 정답 지정 내보내기</h2><p class="note">정답 지정(사용자 확정) 내용을 JSON으로 복사해 대화에 붙여 넣으면 정해 대장에 반영합니다. OMR 마킹은 담지 않습니다.</p><button class="btn p s" id="b-export">클립보드로 복사</button><textarea id="exp-box" rows="5" style="width:100%;margin-top:6px;display:none" readonly></textarea>'+(lsOK?'':'<p class="note">이 환경에서는 브라우저 저장소를 쓸 수 없어 새로고침하면 마킹이 사라집니다.</p>')+'</section>';

function copyText(t,box){
  function fb(){var b=$(box);b.style.display='block';b.value=t;b.select();toast('복사하지 못해 아래 상자에 표시했습니다')}
  try{navigator.clipboard.writeText(t).then(function(){toast('복사했습니다')},fb)}catch(e){fb()}
}

/* ---------- 이벤트 ---------- */
function go(tab,keepCh){
  S.tab=tab;if(!keepCh)S.ch='all';
  S.graded={};$('#score').className='score';
  if(tab==='mock'&&!S.mockIds.length)draw();
  try{history.replaceState(null,'','#'+tab)}catch(e){}
  renderTabs();renderOMR();renderMain();window.scrollTo(0,0);
}
function scrollTo(id){var e=document.getElementById(id);if(e)e.scrollIntoView({block:'start'})}
document.addEventListener('click',function(ev){
  var t=ev.target.closest('button,summary');if(!t)return;
  var d=t.dataset||{};
  if(d.tab)return go(d.tab);
  if(d.ch){S.ch=d.ch;renderOMR();return renderMain()}
  if(d.q&&d.i&&t.classList.contains('bub'))return toggleMark(d.q,+d.i);
  if(d.q&&d.i&&t.classList.contains('opt'))return toggleMark(d.q,+d.i);
  if(d.show){SHOWN[d.show]=!SHOWN[d.show];var a=document.getElementById('q-'+d.show);var q=BYID[d.show];
    var c=document.createElement('div');c.innerHTML=card(q.mn?Object.assign({},q,{n:q.mn+'번'}):q,true);a.replaceWith(c.firstChild);refreshMarks();return}
  if(d.note){go('notes');setTimeout(function(){scrollTo('n-'+d.note)},30);return}
  if(d.goq){var q2=BYID[d.goq];S.tab=q2.set;S.ch=String(q2.ch);if(q2.oos)S.oos=true;go(q2.set,true);setTimeout(function(){scrollTo('q-'+d.goq)},30);return}
  if(d.scroll)return scrollTo(d.scroll);
  if(d.more){S.openNotes=true;return renderMain(true)}
  if(d.usave){var id=d.usave,chk=$$('input[data-uq="'+id+'"]:checked').map(function(x){return +x.value});
    if(chk.length){USER[id]={a:chk,r:($('#ur-'+id)||{}).value||''};lsSet('pat26-user',USER);toast('사용자 확정으로 저장했습니다');renderMain(true)}else toast('정답 번호를 하나 이상 고르세요');return}
  if(d.ureset){delete USER[d.ureset];lsSet('pat26-user',USER);toast('사용자 확정을 해제했습니다');return renderMain(true)}
  switch(t.id){
    case 'b-grade':return grade();
    case 'b-clear':
      omrList().forEach(function(q){delete MARK[q.id]});lsSet('pat26-mark',MARK);S.graded={};$('#score').className='score';renderOMR();return renderMain(true);
    case 'b-fold':S.openNotes=!S.openNotes;return renderMain(true);
    case 'm-draw':S.mockSeed++;draw();S.graded={};return renderOMR(),renderMain();
    case 'm-start':
      if(S.mockStart){S.mockStart=0;clearInterval(timerH)}else{S.mockStart=Date.now();timerH=setInterval(tick,1000)}
      return renderMain(true);
    case 'b-export':
      var arr=Object.keys(USER).map(function(id){return {id:id,alias:(BYID[id]||{}).alias||'',answer:USER[id].a,reason:USER[id].r||''}});
      return copyText(JSON.stringify({exported_at:new Date().toISOString().slice(0,10),user_answers:arr},null,1),'#exp-box');
    case 'b-copylim':return copyText(LIMITS,'#exp-box');
  }
});
document.addEventListener('change',function(ev){
  var t=ev.target;
  if(t.id==='t-exam'){S.exam=t.checked;return renderMain(true)}
  if(t.id==='t-all'){S.showAll=t.checked;return renderMain(true)}
  if(t.id==='t-oos'){S.oos=t.checked;renderOMR();return renderMain(true)}
  if(t.id==='m-n'){S.mockN=+t.value;draw();S.graded={};renderOMR();return renderMain(true)}
  if(t.id==='m-new'){S.mockNew=t.checked;draw();S.graded={};renderOMR();return renderMain(true)}
});

/* ---------- 시작 ---------- */
(function init(){
  var h=(location.hash||'').replace('#','');
  if(TABS.some(function(t){return t[0]===h}))S.tab=h;
  renderChips();renderTabs();
  if(window.innerWidth<=860){var od=$('#omr-d');if(od)od.removeAttribute('open')}
  if(S.tab==='mock')draw();
  renderOMR();renderMain();
})();
})();
