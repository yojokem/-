 secs:[
  {h:'① ATP 고갈',p:'p.26',b:['ATP 생산: 해당과정(세포질, 산소 불필요·소량) · TCA 회로(기질) · <b>산화적 인산화(미토콘드리아 내막, 대부분, 산소 필요)</b>.','고갈의 주 원인: 산소·영양분 고갈, 미토콘드리아 손상, 독소.']},
  {h:'② 미토콘드리아 손상',p:'p.28',b:['<b>미토콘드리아 투과성 전이공</b>(mitochondrial permeability transition pore) 개방 → 막 전위 소실·산화적 인산화 상실 → ATP 생성 ↓ → 괴사.','비정상 산화적 인산화로 <b>ROS 생성</b>.','외막-내막 사이 <b>cytochrome c</b>가 세포질로 유출 → apoptosis.']},
  {h:'③ 칼슘 유입',p:'p.29',b:['칼슘은 세포손상의 중요한 매개체. 정상 세포질 농도는 매우 낮게 유지.','미토콘드리아 내 축적 → pore 개방 → ATP 고갈.','세포질 축적 → <b>phospholipase, protease, endonuclease</b> 활성화.']},
  {h:'④ 산화 스트레스 (ROS)',p:'p.30',b:['<b>자유라디칼</b>: 최외각 궤도에 홑전자 하나를 가진 화학물(반응성 큼). <b>ROS</b>는 산소 유래 자유라디칼.','정상: 미토콘드리아 호흡·에너지 생성 중 낮은 농도로 생성되어 방어체계가 제거.','증가 → 산화적 스트레스 → 지질·단백질·DNA 손상. (화학적·방사선 손상, 허혈-재관류, 세포노화 등)']},
  {h:'⑤ 막 투과성 증가',p:'p.31',b:['<b>미토콘드리아막</b>: pore 개방 → ATP ↓ · cytochrome c 방출.','<b>원형질막</b>: 삼투압 균형 파괴 → 체액·이온 유입, 세포 내용물 소실, ATP 재구성 대사체 유출.','<b>리소좀막</b>: 리소좀 효소 유출·활성화 → 세포괴사. 전형적으로 괴사 초래.']},
  {h:'⑥ DNA·단백질 손상',p:'p.32',b:['세포에는 DNA 복구 기전이 있다.','손상이 너무 크면 복구 실패 → <b>자살프로그램(apoptosis)</b> 작동. 잘못 접힌 단백질 축적도 apoptosis 유발.']}],
 pts:['ATP 감소: 리보솜 분리 ○, 혐기성 해당 ↑ ○, Na-K 펌프 ↓ ○ / <b>젖산은 증가 → pH 감소</b>(젖산 감소·pH 증가는 오답).','칼슘 증가의 효과는 <b>효소 3종 + pore 개방(ATP 고갈)</b>. ROS는 별도 기전.'],
 memo:['미토콘드리아 pore 개방 결과: 막 전위 소실 · 산화적 인산화 상실 · ATP ↓ · ROS 생성 ↑ · cytochrome c 유출.'],
 q:['23-2025-M-MC-06','23-2025-M-MC-07','N2-08','N2-09','N2-10']},
{id:'n2f',ch:2,t:'세포자멸사 (Apoptosis)',src:'Ch2 p.34–40',
 lead:'Type 1 cell death. 사멸이 예정된 세포가 자신의 효소를 활성화해 DNA·핵·세포질 단백질 분해를 정교하게 조절하는 자살프로그램. 조직에서 불필요한 세포 제거와 세포 집단 유지를 위한 정상 현상.',
 kw:['Type 1','caspase','외인성 경로','내인성 경로','Bcl-2 family','phosphatidylserine'],
 flow:[{t:'외인성(사멸수용체) 경로',s:['TNFR1·Fas에 ligand 결합','DISC 형성','procaspase-8 self-cleavage → caspase-8','effector caspase(3, 6, 7) 활성화','세포자멸사']},
       {t:'내인성(미토콘드리아) 경로',s:['세포 내부 스트레스 신호','Bcl-2 family → MOMP(외막 투과성 ↑)','cytochrome c 방출','Apaf-1 결합 → apoptosome','procaspase-9 → caspase-9','effector caspase 활성화']}],
 secs:[
  {h:'형태학적 변화',p:'p.35',b:['<b>세포수축</b>(크기 작아지고 세포질 조밀).','<b>염색질 응축</b>, 핵이 둘 이상의 단편으로 분절.','<b>세포질 수포</b>(membrane blebbing) 형성.','<b>세포자멸소체(apoptotic body)</b>: 막에 둘러싸인 조각으로 분절.']},
  {h:'Caspase',p:'p.37',b:['cysteine-aspartic protease. 비활성 proenzyme(zymogen) → 효소 절단으로 활성화.','<b>initiator: caspase-8, 9 / effector: caspase-3, 6, 7</b>.','두 경로는 유도·조절이 다르지만 모두 caspase 활성화로 귀결.']},
  {h:'외인성 경로',p:'p.38',b:['세포 원형질막 위 <b>사멸수용체</b>가 관여. 대표: <b>TNFR1, Fas</b>.','ligand/receptor 결합 → DISC(Death-inducing signaling complex).']},
  {h:'내인성 경로',p:'p.39',b:['Bcl-2 family로 조절: <b>Anti</b> Bcl-2, Bcl-xL, Mcl-1 / <b>Pro</b> Bax, Bak / <b>BH3-only</b> Bad, Bim, Bid, Puma, Noxa.','미토콘드리아 외막 투과성 증가와 내막공간 cytochrome c의 세포질 방출로 초래.']},
  {h:'사멸 세포 제거',p:'p.40',b:['건강한 세포는 phosphatidylserine이 막 안쪽. apoptosis 시 <b>바깥으로 뒤집혀</b> 식세포 수용체가 인식.','<b>“Find me”</b>: lysophosphatidylcholine, sphingosine 1-phosphate / <b>“Eat me”</b>: phosphatidylserine.','포식이 매우 효과적 → 흔적 없이 수 분 내 사라지고 대규모에서도 염증을 유발하지 않음.']}],
 pts:['<b>apoptosis의 intrinsic pathway가 아닌 것</b> = Fas(extrinsic). Bcl-2, cytochrome c, mitochondria, caspase-9는 intrinsic.','<b>Eat me = phosphatidylserine</b>. Find me와 혼동 금지.','Bcl-2 family: Bcl-2·Bcl-xL·Mcl-1은 anti, <b>Bax·Bak이 pro</b>. Apaf-1은 family가 아님.'],
 cmp:[['Initiator vs Effector','Initiator: caspase-8(외인성), caspase-9(내인성) / Effector: caspase-3, 6, 7'],['Find me vs Eat me','Find me: lysophosphatidylcholine, S1P / Eat me: phosphatidylserine']],
 q:['23-2025-M-MC-08','N2-11','N2-12']},
{id:'n2f2',ch:2,t:'Necroptosis · Pyroptosis · Autophagy',src:'Ch2 p.41–49',
 lead:'세포자멸사 외의 세포 사멸/분해 방식. 핵심 분자로 구분한다.',
 kw:['necrosome','MLKL','inflammasome','caspase-1','gasdermin D','autophagosome'],
 flow:[{t:'Necroptosis (세포자멸괴사)',s:['TNF가 TNFR1에 결합','caspase-8·RIP1·RIP3 동원(caspase-8은 활성화 안 됨)','RIP1·RIP3·MLKL = necrosome','MLKL 인산화·oligomerization','MLKL oligomer가 막으로 이동 → pore → 막 파열','DAMPs 방출 → 염증']},
       {t:'Pyroptosis',s:['미생물 노출','세포질 선천면역 수용체 인식','inflammasome 활성화','caspase-1 활성화','gasdermin D pore + IL-1β 활성형 방출']},
       {t:'Autophagy 과정',s:['autophagy 유발 환경','phagophore(자가소화포) 형성','elongation(소포 확장)','autophagosome 성숙','lysosome 융합 → autolysosome','degradation']}],
 secs:[
  {h:'Necroptosis',p:'p.41–43',b:['necrosis의 <b>형태</b>(ATP 상실, 종창, ROS, 리소좀 효소, 원형질막 파열) + apoptosis의 <b>기전</b>(프로그램된 신호전달).','death receptor(TNF/TNFR1, FasL/Fas)로 개시 — extrinsic apoptosis와 유사.','<b>caspase-8이 활성화되지 않음</b>(카스파제 비의존성)이 apoptosis와 다른 점.','DAMPs 단백질 방출 → 염증.']},
  {h:'Pyroptosis',p:'p.44–45',b:['미생물에 감염된 세포에서 발생. cell swelling, 막 파열, DNA damage, proinflammatory cytokines 방출.','PRR(PAMPs/DAMPs 인식) → inflammasome(PRR·adaptor·caspase-1) → <b>caspase-1</b>이 gasdermin D를 절단 → N-말단 fragment가 막 pore 형성.','caspase-1이 IL-1β·IL-18도 활성화.']},
  {h:'Autophagy (Type 2 cell death)',p:'p.47–49',b:['세포가 자기 자신의 내용물(cargo)을 먹는 과정(auto “self” + phagy “eating”).','생존에 필수적인 대사물질 재활용, 세포 파편 청소(심각한 영양결핍, 소기관 turnover, 노화, 스트레스).','스트레스가 감당 불가이면 <b>세포사를 야기</b>.','분류: <b>Macro</b>(주된 유형, double-membrane autophagosome) · Micro(리소좀막 함입) · Chaperone-mediated(샤페론이 리소좀막 직접 관통 수송).']}],
 pts:['<b>Gasdermin D pore = pyroptosis</b>. Necroptosis의 pore는 MLKL.','Necroptosis: ligand→death receptor ○, RIP1·RIP3 necrosome ○, caspase-8 비활성 ○, 종창 ○ / Gasdermin D ✕.','Autophagy는 세포사와 무관하지 않다(Type 2 cell death, 스트레스가 과하면 세포사).'],
 cmp:[['Necroptosis vs Pyroptosis','necroptosis: RIP1·RIP3–MLKL, caspase-8 비활성 / pyroptosis: inflammasome–caspase-1–gasdermin D'],['Apoptosis vs Necroptosis','둘 다 death receptor로 개시 가능. necroptosis는 괴사 양상 + 염증(DAMPs)']],
 q:['23-2025-M-MC-09','23-2025-M-MC-10','N2-13']},
{id:'n2g',ch:2,t:'세포 내 축적 · 병적 석회화 · 세포 노화',src:'Ch2 p.51–60',
 lead:'비정상 물질의 축적, 칼슘 침착, 텔로미어와 노화의 기전.',
 kw:['지방증','색소','이영양성','전이성','텔로머라아제','노화 3기전'],
 secs:[
  {h:'지방',p:'p.51',b:['<b>지방증(steatosis)</b>: 세포 안 비정상적 중성지방 축적. 흔히 간(심장·근육·신장도). 원인: 독소, 단백질 영양실조, 당뇨병, 비만, 무산소증.','<b>콜레스테롤침착증(cholesterolosis)</b>: 담낭에 콜레스테롤 함유 대식세포 국소 축적(딸기 담낭).']},
  {h:'단백질 · 글리코겐',p:'p.52–53',b:['단백질: 세포질 내 둥근 호산성 과립·액포·응집체. 사구체 여과로 단백질이 새는 질환에서 신세뇨관 세포질에 분홍색 유리질 방울.','글리코겐: 대사 이상 시 과도 축적, 세포질에서 투명한 액포(글리코겐 축적병).']},
  {h:'색소',p:'p.53',b:['외인성: <b>탄소</b>(대기오염원).','내인성: <b>lipofuscin</b>(지방갈색소; 지질과산화 분해산물) · <b>hemosiderin</b>(철) · 멜라닌(세포의 정상 성분).']},
  {h:'병적 석회화',p:'p.55',b:['<b>이영양성(dystrophic)</b>: 혈중 칼슘 정상, 응고·건락·액화·지방괴사 등 괴사 부위에 칼슘 축적.','<b>전이성(metastatic)</b>: 고칼슘혈증(대개 PTH 과다분비)에 의한 정상 조직의 칼슘 축적.']},
  {h:'텔로미어 · 텔로머라아제',p:'p.57–58',b:['<b>텔로미어</b>: 염색체 말단의 짧은 반복서열. 말단 복제를 완성하고 융합·분해로부터 보호. 단백질로 번역되지 않지만 노화와 암에 중요.','<b>텔로머라아제</b>: 자신의 RNA를 주형으로 쓰는 RNA-단백질 복합체. 생식세포 활성 높음, 줄기세포 낮음, 체세포 미검출 → 분열이 반복될수록 텔로미어가 짧아짐. <b>대부분의 암세포에서 재활성화</b>.']},
  {h:'세포 노화의 기전 3가지',p:'p.60',b:['<b>① DNA 손상</b>: 외인성 인자 노출 → 손상 축적 → 유전적 이상.','<b>② 세포성 노화현상</b>: telomere의 지속적 감소 → 세포주기 정지.','<b>③ 결함단백질의 항상성</b>: 옳게 접힌 상태 유지·잘못 접힌 단백질 제거 기전이 깨짐.']}],
 tbls:[{cap:'병적 석회화 비교',h:['구분','혈중 칼슘','침착 부위','원인'],r:[['이영양성','정상','괴사 부위(응고·건락·액화·지방괴사)','조직 손상'],['전이성','고칼슘혈증','정상 조직','PTH 과다분비 등']]},
  {cap:'색소 비교',h:['색소','구분','본체'],r:[['탄소','외인성','대기오염원'],['lipofuscin','내인성','지질과산화 분해산물'],['hemosiderin','내인성','철'],['멜라닌','내인성(정상 성분)','—']]}],
 pts:['노화 기전 3가지에 \'미토콘드리아 항진\'은 없다.','hemosiderin = 철(적혈구 파괴 관련) / 탄소 = 외인성.'],

{id:'n3a',ch:3,t:'염증 개요: 정의 · 5단계 · 5대 징후 · 원인',src:'Ch3 p.6–10',
 lead:'염증은 해로운 반응이 아니라 생존에 필수적인 방어 반응. 손상의 원인과 결과(괴사) 모두를 제거한다.',
 kw:['5R','5대 징후','급성 vs 만성','국소 vs 전신','원인 4가지'],
 flow:[{t:'염증반응 5단계',s:['Recognition(인지): 숙주세포(macrophage, dendritic cell, mast cell)가 원인물질 인식 → 매개물질 방출','Recruitment(동원): 백혈구·혈장단백질이 이동','Removal(제거): 협동해 원인물질 파괴·제거','Regulation(규제): 염증 억제·종결','Repair or Resolution(수복 또는 용해)']}],
 secs:[
  {h:'염증의 정의',p:'p.6',b:['혈관을 함유한 조직이 감염·손상에 반응해 방어 세포·분자를 순환계로 동원하는 방어 반응.','염증이 없으면: 감염원 인지 불가 → 상처 치유 불가 → 지속적으로 곪은 상처.']},
  {h:'염증의 구성·분류',p:'p.8',b:['구성요소: <b>혈관</b>(확장 → 투과성 증가) · <b>백혈구</b>(호중구·단핵구·림프구; 활성화 → 파괴).','국소염증 vs 전신염증(pro-inflammatory cytokines이 혈액으로 퍼짐 — 패혈증의 전신염증반응증후군).','급성(수 분~수 시간 발생, 몇 시간~며칠, 호중구) vs 만성(오래 지속, 조직 파괴 ↑, 림프구·대식세포, 섬유화).']},
  {h:'염증의 원인 4가지',p:'p.10',b:['<b>감염</b>: 박테리아·바이러스·진균·기생충, 미생물 독소.','<b>조직괴사</b>: 허혈, 외상, 물리화학적 손상, 방사선, 환경 화학물질.','<b>이물질</b>: 부목·먼지·봉합사, 요산염(통풍)·콜레스테롤 결정(죽상경화증)·지질 같은 내인성 물질.','<b>면역반응(과민증)</b>: 자가면역질환, 알레르기. 자극원이 제거될 수 없어 만성염증.']}],
 tbls:[{cap:'5대 징후',h:['징후','한자·영문','기전'],r:[

 secs:[
  {h:'부착과 이동',p:'p.17–18',b:['염증 초기 혈류가 느려져 백혈구가 내피세포층 표면을 따라 모임(<b>변연화</b>) → rolling → 일시 부착·떨어짐·재결합 → 한 부위에 단단히 부착.','<b>selectin = 초기 rolling</b>, <b>integrin = 결합(단단한 부착)</b>.','이행: PECAM-1(CD31) 면역글로불린 관여.','화학주성인자: chemokine(IL-8), 보체 성분(C5a), arachidonic acid metabolites, leukotriene B4.']},
  {h:'호중구가 먼저 나타나는 이유',p:'p.19',b:['초기 <b>호중구 우세(6~24시간)</b> → 24~48시간 단핵구·대식세포로 대체.','이유: 백혈구 중 혈액 내 가장 많음(50~70%) · chemokine에 빨리 반응 · P-selectin, E-selectin에 단단히 부착.','호중구는 단기간 생존 → 세포자멸사 → 조직 내 오래 생존하는 단핵구가 대체.']},
  {h:'식작용 · NETs',p:'p.20–22',b:['포식수용체: 만노스수용체, 스캐빈저수용체, 옵소닌수용체.','살해: ROS, NO(산화질소합성효소로 arginine에서 합성), 리소좀 효소.','<b>NETs</b>: 호중구가 분비하는 점성 있는 핵염색체 그물성 구조물 → 미생물 포획, 확산 방지.']},
  {h:'조직손상과 종료',p:'p.23–24',b:['백혈구의 효과기전은 가해자와 숙주를 구분하지 못해 정상 조직도 손상(결핵·일부 바이러스·자가면역·천식 등).','대식세포: 성장인자(VEGF, PDGF, TGF-β, FGF) 생성 → 염증 후 조직 수복에 매우 중요.','종료 신호: IL-10·TGF-β, resolvin·protectin, 콜린성 항염증 경로, 류코트리엔 → <b>리폭신</b> 전환.']}],
 pts:['<b>rolling에 필요한 것은 selectin</b>. chemokine이 rolling에 필요하다는 서술은 오답(chemokine은 integrin 친화력 강화·화학주성).','호중구의 조직 내 \'오래 생존\'은 오답(단핵구가 오래 생존).'],

 lead:'염증반응을 시작하고 조절하는 물질. 작용기간이 짧고 다른 매개체의 분비를 자극한다.',

 secs:[
  {h:'매개체의 일반 특성',p:'p.25',b:['세포 혹은 혈장단백질에서 유래. 작용기간이 짧음(파괴·불활성화·제거·억제).','다른 매개체 분비 자극(예: 보체 활성산물 → histamine → TNF, IL-1, chemokine).']},
  {h:'혈관활성아민',p:'p.26',b:['세포 내 전구체로 저장, <b>염증 초기에 유리</b>.','<b>Histamine</b>: 비만세포·호염기구·혈소판. 비만세포 과립 → 탈과립. <b>소동맥 확장, 소정맥 투과성 증가</b>.','Serotonin: 혈소판·신경내분비세포, histamine과 유사, 염증에서 중요성 불명확.']},
  {h:'아라키돈산 대사물질(에이코사노이드)',p:'p.27–28',b:['<b>Prostaglandin</b>: cyclooxygenase. Cox1은 항상 발현, <b>Cox2는 염증자극에 의해 유도</b>. 동통·발열.','<b>Leukotriene</b>: lipoxygenase. 화학주성, 혈관투과성 증가, 기관지 수축 → 염증 촉진.','<b>Lipoxin</b>: lipoxygenase. 호중구 화학주성·부착 방해 → <b>염증 억제</b>.']},
  {h:'Cytokine · Chemokine',p:'p.29',b:['Cytokine: 면역·염증 매개·조절. <b>TNF-α, IL-1</b>이 백혈구 동원의 핵심.','Chemokine: CXC(IL-8), CC(MCP-1). 화학유인 + 백혈구-integrin 친화력 강화.']},
  {h:'보체계',p:'p.30',b:['20개 이상 단백질(C1~C9), 혈장 내 비활성형 → 활성화 → 효소연쇄반응. 결정적 단계: <b>C3 cleavage</b>.','기능 3가지: 염증 · <b>옵소닌화·포식(C3b)</b> · 세포 용해(MAC).','개시: 항체 없이 LPS 등 / 항체에 C1 고정 / 만노스 결합 렉틴.']},
  {h:'키닌계 · 기타',p:'p.31',b:['kininogen → (<b>kallikrein</b>) → <b>bradykinin</b>: 혈관 확장·투과성 증가·평활근 수축·통증. kininase로 빠르게 불활성화(수명 짧음). 과도 축적 → 혈관부종.','기타: PAF, 혈액응고 산물(thrombin, fibrin), 신경펩타이드.']}],

  {h:'보충: 정의 문구',p:'p.18–23',b:['<b>지방괴사</b>: 지방이 파괴된 병소를 표현할 때 일반적으로 사용되는 의학용어(췌장의 지방분해효소가 췌장실질과 복강 내로 방출). 지방세포 내 중성지방 에스테르 분해 → 지방산이 칼슘과 결합해 육안상 백색 침착부위(비누화).','<b>응고괴사</b>: 괴사된 조직이 단단하게 느껴짐. 구조단백질뿐 아니라 효소도 변성되어 효소 소화가 지연됨.','<b>섬유소성괴사</b>: 대개 혈관과 연관된 면역반응에서 보이는 특수한 형태. 면역복합체 침착 + 혈관 밖으로 유출된 피브린 → 염색상 무정형의 밝은 분홍색(유사섬유소, fibrinoid). 주로 자가면역질환·혈관염.']}],
 n2e:[
  {h:'보충: 기전 세부',p:'p.25–31',b:['ATP 감소 → 등삼투압(isosmotic) 회복을 위한 물 유입 → 세포 종창 &amp; ER 확장.','미토콘드리아는 <b>모든 경로의 세포손상·세포사</b>에서 핵심 역할(\'의학계 이슈에 대한 최신지견\' 슬라이드 인용).','칼슘 증가에 의한 미토콘드리아 pore 개방은 ATP 고갈로 이어짐. 세포질 칼슘은 정상적으로 세포외 농도 대비 매우 낮게 유지.','막 손상 부위 중 가장 중요한 것: <b>미토콘드리아막 · 원형질막 · 리소좀막</b>. 원형질막 손상 시 ATP 재구성에 필수적인 대사체 유출 → 에너지 저장 고갈.']}],
 n2f:[
  {h:'보충: 용어 · 진단 소견',p:'p.34–37',b:['Apoptosis의 어원: Greek apo \'leaf\' + ptosis \'falling off\'. 조직에서 더 이상 필요하지 않은 세포 제거와 다양한 세포 집단의 지속적 유지를 위한 <b>정상 현상</b>.','형태 확인 예: membrane blebbing &amp; apoptotic body, DAPI staining, <b>cleaved caspase-3</b>(교안 그림 표기).','caspase: tetrapeptide sequence를 인지해 <b>aspartic acid residue 다음을 절단</b>. 활성화된 caspase는 세포자멸사가 진행 중인 세포의 지표.','세포자멸사의 시작 = caspase 효소들의 활성화.']}],
 n2f2:[
  {h:'보충: 결과 · 세부',p:'p.42–45',b:['Necroptosis 첫 슬라이드의 기전: ligand TNF → TNFR1 → caspase-8, RIP1, RIP3를 복합체 내로 불러들임 → RIP1·RIP3(→ MLKL)가 necrosome 형성 → mitochondria에서 ATP·ROS 생성에 영향을 주는 신호 개시 → 전형적인 necrosis 동반.','Pyroptosis: PRR이 PAMPs 또는 DAMPs에 반응해 활성화 → inflammasome 조립. caspase-1의 작용 결과 <b>proinflammatory cytokine 방출과 면역세포 동원</b>.','Autophagy 분류 세부: Macro = double-membrane autophagosome 안의 격리·수송 / Micro = 전달을 위한 리소좀 막의 함입 / Chaperone-mediated = 샤페론 단백질에 의한 직접적 리소좀 막 관통 수송.']}],
 n2g:[
  {h:'보충: 축적물질 세부',p:'p.51–53',b:['세포 내 축적: 정상 세포가 대사·수송 이상으로 비정상 물질을 쌓는 현상(지방·단백질·글리코겐·색소).','색소: 색을 갖는 물질. 일부는 세포의 정상 성분(<b>멜라닌</b>), 일부는 특별한 상황에서만 축적되는 비정상 물질.','지방증 원인: 독소, 단백질 영양실조, 당뇨병, 비만, 무산소증.','단백질 축적 예: 중증 단백뇨 질환의 신세뇨관 상피세포(소포 내 단백질 재흡수 증가 → 분홍색 유리질 방울).']},
  {h:'보충: 텔로미어 도식',p:'p.57–59',b:['텔로미어: 유전적 암호가 없어 단백질로 번역되지 않지만 노화·암과 관련된 중요한 부위.','텔로머라아제 관계도(Relationship between Telomerase, Aging, and Cancer): 체세포 분열 반복 → 텔로미어 단축 → 노화 / 암세포 → 텔로머라아제 재활성화 → 지속 분열.']}],
 n3a:[
  {h:'보충: 5단계 세부 · 결과',p:'p.4–8',b:['p.4–5 \'Inflammation: An Important Field of Dentistry\': 치과에서 염증의 중요성(건강보험심사평가원 자료 그림, 수치는 이미지).','<b>Removal(제거)</b> 단계에서 혈관 확장·투과성 증가 → 체액이 조직으로 이동 → <b>부종(edema)</b>.','<b>Repair or Resolution</b>: 손상 정도에 따라 정상으로 회복되거나 수복(재생 또는 섬유화).','염증의 해로운 결과: 국소적 조직손상(예: 자가면역질환 — 류마티스관절염).','조직수복의 시작과 종식: 염증이 성공적으로 제거되면 조직수복 시작 → 재생 또는 결손부위가 결합조직으로 채워짐(흉터 형성).','염증 매개물질: 염증반응을 유도·조절하는 분자(histamine, serotonin, cytokine, chemokine 등).']}],
 n3b:[
  {h:'보충: 혈관 반응 세부',p:'p.13–16',b:['혈관 반응의 목적: 혈장단백질과 백혈구를 순환계에서 감염·손상 부위로 <b>최대한 빨리</b> 수송.','림프계는 정상적으로 모세혈관에서 스며 나온 소량의 혈관외액을 회수해 혈액으로 되돌림. 염증 시 부종액이 늘어 림프 흐름 증가.','림프절 염증: lymphoid follicle 증식, 림프구·대식세포 수 증가 → 림프절 비대.']}],
 n3c:[
  {h:'보충: 백혈구의 기능 · 식작용 세부',p:'p.17–22',b:['염증에서 백혈구의 기능: 세균·미생물 소화 및 제거, 괴사조직·외부물질 제거, 수복에 도움을 주는 성장인자 생성. 강력히 활성화되면 조직손상·염증 지속(백혈구 생성물이 정상 숙주 조직도 손상).','백혈구 활성화: 미생물·죽은 세포 인식이 일으키는 다양한 반응의 총칭. 표면 수용체가 서로 다른 자극을 인지하고 기능을 매개하는 반응을 개시.','식작용 ②단계: 포식수용체 결합 → 물질 주위로 세포질 확장 → 형질막이 phagosome 형성 → 물질을 둘러싸 lysosome과 결합 → <b>phagolysosome</b> 형성 → 과립 내용물 방출.','NETs는 항박테리아 물질을 높은 농도로 공급하는 역할.','대식세포가 만드는 결합조직 재편성 효소: <b>MMPs, LOX</b>. 항염증 신경자극: 아세틸콜린 분비(콜린성 항염증 경로)로 대식세포의 TNF-α 생성 억제.']}],
 n3d:[
  {h:'보충: 매개체 세부',p:'p.25–31',b:['매개체 6군: 혈관활성아민 · 아라키돈산 대사물질 · cytokine/chemokine · 보체계 · 혈소판 활성인자·혈액응고 산물·키닌계·신경펩타이드.','<b>Histamine</b> 분비 자극: 외상·물리적 상해, 알레르기 반응, 아나필락시스 독소(anaphylatoxins). <b>Serotonin</b>의 주 기능은 위장관 신경전달물질(혈관 수축·응고 반응).','arachidonic acid: 식품 또는 필수지방산 리놀레산에서 전환된 20개 탄소 불포화 지방산. 정상적으로 막 인지질에 에스테르화되어 있다가 자극·효소로 분비. cyclooxygenase·lipoxygenase 경로로 대사 → <b>eicosanoid</b>.','Prostaglandin 생성 세포: 비만세포, 대식세포, 내피세포 등.','Cytokine 생성 세포: 활성화된 림프구, 대식세포, 수지상세포, 내피세포, 상피세포, 결체조직세포.','<b>Neuropeptides</b>: 감각신경과 다양한 백혈구에서 분비, 염증반응 개시·진행. <b>PAF, 혈액응고 산물(thrombin, fibrin)</b>도 매개체.']}],
 n3e:[
  {h:'보충: 형태 · 결과 세부',p:'p.33–35',b:['급성염증 반응의 형태학적 특징: 혈관의 확장, 혈관외 조직에서의 백혈구와 체액의 축적.','장액성: 세포외 손상으로 생긴 공간 또는 복막·흉막·심막으로 둘러싸인 체강에 맑은 액체가 고임.','완전 용해는 해로운 자극을 중화·제거하는 데 성공했을 때 정상 수복하며 종결.','농양이 제거되어 조직이 회복되어도 손상 정도가 크면 흉터를 남기며 치유.']}],
 n3f:[
  {h:'보충: 세포 세부',p:'p.39–42',b:['대식세포 → T세포: 항원 제시 &amp; 막 성분 생성, cytokine(주로 IL-12) 분비. activated T세포 → 대식세포를 모으고 활성화하는 cytokine(IFN-γ) 분비 → 만성염증 유지.','비만세포는 결합조직에 광범위 분포. 즉각적 과민반응(음식·곤충 독성·약물 알레르기) 때 급성염증, cytokine·growth factor 분비로 염증 유지·조직 수복(만성염증).','육아종의 이물형: 하나의 대식세포가 포식작용을 할 수 없을 정도로 큰 이물(활석, 봉합사, 다른 섬유) 주위에 형성.','만성염증은 지속적 염증·조직손상·수복이 공존해 복합적이고 다양한 소견.']}],
 n3h:[
  {h:'보충: 재생 세부',p:'p.50–51',b:['세포증식은 <b>성장인자</b>로 형성되고 <b>세포외기질로부터의 신호</b>로 촉진. 조직 수복 능력은 부분적으로 고유 증식능력으로 결정.','<b>간 재생</b>: 재생에 의한 수복의 전형적 예. 간 상실·염증 등에 반응해 생성된 cytokines·growth factors로 유발. 만성 간질환처럼 간세포 재생능력이 손상되면 <b>전구세포</b>가 재증식에 기여.','섬유화: 만성질환에서 내부 장기의 collagen 침착을 가리킴. 장기 기능장애·기능부전(organ failure)을 초래.','수복의 결과는 세포외기질 단백질 합성과 분해 간의 균형에 영향. 흉터 부위 결합조직은 침착 후에도 계속 변경·재형성.']}],
 n4a:[
  {h:'보충: 기전 · 형태 세부',p:'p.6–8',b:['정수압 증가의 이유: 심장으로 혈액이 돌아오지 못함 → 정맥 내 정체 → 혈관 압력 증가 → 조직으로 체액 이동.','알부민 감소 → 교질삼투압 감소 → 부종, <b>혈류량 감소</b>, 신관류(renal perfusion) 저하.','부종의 현미경 소견: 세포외기질이 분리되고 세포 사이 공간이 넓어짐. 주로 피하조직·폐·뇌. 대부분 육안으로 확인 가능.','유방암 환자: 겨드랑이 림프절 제거 또는 방사선 치료 → 림프 배출 장애 → 상지부종. 사상충증: 림프관·림프절 섬유화 → 하지부종(코끼리피부병).']}],
 n4c:[
  {h:'보충: 지혈 · 혈소판 세부',p:'p.13–18',b:['지혈 이상의 두 방향: <b>출혈장애</b>(과출혈) vs <b>혈전성 장애</b>(정상 혈관·심장 내 혈전 형성).','혈관수축(endothelin)의 효과는 일시적. 혈소판·응고계가 활성화되지 않으면 출혈 재개.','혈소판 활성화: 둥근 원반 → 편평한 판 모양 → \'성게\' 모양, 분비과립 방출, 수 분 내 더 많은 혈소판 모집 → 응집하여 hemostatic plug.','혈소판 표면에 <b>음전하 인지질(phosphatidylserine)</b> 배치 — 응고인자가 결합·복합체를 만드는 표면.','이차 지혈: 손상 부위로 조직인자(tissue factor) 방출 + fibrin 축적. 조직인자는 응고인자 Ⅶ과 함께 응고연쇄반응 활성화 → thrombin → fibrinogen 절단 → fibrin meshwork, 혈소판 응집·활성화 유도.','중합된 fibrin + 응축된 혈소판 = 고형의 영구적 마개(permanent plug). t-PA·thrombomodulin에 의해 손상 부위 지혈이 제한되고 피덩이 흡수·조직 재생.','PT·PTT가 평가하는 단백질: 외인성(Factor Ⅶ, Ⅹ, Ⅴ, Ⅱ, fibrinogen; 교안 추출 표기는 \'Ⅷ\'로 읽혀 원문 확인 필요) / 내인성(Factor ⅩⅡ, ⅩⅠ, ⅠⅩ, Ⅷ, Ⅹ, Ⅴ, Ⅱ, fibrinogen). PTT는 Hageman factor(ⅩⅡ)·인지질·칼슘이 활성을 띠어 혈전 생성 시간을 기록.']}],
 n4d:[
  {h:'보충: 혈류 이상 기전',p:'p.23',b:['정체·와류는 혈류 변화에 따라 내피세포의 부착분자·향염증인자 유전자 발현을 바꿔 <b>내피세포 활성화, 항응고활성 저하, 백혈구 부착 증가</b>를 일으킴.','와류는 층류(laminar flow)를 방해해 혈소판이 내피세포에 접촉하게 하고, 활성 응고인자의 희석을 방해하며 응고인자 억제제 유입을 지연.','와류: 역류와 국소적 혈류 정체 부위를 만들어 내피세포 손상·기능이상 → 동맥·심장혈전.','동맥혈전: 혈소판·섬유소·적혈구·퇴행성 백혈구로 구성된 부서지기 쉬운 망상구조. 정맥혈전: 정맥 내강에 긴 주형을 형성.']}],
 n4e:[
  {h:'보충: 색전 세부',p:'p.27–29',b:['색전(embolus): 기원에서 혈류를 타고 먼 곳으로 운반되는 고형·액체·기체 덩어리. 더 이상 진행할 수 없는 작은 혈관을 만날 때까지 이동해 부분적·완전 폐쇄 유발.','드문 색전: 작은 지방 덩어리, 공기·질소 방울, 죽상경화증 찌꺼기, 종양 조각, 골수 산물, 외래 이물질.','폐색전증: 하나를 가진 환자는 다수 색전 위험이 높음. 작은 폐색전은 시간이 지나며 기질화되어 혈관벽에 결합.','양수색전증: 생존자의 85% 영구적 신경결함. 분만·분만 직후 중증 호흡곤란, 청색증, 저혈압쇼크, 발작, 신경성 장애. 모체에서 태아 피부 편평세포, 배냇솜털, 태아기름막 지방, 호흡관·위장관 유래 점액소(mucin) 관찰.','급성감압병 치료: 고압실에서 가압 → 기포가 체액 내로 되돌아가게 한 뒤 서서히 감압(가스 점진 흡수·폐쇄성 기포 재형성 억제).']}],
 n4f:[
  {h:'보충: 경색 형태',p:'p.31',b:['지라 백색경색(이중혈액공급이 없는 기관의 동맥폐쇄): 점차 연해지고 경계가 분명해짐. 폐 적색경색: 비교적 광범위.','경색의 대부분은 최종적으로 흉터로 교체됨.']}],
 n4g:[
  {h:'보충: 쇼크 세부',p:'p.34–36',b:['쇼크는 심한 출혈, 광범위 외상·화상, 심근경색증, 폐색전증, 세균성 패혈증 등에서 악화될 수 있음.','심장성: 내인성 심근손상(경색증), 심실성 부정맥, 외인성 압박, 폐색전증. 저혈량성: 혈류량 저하 → 심박출량 저하.','패혈성 쇼크 기전: 미생물 감염 → 선천면역 세포의 수용체(TLR) 결합 → inflammatory cytokines → 혈관 확장·혈압저하·발열·백혈구 증가. 과염증 후 면역기능 저하(림프구 세포사멸, IL-10 증가) → 2차 감염 취약.','응고장애: 패혈성 환자 절반 이상에서 파종혈관내응고 합병증. 대사이상: 고혈당. 장기 기능이상: 신장·폐·심장 부전 → 사망 가능.']}]

function reveal(q){
  var e=eff(q),h='';
  var ansTxt=e.ans?e.ans.join(', ')+'번':(q.short?q.short:(q.proposed&&q.proposed.length?'정답 미정':'정답 미정'));
  h+='<div class="ansline">정답: '+esc(ansTxt)+' <span class="badge '+stCls(e.st)+'">'+esc(e.st)+'</span>'+
    (q.conf?' <span class="badge hide-exam">신뢰도 '+esc(q.conf)+'</span>':'')+'</div>';
  if(!e.ans&&q.proposed&&q.proposed.length)h+='<div class="ansline hide-exam">추론(채점 제외): '+esc(q.proposed.join(', '))+'번'+(q.alt?' · 대안 '+esc(q.alt):'')+(q.recheck?' · 재판정 조건: '+esc(q.recheck):'')+'</div>';
  if(q.cand&&q.cand.length)h+='<div class="note hide-exam">후보: '+q.cand.map(function(c){return c.n+'번('+esc(c.why)+')'}).join(' / ')+'</div>';
  if(q.w&&q.w.length&&q.opts&&q.opts.length){
    h+='<ul class="why">'+q.opts.map(function(o,i){
      var w=q.w[i]||'';var ok=e.ans?(e.ans.indexOf(i+1)>=0):null;
      var tag=ok===null?'?':ok?'○':'✕';
      return '<li><span class="t '+(ok===null?'q':ok?'o':'x')+'">'+(i+1)+tag+'</span><span>'+fmt(w)+'</span></li>';}).join('')+'</ul>';
  }
  if(q.pair)h+='<div class="memo">'+fmt(q.pair)+'</div>';
  if(q.sum&&q.sum.length)h+='<ul class="why">'+q.sum.map(function(s){return '<li><span class="t q">·</span><span>'+fmt(s)+'</span></li>'}).join('')+'</ul>';
  if(q.fix&&q.fix.length)q.fix.forEach(function(f){h+='<div class="orig hide-exam"><b>오기 병기</b> [원문] '+esc(f[0])+' / [수정 제안] '+esc(f[1])+' / [사유] '+esc(f[2])+'</div>'});
  if(q.note)h+='<div class="note hide-exam">'+fmt(q.note)+'</div>';
  h+='<div class="hide-exam">'+evHtml(q)+'</div>';
  if(q.nk)h+='<div class="hide-exam">관련 정리: <button class="lk" data-note="'+q.nk+'">'+esc((NOTE_BY[q.nk]||{}).t||q.nk)+'</button></div>';
  if(q.opts&&q.opts.length){
    var u=USER[q.id]||{};
    h+='<details class="d hide-exam"><summary>정답 지정(사용자 확정)</summary><div class="bar" style="margin-top:6px">'+
      q.opts.map(function(o,i){var on=u.a&&u.a.indexOf(i+1)>=0;return '<label class="tg"><input type="checkbox" data-uq="'+q.id+'" value="'+(i+1)+'"'+(on?' checked':'')+'> '+(i+1)+'번</label>'}).join('')+
      '<input type="text" id="ur-'+q.id+'" placeholder="이유(선택)" value="'+esc(u.r||'')+'" style="flex:1;min-width:140px;padding:3px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg)">'+
      '<button class="btn s" data-usave="'+q.id+'">저장</button><button class="btn s" data-ureset="'+q.id+'">해제</button></div>'+
      '<div class="note">저장하면 이 문항은 \'사용자 확정\'(채점 기준 포함)으로 바뀌며 이전 판정은 보존됩니다. 이 브라우저에만 저장됩니다.</div></details>';
  }
  return h;
}
function card(q,withG){
  var e=eff(q);
  var ser=q.stemSerif?' ser':'';
  var h='<article class="q'+(q.oos?' oos':'')+'" id="q-'+q.id+'">';
  h+='<div class="qh"><span class="qn">'+esc(q.n)+'</span>'+
    '<span class="badge hide-exam">'+(q.set==='past'?'기출':'예상')+'</span>'+
    (q.oos?'<span class="badge oos">범위 외</span>':'')+
    '<span class="badge '+stCls(e.st)+' hide-exam">'+esc(e.st)+'</span>'+
    '<span class="badge hide-exam">근거 '+esc(q.tier||'-')+'</span>'+
    (q.src?'<span class="badge hide-exam">'+esc(q.src)+'</span>':'')+
    (q.ck?'<span class="badge hide-exam">개념 '+esc(q.ck)+'</span>':'')+
    (q.reps?'<span class="badge hide-exam">'+esc(q.reps)+'</span>':'')+
    (q.derive?'<span class="badge hide-exam">파생 기출 '+esc(q.derive)+'</span>':'')+
    '<span class="badge hide-exam" title="문항 ID">'+esc(q.id)+'</span></div>';
  h+='<div class="stem'+ser+'">'+fmt(q.stem)+'</div>';
  if(q.opts&&q.opts.length){h+='<ol class="opts">'+q.opts.map(function(t,i){return optHtml(q,i+1,t,withG&&S.graded[q.id]!==undefined)}).join('')+'</ol>';}
  if(q.miss)h+='<p class="missing hide-exam">'+esc(q.miss)+'</p>';
  var open=S.showAll||SHOWN[q.id];
  h+='<div class="qa"><button class="btn s" data-show="'+q.id+'">'+(open?'정답·해설 숨기기':'정답·해설 보기')+'</button>';
  if(withG&&S.graded[q.id]!==undefined)h+='<span class="mk '+(S.graded[q.id]===null?'':S.graded[q.id]?'ok':'ng')+'">'+(S.graded[q.id]===null?'미응답':S.graded[q.id]?'정답':'오답')+'</span>';
  h+='</div>';
  h+='<div class="reveal" '+(open?'':'hidden')+'>'+(open?reveal(q):'')+'</div>';
  return h+'</article>';
}

/* ---------- 내용 정리 ---------- */
var NOTE_BY={};NOTES.forEach(function(c){NOTE_BY[c.id]=c});
function tbl(t){
  return '<div class="tw"><table class="t"><thead><tr>'+t.h.map(function(x){return '<th>'+fmt(x)+'</th>'}).join('')+'</tr></thead><tbody>'+
    t.r.map(function(r){return '<tr>'+r.map(function(x){return '<td>'+fmt(x)+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table></div>';
}
function noteCard(c){
  var seen={};
  function f(x){return abbrify(x,seen)}
  var past=(c.q||[]).filter(function(i){return BYID[i]&&BYID[i].set==='past'}).length;
  var h='<section class="nc" id="n-'+c.id+'"><div class="hd"><h3>'+esc(c.t)+'</h3><span class="chip">'+c.ch+'장</span>'+(past?'<span class="hits">23학번 기출 '+past+'문항 연계</span>':'')+'</div>';
  if(c.lead)h+='<p class="lead">'+f(c.lead)+'</p>';
  if(c.kw&&c.kw.length)h+='<div class="kws">'+c.kw.map(function(k){return '<span class="kw">'+esc(k)+'</span>'}).join('')+'</div>';
  if(CARDPG[c.id])h+=galHtml(c.ch,CARDPG[c.id][0],CARDPG[c.id][1]);
  if(c.flow)c.flow.forEach(function(fl){h+='<div class="flow"><div class="ft">'+f(fl.t)+'</div><ol>'+fl.s.map(function(x,i){return '<li><span class="st"><i>'+(i+1)+'</i>'+f(x)+'</span></li>'}).join('')+'</ol></div>'});
  if(c.secs&&c.secs.length)h+='<div class="secs">'+c.secs.map(function(sc){return '<div class="sp"><h5>'+f(sc.h)+(sc.p?'<span class="pg">'+esc(sc.p)+'</span>':'')+'</h5><ul>'+sc.b.map(function(x){return '<li>'+f(x)+'</li>'}).join('')+'</ul></div>'}).join('')+'</div>';
  (c.tbls||[]).forEach(function(t){if(t.cap)h+='<h4>'+esc(t.cap)+'</h4>';h+=tbl(t)});
  if(c.pts&&c.pts.length)h+='<div class="pts"><h5>시험 포인트</h5><ul>'+c.pts.map(function(x){return '<li>'+f(x)+'</li>'}).join('')+'</ul></div>';
  if(c.memo&&c.memo.length)h+='<div class="memo"><h5>암기 포인트</h5>'+c.memo.map(function(x){return '<div>· '+f(x)+'</div>'}).join('')+'</div>';
  if(c.cmp&&c.cmp.length)h+='<h4>헷갈리는 비교</h4><div class="cmp">'+c.cmp.map(function(p){return '<div><b>'+f(p[0])+'</b>'+f(p[1])+'</div>'}).join('')+'</div>';
  if(c.q&&c.q.length)h+='<h4>기출·예상 연계</h4><div>'+c.q.map(function(id){var q=BYID[id];return q?'<button class="lk" data-goq="'+id+'">'+esc(q.n)+(q.set==='past'?'(기출)':'')+'</button>':''}).join('')+'</div>';
  h+='<div class="src">출처: '+esc(c.src)+'</div></section>';
  return h;
}
function chHead(ch,list){
  var past=0;list.forEach(function(c){(c.q||[]).forEach(function(i){if(BYID[i]&&BYID[i].set==='past')past++})});
  var T={2:'세포 반응: 적응 · 손상 · 사멸',3:'염증과 수복',4:'혈류역학적 장애 · 혈전 · 쇼크'};
  return '<div class="nh"><span class="nb">'+ch+'장</span><h2>'+T[ch]+'</h2><span class="ns">카드 '+list.length+' · 기출 연계 '+past+'문항</span></div>';
}
function notesBody(){
  var h='';
  [2,3,4].forEach(function(ch){
    if(S.ch!=='all'&&String(ch)!==S.ch)return;
    var l=NOTES.filter(function(c){return c.ch===ch});
    h+=chHead(ch,l)+'<div class="toc">'+l.map(function(c){return '<button class="lk" data-scroll="n-'+c.id+'">'+esc(c.t)+'</button>'}).join('')+'</div>'+l.map(noteCard).join('');
  });
  return h;
}
function timeCard(){
  return '<section class="nc" id="n-time"><h3>연도·시점 한눈에</h3><div class="chips" style="margin-bottom:6px"><span class="chip">표 2</span><span class="chip">교안에 실제로 나온 값만</span></div>'+
    tbl(TIME.years)+tbl(TIME.times)+'<div class="src">출처: '+esc(TIME.src)+'</div></section>';
}

/* ---------- 탭별 본문 ---------- */
function chBar(chs,extra){
  var h='<div class="bar"><button class="pill" data-ch="all" aria-pressed="'+(S.ch==='all')+'">전체</button>'+
    chs.map(function(c){return '<button class="pill" data-ch="'+c+'" aria-pressed="'+(S.ch===String(c))+'">'+c+'장</button>'}).join('')+
    '<span class="grow"></span>'+(extra||'')+
    '<label class="tg"><input type="checkbox" id="t-exam"'+(S.exam?' checked':'')+'> 시험지형</label>'+
    '<label class="tg"><input type="checkbox" id="t-all"'+(S.showAll?' checked':'')+'> 정답·해설 모두 보기</label></div>';

}
function renderMain(keep){
  var y=window.scrollY;
  var el=$('#main'),h='';
  document.body.classList.toggle('exam',S.exam);
  if(S.tab==='past'||S.tab==='new'){
    var oosBtn=S.tab==='past'?'<label class="tg"><input type="checkbox" id="t-oos"'+(S.oos?' checked':'')+'> 범위 외(면역) 보기</label>':'';
    h+=chBar([2,3,4],oosBtn);
    var l=listFor(S.tab);
    h+='<p class="note hide-exam">'+(S.tab==='past'?'23학번(2025-2 본1-2, 신지애) 중간고사 복기본 기준. 21·22학번(오규영 교수) 자료는 사용자 지시로 전부 제외했습니다. 정답은 교안(T4) 근거 추정이며 원본 정답표(T1)는 확인하지 못했습니다.':'교안 2·3·4장(2026) 범위에서 만든 신규 문제입니다. 정답은 교안 문장 근거(T4)이며 사용자 확정 전까지 \'추정\'입니다.')+'</p>';
    h+=l.length?l.map(function(q){return card(q,true)}).join(''):'<div class="empty">표시할 문항이 없습니다.</div>';
  }else if(S.tab==='notes'){
    h+='<div class="bar"><button class="pill" data-ch="all" aria-pressed="'+(S.ch==='all')+'">전체</button>'+[2,3,4].map(function(c){return '<button class="pill" data-ch="'+c+'" aria-pressed="'+(S.ch===String(c))+'">'+c+'장</button>'}).join('')+'</div>';
    h+=timeCard();
    h+=notesBody();
  }else if(S.tab==='all'){
    h+='<div class="bar"><span class="grow"></span><button class="btn s" id="b-fold">'+(S.openNotes?'요약 접기':'요약 펴기')+'</button></div>';
    h+='<div class="toc">'+[['n-time','연도·시점']].concat(NOTES.map(function(c){return ['n-'+c.id,c.ch+'장 '+c.t]})).map(function(t){return '<button class="lk" data-scroll="'+t[0]+'">'+esc(t[1])+'</button>'}).join('')+'</div>';
    S.ch='all';h+=timeCard()+notesBody();
    h+='<p class="note">문항 카드는 이 화면에 넣지 않았습니다. 각 카드의 \'기출·예상 연계\' 버튼으로 해당 문항으로 이동합니다.</p>';
  }else if(S.tab==='photo'){
    h+=photoHtml();
  }else if(S.tab==='mock'){
    h+=mockHtml();
  }else{
    h+=statusHtml();
  }
  el.innerHTML=h;
  if(keep)window.scrollTo(0,y);
  refreshMarks();
}

/* ---------- 사진 문항 ---------- */
function figHtml(ch,n){
  var s=SLMAP[ch+'-'+n];if(!s)return '';
  return '<figure class="fg"><div class="fw"><img loading="lazy" src="img/ch'+ch+'_'+(n<10?'0':'')+n+'.jpg" alt="'+s[3]+' 교안 Ch'+ch+' p.'+n+' '+esc(s[2])+'"><span class="fq">'+s[3]+'</span></div><figcaption>Ch'+ch+' p.'+n+'</figcaption></figure>';
}
function galHtml(ch,a,b){
  var h='',c=0;for(var n=a;n<=b;n++){var f=figHtml(ch,n);if(f){h+=f;c++}}
  return c?'<details class="d fold"><summary>교안 그림 슬라이드 '+c+'장 (그림·사진이 있는 쪽)</summary><div class="gal">'+h+'</div><div class="note">슬라이드를 누르면 크게 보입니다. 66dpi 렌더링이라 작은 글씨는 원본 PDF를 보십시오.</div></details>':'';
}
var PCNT=lsGet('pat26-pcnt',{gross:'36',slide:'30'});
var PMK={};
function pimg(p,label){return '<figure class="fg"><div class="fw"><img loading="lazy" src="img/ph_'+(p.n<10?'0':'')+p.n+'.jpg" alt="사진 '+p.n+' '+esc(p.kd)+'"><span class="fq">'+esc(label)+'</span></div></figure>';}
function pans(p){
  var h='<b>'+esc(p.t)+'</b> <span class="chip">'+esc(p.kd)+'</span><ul style="margin:4px 0 0;padding-left:1.1em">'+p.k.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>';
  if(p.fx)h+='<div class="memo"><h5>복기 오류 의심(임의 수정하지 않음)</h5><div>[원문] '+esc(p.fx.raw)+'</div><div>[수정 제안] '+esc(p.fx.fix)+'</div><div>[사유] '+esc(p.fx.why)+'</div></div>';
  if(p.nt)h+='<div class="note">'+esc(p.nt)+'</div>';
  var sl=PSL[p.pk];
  if(sl)h+='<div class="gal">'+sl.slice(1).map(function(n){return figHtml(sl[0],n)}).join('')+'</div>';
  h+='<div class="note">관련 정리: <button class="lk" data-note="'+p.nk+'">'+esc((NOTE_BY[p.nk]||{}).t||p.nk)+'</button></div>';
  return h;
}
function pcard(p,label,mk){
  var m=PMK[p.n];
  return '<div class="sp" id="ph-'+p.n+'"><h5>'+(mk?'':'사진 '+p.n+' · ')+p.ch+'장 · '+(p.cls==='gross'?'이론(그 밖의 사진)':'실험(조직 슬라이드)')+'</h5>'+pimg(p,label)+
    '<details class="d" style="margin-top:6px"><summary>정답 보기</summary>'+pans(p)+'</details>'+
    (mk?'<div class="bar" style="margin-top:6px"><span class="note">자기채점</span><button class="pill" data-pmk="'+p.n+':1" aria-pressed="'+(m===1)+'">맞음</button><button class="pill" data-pmk="'+p.n+':0" aria-pressed="'+(m===0)+'">틀림</button></div>':'')+'</div>';
}
function pdraw(){
  var r=rng(S.pmSeed*104729+7),out=[];
  ['gross','slide'].forEach(function(c){
    var l=PHOTO.filter(function(p){return p.cls===c}).sort(function(){return r()-.5});
    var n=Math.max(0,Math.min(parseInt(PCNT[c],10)||0,l.length));
    out=out.concat(l.slice(0,n).map(function(p){return p.n}));
  });
  S.pm=out;PMK={};
}
function pscore(){
  var n=S.pm.length,ok=0,ng=0;S.pm.forEach(function(i){if(PMK[i]===1)ok++;else if(PMK[i]===0)ng++});
  return '자기채점: 맞음 '+ok+' · 틀림 '+ng+' · 미채점 '+(n-ok-ng)+' / 총 '+n+'장'+(ok+ng?' · 채점한 것 기준 '+Math.round(100*ok/(ok+ng))+'%':'');
}
function pmockHtml(){
  if(!S.pm.length)pdraw();
  var g=S.pm.filter(function(i){return PHOTO[i-1].cls==='gross'}),sl=S.pm.filter(function(i){return PHOTO[i-1].cls==='slide'});
  var nG=PHOTO.filter(function(p){return p.cls==='gross'}).length,nS=PHOTO.length-nG;
  var h='<div class="bar"><span class="chip a">사진 모의</span><span class="chip w">이론 '+g.length+' · 실험 '+sl.length+'장 (목표 '+esc(PCNT.gross)+'/'+esc(PCNT.slide)+', 풀 '+nG+'/'+nS+')</span><span class="grow"></span><button class="btn s" id="pm-draw">새로 뽑기</button><button class="btn s" id="pm-off">공부 화면으로</button></div>';
  h+='<p class="note">사진을 보고 병변·소견을 말해 본 뒤 \'정답 보기\'를 여십시오. 정답은 선배 손글씨 라벨(2025-2)이라 올해 정답이 아닙니다. 풀이 목표 수보다 작으면 풀 전체를 냅니다.</p><div class="note" id="pscore">'+pscore()+'</div>';
  var k=0;
  [['이론 시험 사진 문항',g],['실험 시험 사진 문항',sl]].forEach(function(grp){
    h+='<section class="sec"><h2>'+grp[0]+' ('+grp[1].length+')</h2><div class="secs">'+grp[1].map(function(i){k++;return pcard(PHOTO[i-1],String(k),true)}).join('')+'</div></section>';
  });
  return h;
}
function photoHtml(){
  if(S.pmOn)return pmockHtml();
  var l=PHOTO.filter(function(p){return (S.pc==='all'||p.cls===S.pc)&&(S.ch==='all'||String(p.ch)===S.ch)});
  var nG=PHOTO.filter(function(p){return p.cls==='gross'}).length,nS=PHOTO.length-nG;
  var h='<div class="memo" style="margin-top:0"><h5>시험 방식(과목 일람 메모 · 사용자 전달)</h5><div>· 조직 slide scan 사진 → <b>치과병리학실험</b> 시험 / 그 밖의 사진(육안·gross 등) → <b>치과병리학(이론)</b> 시험에 실어 사진 문항으로 출제</div><div>· 과목 일람: \'병리실 — 사진 보고 맞는 설명 찾는 형태\'</div></div>';
  h+='<p class="note">사진 문항 수: <b>이론 36 · 실험 30</b>(2026-10-24 지인 메신저 전달, <b>최종 검토 후 변동 가능</b>, 공지 원문 미확인). 값이 바뀌면 아래 칸을 고치십시오(이 브라우저에만 저장).</p>';
  h+='<div class="bar"><label class="tg">이론 사진 문항 수 <input id="pc-g" type="number" min="0" style="width:64px" value="'+esc(PCNT.gross)+'"></label><label class="tg">실험 사진 문항 수 <input id="pc-s" type="number" min="0" style="width:64px" value="'+esc(PCNT.slide)+'"></label><span class="chip w">변동 가능 · 원문 미확인</span><span class="grow"></span><button class="btn" id="pm-on">사진 모의 시작</button></div>';

/* ---------- 모의고사 ---------- */
function pool(){
  return QS.filter(function(q){
    if(q.oos)return false;
    if(!q.opts||q.opts.length<3)return false;
    if(!eff(q).ans)return false;
    if(q.set==='new'&&!S.mockNew)return false;
    return true;
  });
}
function rng(seed){var s=seed>>>0;return function(){s=(s*1664525+1013904223)>>>0;return s/4294967296}}
function draw(){
  var p=pool(),r=rng(S.mockSeed*7919+13);
  var ws={};PAST.forEach(function(q){if(!q.oos&&q.opts&&q.opts.length)ws[q.ch]=(ws[q.ch]||0)+1});
  var tot=0;Object.keys(ws).forEach(function(k){tot+=ws[k]});
  var n=Math.min(S.mockN,p.length),pick=[];
  var by={};p.forEach(function(q){(by[q.ch]=by[q.ch]||[]).push(q)});
  Object.keys(by).forEach(function(k){by[k].sort(function(){return r()-.5})});
  var left=n;
  Object.keys(ws).forEach(function(k,ix,arr){
    var c=ix===arr.length-1?left:Math.round(n*ws[k]/tot);c=Math.min(c,(by[k]||[]).length,left);
    pick=pick.concat((by[k]||[]).slice(0,c));left-=c;
  });
  if(left>0){var rest=p.filter(function(q){return pick.indexOf(q)<0}).sort(function(){return r()-.5});pick=pick.concat(rest.slice(0,left));}
  pick.sort(function(a,b){return a.ch-b.ch||(a.set===b.set?0:a.set==='past'?-1:1)});
  S.mockIds=pick.map(function(q){return q.id});
  pick.forEach(function(q,i){q.mn=i+1});
}
function mockHtml(){
  if(!S.mockIds.length)draw();
  var l=S.mockIds.map(function(i){return BYID[i]});
  var h='<div class="bar"><span class="chip a">'+dday()+'</span><span class="chip w">시험 시간 14:00–16:00(120분)은 사용자 전달 · 공지 원문 미확인</span><span class="timer" id="timer">'+timerText()+'</span>'+
    '<button class="btn s" id="m-start">'+(S.mockStart?'타이머 초기화':'시작')+'</button></div>';
  h+='<div class="bar"><label class="tg">문항 수 <select id="m-n">'+[20,30,40].map(function(n){return '<option value="'+n+'"'+(S.mockN===n?' selected':'')+'>'+n+'</option>'}).join('')+'</select></label>'+
    '<label class="tg"><input type="checkbox" id="m-new"'+(S.mockNew?' checked':'')+'> 예상 문제 포함</label><button class="btn s" id="m-draw">새로 뽑기</button>'+
    '<span class="grow"></span><label class="tg"><input type="checkbox" id="t-exam"'+(S.exam?' checked':'')+'> 시험지형</label></div>';
  h+='<p class="note hide-exam">출제 풀: 범위 내 · 정답이 있는 문항(추론·미확정 제외) '+pool().length+'건. 단원 비중은 기출 문항 수에 비례한다는 가정입니다(실제 비중 미공지). 같은 문항은 한 시험에 두 번 나오지 않습니다. 점수는 채점하기에서 두 가지로 표시됩니다.</p>';
  l.forEach(function(q){var c=Object.assign({},q);c.n=String(q.mn)+'번';h+=card(Object.assign(c,{id:q.id,set:q.set}),true)});
  return h;
}
function timerText(){
  if(!S.mockStart)return '120:00';
  var rem=EXAM_MIN*60-Math.floor((Date.now()-S.mockStart)/1000),over=rem<0,a=Math.abs(rem);
  var mm=Math.floor(a/60),ss=a%60;
  return (over?'초과 +':'남은 ')+(mm<10?'0':'')+mm+':'+(ss<10?'0':'')+ss;
}
function tick(){var t=$('#timer');if(t){t.textContent=timerText();t.className='timer'+((EXAM_MIN*60-Math.floor((Date.now()-S.mockStart)/1000))<0&&S.mockStart?' over':'')}}

    COVER.map(function(r){return '<tr><td>'+r[0]+'장</td><td>'+esc(r[1])+'</td><td>'+esc(r[2])+'</td><td><button class="lk" data-note="'+r[3]+'">'+esc((NOTE_BY[r[3]]||{}).t||r[3])+'</button></td><td>'+esc(r[4])+'</td></tr>'}).join('')+'</tbody></table></div></section>';
  h+='<section class="sec"><h2>인용 그림 색인</h2><p class="note">교안 그림 슬라이드 '+SLIDES.length+'장을 슬라이드 단위로 내장하고 Q1~Q'+SLIDES.length+' 번호를 붙였습니다(번호는 한 번 부여하면 바꾸지 않음, 교체 이력 없음). 그림 있음/텍스트 캡처 분류: 그림·사진·도표가 있는 쪽만 내장했고 글만 있는 쪽·목차·표지는 제외했습니다. 기출 시험지(23학번)의 문항 그림은 확인하지 못했습니다.</p><div class="tw"><table class="t"><thead><tr><th>번호</th><th>종류</th><th>출처(자료·쪽)</th><th>사용처</th><th>내장</th><th>교체 이력</th></tr></thead><tbody>'+

document.addEventListener('click',function(ev){
